<style>

  --wall:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAACKklEQVR42s1WS2vDMAxWTS6LnTSshNLuxQ5lbIdddtr//xE7jq6wEcKgWZXkuoNAaJKd9lKYDyEWeln+PsmzzcOLD3MAAIAeO/6327bZjQM+Pb/iYS91lqs7KWH50P+MA2Y+zNtml/uSfPXYKT1liYc9Gee+JEnztYX0cgBAqsoX5y4PQUt6j5roAHJ9t58qd3uIqHcuiw4QikruF/WaY6isJ7Z8Ahvb4WEfPZpylPuSjaPeo2cFgNnV9UYdP2UPAOOAF3mAk9c44OzycgXnXNmiXlOJQlExBMcBb+8fU3VQJSV+pPQzrp2tYLSmLCewKmIeh+lR/DDeFXtS2ThpFsUig4cUiPmcOJtE+fgnwFFC9djlvuSvgi+zjGlEgHQ+zDl4iqLRupE7/lmu7sh8Ua9lirOr643F/ul4J9sJ/fPzgPArL0BdFwN/Gu+8QlE1X1vCwjhgJr0TtNWWXMvrUfNAcqJtdopVTnU0mUu9vLENKjo2GEisyfqOHFkSKF+SDXLbY/fdfk70YxeKqseOgnNkBl+0xEqyqNcf728p9jg5r7mysvur7Ehfhb/IA0kspfQ8ONrf/988ULiemAdMCJocVl+NClLLLKjlJJFyH+Z2cqjL4Bg9dmTu6Clg2691YdttFGmESb5np5KSKdM/0Y0ysB5ZPxRVNLnkRKOQtiwpTuFhb2mc+9Kl3n7Rp2ruy7bZTTzxbOfPZECekeOA0tEppbf6pHZ2HvwCp8Tb2/DcAdUAAAAASUVORK5CYII=");

  --notch:polygon(2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px),0 2px,2px 2px);
  --stair:polygon(0px 44px,4px 44px,4px 32px,8px 32px,8px 24px,12px 24px,12px 16px,16px 16px,16px 12px,24px 12px,24px 8px,32px 8px,32px 4px,44px 4px,44px 0px,calc(100% - 44px) 0px,calc(100% - 44px) 4px,calc(100% - 32px) 4px,calc(100% - 32px) 8px,calc(100% - 24px) 8px,calc(100% - 24px) 12px,calc(100% - 16px) 12px,calc(100% - 16px) 16px,calc(100% - 12px) 16px,calc(100% - 12px) 24px,calc(100% - 8px) 24px,calc(100% - 8px) 32px,calc(100% - 4px) 32px,calc(100% - 4px) 44px,calc(100% - 0px) 44px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  --stair-s:polygon(0px 20px,4px 20px,4px 12px,8px 12px,8px 8px,12px 8px,12px 4px,20px 4px,20px 0px,calc(100% - 20px) 0px,calc(100% - 20px) 4px,calc(100% - 12px) 4px,calc(100% - 12px) 8px,calc(100% - 8px) 8px,calc(100% - 8px) 12px,calc(100% - 4px) 12px,calc(100% - 4px) 20px,calc(100% - 0px) 20px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  --bg:#a9adb8; --panel:#d5d7dd; --panel2:#c0c3cc; --ink:#15141d; --muted:#484657; --line:#80838f; --frame:#15141d; --shade:#6c6f7c;
  --torch:#b24c18; --torchInk:#ffffff; --hp:#bd2b2f; --hpBack:#e2b4b2; --xp:#127a6a; --magic:#2650c0; --rare:#835400; --good:#1c7334; --bad:#b02626;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121119; --panel:#1c1a26; --panel2:#282636; --ink:#ebe2cc; --muted:#8e889e; --line:#3c394e; --frame:#c9bfa6; --shade:#07060b;
    --torch:#e0743a; --torchInk:#121119; --hp:#d8383a; --hpBack:#3a1418; --xp:#3fb8a5; --magic:#76a2ff; --rare:#f2c444; --good:#6ad27c; --bad:#ff6b5c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121119; --panel:#1c1a26; --panel2:#282636; --ink:#ebe2cc; --muted:#8e889e; --line:#3c394e; --frame:#c9bfa6; --shade:#07060b;
  --torch:#e0743a; --torchInk:#121119; --hp:#d8383a; --hpBack:#3a1418; --xp:#3fb8a5; --magic:#76a2ff; --rare:#f2c444; --good:#6ad27c; --bad:#ff6b5c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 21px/1.1 'VT323','Courier New',monospace;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:none;font-smooth:never}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[role="button"]:focus-visible{outline:2px dashed var(--torch);outline-offset:2px}
h1,h2,h3,h4,.disp{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;margin:0;letter-spacing:0}
p{margin:0}
svg[shape-rendering]{display:block}

/* HUD */
.hud{display:flex;gap:14px;align-items:center;padding:8px 14px;position:relative;background:var(--panel);border-bottom:2px solid var(--frame);z-index:5}
.hud-hp{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.hud b{font-weight:400;color:var(--muted)}
.bar{height:10px;background:var(--hpBack);border:2px solid var(--shade);flex:1;min-width:40px;position:relative}
.bar i{display:block;height:100%;width:0;transition:width .3s steps(5)}
.hpbar i{background:var(--hp) repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.28) 6px 8px)}
.hud-hp span{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-lv{display:flex;align-items:center;gap:6px;white-space:nowrap}
.xpbar{width:36px;flex:none;height:8px;background:var(--panel2)}
.xpbar i{background:var(--xp)}
.hud-gold{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;background:#e8b83a;box-shadow:inset -2px -2px 0 #9c6c10,inset 2px 2px 0 #ffe08a;clip-path:var(--notch);flex:none;display:inline-block}

/* Buttons */
.btn{border:2px solid var(--frame);background:var(--panel2);color:var(--ink);padding:6px 10px;min-height:44px;font-size:22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;clip-path:var(--notch);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),inset 2px 2px 0 rgba(255,255,255,.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.3)}
.btn.primary{background:var(--torch);color:var(--torchInk);border-color:var(--frame)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.sm{min-height:34px;padding:2px 10px;font-size:20px}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-decoration-thickness:2px;font-size:19px;padding:8px}

/* Dungeon */
.dun{display:flex;flex-direction:column;min-height:100%}
.floorbar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 0;color:var(--muted)}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:8px;height:8px;border:2px solid var(--muted)}
.pips i.done{background:var(--muted)}
.pips i.now{background:var(--torch);border-color:var(--torch)}
.pips i.champ{border-color:var(--hp)}
.plate{padding:2px 16px 0;text-align:center;cursor:pointer}
.mname{font-size:clamp(22px,6.8vw,30px);line-height:1.1;text-shadow:2px 2px 0 var(--shade)}
.mname.sm{font-size:21px}
.r-magic .afx{color:var(--magic)}
.r-rare .afx{color:var(--rare)}
.mmeta{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);margin-top:2px;font-size:19px}
.tag{padding:0 6px;border:2px solid currentColor;color:var(--ink);line-height:1.05}
.tag.magic{color:var(--magic)}
.tag.rare{color:var(--rare)}
.tag.champ{color:var(--hp)}
.mhp{position:relative;height:16px;margin:6px auto 0;max-width:260px;background:var(--hpBack);border:2px solid var(--shade)}
.mhp i{position:absolute;left:0;top:0;bottom:0;background:var(--hp) repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.28) 6px 8px);transition:width .3s steps(5)}
.mhp span{position:relative;display:block;font-size:17px;line-height:12px;text-align:center;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips:empty{display:none}
#monStatus{margin-top:6px}
.chip{font-size:18px;padding:0 6px;border:2px solid var(--line);background:var(--panel)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.good{color:var(--good);border-color:var(--good)}

.stage-frame{position:relative;margin:8px 14px 0;flex:none}
.stage-frame::before{content:"";position:absolute;inset:-2px;background:var(--frame);clip-path:var(--stair)}
.stage{position:relative;height:clamp(190px,34vh,290px);clip-path:var(--stair);background-color:#101017;background-image:radial-gradient(55% 55% at 50% 64%,rgba(255,160,80,.2),transparent 72%),linear-gradient(180deg,rgba(6,6,10,.7),rgba(6,6,10,0) 50%),var(--wall);background-size:auto,auto,128px 128px;image-rendering:pixelated;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background-image:linear-gradient(180deg,rgba(6,6,10,.75),rgba(6,6,10,.15) 45%,rgba(6,6,10,.55)),var(--floor);background-size:auto,128px 128px;image-rendering:pixelated;border-top:4px solid #0b0b10;pointer-events:none}
.stage::after{content:"";position:absolute;left:28%;right:28%;bottom:12%;height:6%;background:rgba(0,0,0,.5);clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);pointer-events:none}

/* Monster art + affix effects */
.mon-wrap{position:relative;width:min(54vw,200px);aspect-ratio:1;z-index:1}
.mon-wrap.mini{width:96px}
.mon-wrap .aura{position:absolute;inset:-14%;border-radius:50%;pointer-events:none}
.mon-wrap .sprite{position:absolute;inset:0;transition:transform .3s}
.mon-wrap .bob,.mon-wrap .ghost{position:absolute;inset:0}
.mon-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.mon-wrap img.px{width:100%;height:100%;display:block;image-rendering:pixelated;-webkit-user-drag:none;user-select:none}
.bob{animation:breathe 1.5s steps(1) infinite}
@keyframes breathe{0%{transform:translateY(0)}50%{transform:translateY(2.0833%)}}
.ghost{opacity:0}
.parts{position:absolute;inset:0;pointer-events:none;overflow:visible}
.parts span{position:absolute;bottom:12%;width:4px;height:4px;opacity:0;animation:rise-p 2.4s ease-in infinite}
@keyframes rise-p{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.9}100%{transform:translateY(-130px) scale(.4);opacity:0}}
.thorn-ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 16s linear infinite}

.fx-aged .sprite{filter:grayscale(.85) sepia(.45) contrast(.9) brightness(.95)}
.fx-giant .sprite{transform:scale(1.2)}
.fx-tiny .sprite{transform:scale(.64) translateY(22%)}
.fx-enraged .sprite{filter:sepia(1) saturate(5) hue-rotate(-42deg) drop-shadow(0 0 10px rgba(255,40,30,.75))}
.fx-armored .sprite{filter:grayscale(.55) contrast(1.25) brightness(1.1) drop-shadow(0 0 1.5px #d6dfea) drop-shadow(0 0 1.5px #d6dfea) drop-shadow(0 3px 0 #6b7686)}
.fx-ghostly .sprite{opacity:.5;filter:saturate(.35) brightness(1.35) drop-shadow(0 0 12px rgba(180,225,255,.95))}
.fx-ghostly .bob{animation:hover 3s ease-in-out infinite}
.fx-venomous .sprite{filter:sepia(1) saturate(3.5) hue-rotate(55deg) drop-shadow(0 0 8px rgba(120,255,80,.7))}
.fx-frenzied .bob{animation:jitter .16s steps(2) infinite}
.fx-shadow .sprite{filter:brightness(.22) contrast(1.4) drop-shadow(0 0 10px rgba(150,90,255,.95))}
.fx-ancient .sprite{filter:sepia(.7) saturate(1.8) drop-shadow(0 0 9px rgba(255,200,60,.95))}
.fx-sickly .sprite{filter:sepia(.55) hue-rotate(38deg) saturate(.65) brightness(.92)}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes jitter{0%{transform:translate(-1.5%,0) rotate(-1deg)}100%{transform:translate(1.5%,-1%) rotate(1deg)}}

.sfx-speed .ghost{opacity:.22;animation:streak .7s linear infinite}
.sfx-speed .ghost.g2{animation-delay:.35s}
@keyframes streak{0%{transform:translateX(0);opacity:.3}100%{transform:translateX(-22%);opacity:0}}
.sfx-ice .aura{background:radial-gradient(circle,rgba(150,225,255,.55),transparent 62%);animation:pulse 2.6s ease-in-out infinite}
.sfx-ice .parts span{background:#e8f8ff;box-shadow:0 0 6px #9fe0ff}
.sfx-fire .aura{background:radial-gradient(circle at 50% 62%,rgba(255,140,40,.6),transparent 60%);animation:flicker .2s ease-in-out infinite alternate}
.sfx-fire .parts span{background:#ffb347;box-shadow:0 0 8px #ff6a00}
.sfx-vampirism .aura{background:radial-gradient(circle,rgba(205,20,55,.55),transparent 60%);animation:pulse 1.5s ease-in-out infinite}
.sfx-bulwark .aura{inset:-4%;border:3px dashed rgba(160,190,230,.85);animation:spin 14s linear infinite}
.sfx-regeneration .parts span{background:#71e38f;box-shadow:0 0 6px #31c35b}
.sfx-wealth .parts span{background:#ffd54f;box-shadow:0 0 6px #ffb300;border-radius:1px;transform:rotate(45deg)}
.sfx-deep .aura{background:radial-gradient(circle,rgba(110,55,210,.6),transparent 66%);animation:pulse 3.2s ease-in-out infinite}
.sfx-fury .aura{background:radial-gradient(circle,rgba(255,45,25,.5),transparent 58%);animation:flicker .12s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes flicker{0%{opacity:.65;transform:scale(.97)}100%{opacity:1;transform:scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}

.mon-wrap.hit{animation:knock .32s ease-out}
.mon-wrap.hit .bob img{animation:flash .32s ease-out}
@keyframes knock{0%{transform:translateX(0)}30%{transform:translateX(7%)}60%{transform:translateX(-3%)}100%{transform:none}}
@keyframes flash{0%{filter:brightness(3)}100%{filter:none}}
.mon-wrap.lunge{animation:lunge .32s ease-out}
@keyframes lunge{0%{transform:none}40%{transform:translateY(8%) scale(1.08)}100%{transform:none}}
.mon-wrap.dying{animation:die .6s ease-in forwards}
@keyframes die{to{transform:translateY(18%) scale(.85);opacity:0;filter:blur(2px)}}


.floats{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
.fnum{position:absolute;top:34%;font-family:'VT323',monospace;font-size:38px;color:#fff;text-shadow:3px 3px 0 #000;animation:rise .9s steps(9) forwards;white-space:nowrap}
.fnum.crit{font-size:52px;color:#ffd34d}
.fnum.heal{color:#7ae89a}
.fnum.miss{font-size:26px;color:#d7dde6}
.fnum.poison{color:#a6e360}
.hero-floats .fnum{top:2px;font-size:26px;color:var(--hp);text-shadow:2px 2px 0 var(--shade)}
.hero-floats .fnum.heal{color:var(--good)}
.hero-floats .fnum.miss{color:var(--muted)}
@keyframes rise{0%{transform:translateY(8px);opacity:0}12%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(-44px);opacity:0}}
#app.ouch::after{content:"";position:absolute;inset:0;pointer-events:none;border:6px solid rgba(220,40,40,.8);animation:fadeout .35s steps(3) forwards;z-index:20}
@keyframes fadeout{to{opacity:0}}

.order{display:flex;align-items:center;gap:4px;padding:8px 16px 0;overflow:hidden;flex:none}
.order small{color:var(--muted);font-size:19px;margin-right:4px}
.oc{width:28px;height:28px;background:var(--panel);display:grid;place-items:center;flex:none;border:2px solid var(--line);overflow:hidden;font-size:16px}
.oc.p{background:var(--torch);border-color:var(--torch);color:var(--torchInk)}
.oc img{width:24px;height:24px;image-rendering:pixelated}
.oc.first{border-color:var(--frame)}
.log{list-style:none;margin:6px 16px 0;padding:0;font-size:20px;min-height:64px;color:var(--muted)}
.log li{padding:0}
.log li:first-child{color:var(--ink)}
.log li:first-child::before{content:"> ";color:var(--torch)}
.log b{font-weight:400;color:var(--rare)}

.actions{margin-top:auto;padding:8px 12px 12px;background-color:var(--panel);background-image:repeating-conic-gradient(rgba(127,127,127,.06) 0 25%,transparent 0 50%);background-size:4px 4px;border-top:2px solid var(--frame);flex:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}
.qs{min-height:48px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;gap:2px;padding:2px;clip-path:var(--notch)}
.qs svg{width:24px;height:24px}
.qs:active{transform:translateY(2px)}
.qs:disabled{opacity:.4}
.qs.empty{background:transparent;border-style:dashed;color:var(--muted)}
.r-magic.qs{color:var(--magic);border-color:var(--magic)}
.r-rare.qs{color:var(--rare);border-color:var(--rare)}
.btns{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px}
.btns .btn{padding:4px 4px;font-size:22px}

/* Panels */
.panel{padding:14px 16px}
.panel h2{font-size:36px;line-height:1.05;text-shadow:2px 2px 0 var(--shade)}
.panel .lead,.lead{color:var(--muted);margin-top:4px}
.rewards{display:flex;gap:8px;margin:12px 0 6px}
.reward{flex:1;background:var(--panel);border:2px solid var(--frame);padding:6px 10px;clip-path:var(--notch)}
.reward b{display:block;font-weight:400;font-size:30px;line-height:1}
.reward span{color:var(--muted);font-size:18px}
.section-h{font-size:21px;margin:16px 0 6px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.empty-note{color:var(--muted);font-size:19px;padding:8px 0}

/* Item rows + grid */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;background:var(--panel);border:2px solid var(--line);clip-path:var(--notch)}
.rowmain{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.ico{width:36px;height:36px;background:var(--panel2);display:grid;place-items:center;flex:none;border:2px solid var(--line)}
.ico svg{width:24px;height:24px}
.r-magic .ico{color:var(--magic);border-color:var(--magic)}
.r-rare .ico{color:var(--rare);border-color:var(--rare)}
.nm{line-height:1}
.sub{font-size:18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{aspect-ratio:1;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;position:relative;padding:0}
.cell svg{width:36px;height:36px}
.cell.r-magic{color:var(--magic);border-color:var(--magic)}
.cell.r-rare{color:var(--rare);border-color:var(--rare)}
.cell.empty{background:transparent;border-style:dashed}
.cell .lv{position:absolute;right:4px;bottom:0;font-size:16px;color:var(--muted)}

/* Town */
.town{padding:16px 16px 24px}
.town h1{font-size:44px;line-height:1;text-shadow:3px 3px 0 var(--shade)}
.gate-frame{margin:16px 0 0}
.gate{position:relative;clip-path:var(--stair);background-color:#101017;background-image:radial-gradient(60% 60% at 50% 90%,rgba(255,160,80,.25),transparent 75%),linear-gradient(180deg,rgba(6,6,10,.75),rgba(6,6,10,.1)),var(--wall);background-size:auto,auto,128px 128px;image-rendering:pixelated;padding:56px 18px 18px;text-align:center}
.gate p{color:#d8d0bc;font-size:19px;margin-top:10px;text-shadow:2px 2px 0 #000}
.gate .depth{font-size:22px;color:#ebe2cc;margin-bottom:12px;text-shadow:2px 2px 0 #000}
.gate .btn{border-color:#ebe2cc}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--panel);border:2px solid var(--frame);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;clip-path:var(--notch);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.tile:active{transform:translateY(2px)}
.tile svg{width:36px;height:36px;color:var(--torch)}
.tile b{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:20px;line-height:1.1}
.tile span{font-size:16px;color:var(--muted);line-height:1}
.eqsum{margin-top:6px}
.foot{text-align:center;margin-top:16px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);padding:4px 0;font-size:20px}
.back svg{width:16px;height:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--frame);margin:12px 0}
.seg button{border:0;background:var(--panel);padding:6px;color:var(--muted);font-size:22px}
.seg button.on{background:var(--ink);color:var(--bg)}
.price{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(6,5,10,.6);opacity:0;transition:opacity .15s steps(3)}
#sheetWrap .sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:88%;overflow-y:auto;background:var(--bg);border:2px solid var(--frame);border-bottom:0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s steps(5)}
#sheetWrap.open{pointer-events:auto}
#sheetWrap.open .backdrop{opacity:1}
#sheetWrap.open .sheet{transform:none}
.grab{width:40px;height:4px;background:var(--line);margin:0 auto 10px}
.ihead{display:flex;gap:12px;align-items:center}
.ihead .ico{width:56px;height:56px}
.ihead .ico svg{width:36px;height:36px}
.ihead h3{font-size:23px;line-height:1.1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.stat{background:var(--panel);border:2px solid var(--line);padding:4px 8px}
.stat span{display:block;font-size:17px;color:var(--muted)}
.stat b{font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.affix{margin:10px 0;padding:8px 10px;background:var(--panel);border:2px solid var(--line)}
.affix h4{margin:0 0 2px;font-size:19px;line-height:1.15}
.affix h4 small{font-family:'VT323',monospace;font-size:18px;color:var(--muted);margin-left:8px}
.r-magic .affix h4,.affix.magic h4{color:var(--magic)}
.r-rare .affix h4,.affix.rare h4{color:var(--rare)}
.affix ul{list-style:none;margin:0;padding:0;font-size:20px}
.affix li::before{content:"- "}
.up{color:var(--good)}
.down{color:var(--bad)}
.flavor{color:var(--muted);margin-top:8px}
.cmp{font-size:19px;margin:8px 0 0;padding:6px 10px;background:var(--panel);border:2px dashed var(--line)}
.cmp b{font-weight:400;color:var(--ink)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sheet-actions .btn:only-child{grid-column:1/-1}
.msheet-head{display:flex;gap:12px;align-items:center}
.mini-stage{width:104px;height:104px;clip-path:var(--stair-s);background-color:#101017;background-image:radial-gradient(60% 60% at 50% 65%,rgba(255,160,80,.2),transparent 75%),var(--wall);background-size:auto,96px 96px;image-rendering:pixelated;display:grid;place-items:center;flex:none;overflow:hidden}
.abil{display:flex;flex-direction:column;gap:6px}
.abil div{background:var(--panel);border:2px solid var(--line);padding:4px 10px}
.abil b{display:block;font-weight:400;color:var(--ink)}
.abil span{font-size:19px;color:var(--muted)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translate(-50%,-12px);background:var(--panel);color:var(--ink);border:2px solid var(--frame);padding:6px 12px;font-size:20px;opacity:0;pointer-events:none;transition:opacity .15s steps(2),transform .15s steps(2);z-index:60;max-width:88%;text-align:center;clip-path:var(--notch)}
#toast.show{opacity:1;transform:translate(-50%,0)}


/* Inventory, comparison, loot */
.sheet-title{font-size:27px;line-height:1.1;margin-bottom:8px}
.afx.neg,.r-magic .afx.neg,.r-rare .afx.neg{color:var(--bad)}
.doll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:1;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;color:var(--ink)}
.slot svg{width:30px;height:30px}
.slot span{font-size:15px;color:var(--muted);line-height:1}
.slot.empty{border-style:dashed}
.slot.empty svg{opacity:.22}
.slot.r-magic{color:var(--magic);border-color:var(--magic)}
.slot.r-rare{color:var(--rare);border-color:var(--rare)}
.slot:active{transform:translateY(2px)}
.grid{grid-template-columns:repeat(5,1fr)}
.cell svg{width:30px;height:30px}
.upmark{position:absolute;left:4px;top:1px;font-size:15px;color:var(--good)}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmpgrid.one{grid-template-columns:1fr}
.card{background:var(--panel);border:2px solid var(--frame);padding:6px 8px;min-width:0}
.card.cur{border:2px dashed var(--line)}
.card .k{font-size:16px;color:var(--muted)}
.card .cn{font-size:21px;line-height:1;margin:2px 0}
.card ul{list-style:none;margin:4px 0 0;padding:0;font-size:18px;line-height:1.05}
.card .basel li{color:var(--ink)}
.card .afh{margin-top:6px;font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:16px;line-height:1.1}
.card.r-magic .afh{color:var(--magic)}
.card.r-rare .afh{color:var(--rare)}
.card .afh.negh{color:var(--bad)}
.delta{margin-top:8px;background:var(--panel);border:2px solid var(--frame);padding:6px 10px}
.delta h4{font-size:17px;line-height:1.2;margin-bottom:2px}
.delta ul{list-style:none;margin:0;padding:0;font-size:19px;columns:2;column-gap:12px}
.delta li{break-inside:avoid}
.delta .up::before{content:"▲ "}
.delta .down::before{content:"▼ "}
.sheet-actions .btn:last-child:nth-child(odd){grid-column:1/-1}

/* Extra monster affix looks */
.fx-feeble .sprite{filter:saturate(.45) brightness(.85);transform:scale(.92) translateY(4%)}
.fx-lame .sprite{transform:rotate(-7deg) translateY(3%)}
.fx-blind .sprite{filter:contrast(.75) brightness(1.08) grayscale(.35)}
.fx-wounded .sprite{transform:rotate(5deg);filter:drop-shadow(0 4px 0 rgba(140,10,10,.8)) saturate(.8)}
.fx-young .sprite{transform:scale(.78) translateY(14%);filter:brightness(1.1) saturate(1.15)}
.fx-brittle .sprite{filter:contrast(1.35) brightness(1.2) sepia(.25)}
.fx-quick .bob{animation-duration:.55s}
.fx-starved .sprite{transform:scale(.86,1.04);filter:brightness(.9) saturate(.8)}
.fx-vicious .sprite{filter:drop-shadow(2px 0 0 #a01010) drop-shadow(-2px 0 0 #a01010) drop-shadow(0 -2px 0 #a01010)}
.fx-plagued .sprite{filter:sepia(.6) hue-rotate(40deg) saturate(1.5) brightness(.8)}
.fx-cunning .sprite{filter:hue-rotate(-25deg) saturate(1.3) drop-shadow(0 0 6px rgba(240,200,60,.6))}
.fx-elder .sprite{transform:scale(1.12);filter:grayscale(.35) drop-shadow(0 0 2px #e8e0cc)}
.sfx-weakness .aura{background:radial-gradient(circle,rgba(150,150,160,.35),transparent 60%)}
.sfx-sloth .bob{animation-duration:3.2s}
.sfx-frailty .bob{opacity:.82}
.sfx-fragility .aura{inset:2%;border:2px dashed rgba(200,200,210,.45)}
.sfx-clumsiness .bob{animation:wobble 1.6s steps(2) infinite}
@keyframes wobble{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}
.sfx-poverty .parts span{background:#8a8378;opacity:.5}
.sfx-venom .aura{background:radial-gradient(circle,rgba(110,220,60,.45),transparent 60%);animation:pulse 1.8s steps(4) infinite}
.sfx-venom .parts span{background:#8fe05a}
.sfx-shadows .aura{background:radial-gradient(circle,rgba(25,5,45,.85),transparent 65%)}
.sfx-shadows .bob{opacity:.75}
.sfx-fortitude .aura{inset:0;border:3px solid rgba(240,200,90,.55)}
.sfx-ruin .aura{background:radial-gradient(circle,rgba(120,10,10,.6),transparent 62%);animation:flicker .2s steps(2) infinite alternate}
.sfx-lightning .aura{background:radial-gradient(circle,rgba(170,210,255,.55),transparent 58%);animation:flicker .09s steps(2) infinite alternate}
.sfx-lightning .parts span{background:#e6f2ff;box-shadow:0 0 6px #8fc4ff}


/* Humanoid prefixes */
.fx-dark .sprite{filter:brightness(.45) contrast(1.25) drop-shadow(0 0 6px rgba(90,40,160,.9))}
.fx-evil .sprite{filter:saturate(1.3) drop-shadow(0 0 2px #c01818) drop-shadow(0 0 8px rgba(200,20,20,.7))}
.fx-hideous .sprite{filter:sepia(.5) hue-rotate(50deg) saturate(1.6) contrast(1.2);transform:scale(1.05,.95) skewX(-4deg)}
.fx-bulked .sprite{transform:scale(1.2,1.1) translateY(-4%)}
.fx-avenged .sprite{filter:grayscale(.45) drop-shadow(0 0 3px rgba(255,70,40,.95)) drop-shadow(0 0 1px rgba(255,70,40,.95))}
.fx-holy .sprite{filter:brightness(1.12) sepia(.25) drop-shadow(0 0 8px rgba(255,225,140,.95))}
.fx-holy .sprite::before{content:"";position:absolute;left:36%;right:36%;top:-2%;height:5%;border:3px solid rgba(255,220,120,.95);z-index:2;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}

/* Species traits */
.afxov .afn.trait{color:#c9bfa6}
.affix.trait h4{color:var(--ink)}
.mon-wrap.raging .bob{filter:drop-shadow(0 0 6px rgba(255,40,30,.85)) drop-shadow(0 0 2px rgba(255,40,30,.9))}
.mon-wrap.raging .sprite{animation:jitter .2s steps(2) infinite}

/* Loot row buttons */
.rbtns{display:flex;gap:4px;flex:none}
.btn.drink{border-color:var(--good);color:var(--good)}

/* Fight screen fills the viewport: the arena takes whatever height is left, so nothing scrolls */
.dun.fight{height:100%;min-height:540px}
.dun.fight .stage-frame{flex:1 1 auto;min-height:150px;max-height:460px;display:flex;flex-direction:column}
.dun.fight .stage{height:auto;flex:1;min-height:0;container-type:size}
.dun.fight .mon-wrap{width:min(62cqw,84cqh,250px)}
.dun.fight .log{min-height:3.4em;max-height:3.4em;overflow:hidden;margin-top:4px}
.dun.fight .order{padding-top:6px}
.dun.fight .plate{flex:none}
.dun.fight .mname{font-size:clamp(21px,6.4vw,28px)}
@media (max-height:700px){
  .dun.fight .mname{font-size:clamp(19px,5.6vw,24px)}
  .dun.fight .quick{margin:4px 0 6px}
  .dun.fight .qs{min-height:42px}
  .dun.fight .btns .btn{min-height:40px}
  .dun.fight .floorbar{padding-top:4px}
}

/* Affix overlay on the left side of the arena (the arena is always dark, so colors are fixed) */
.afxov{position:absolute;left:8px;top:46px;z-index:2;display:flex;flex-direction:column;gap:4px;max-width:46%;max-height:calc(100% - 54px);overflow:hidden;pointer-events:none;font-size:17px;line-height:1.05}
.afxov .ao{background:rgba(8,8,12,.78);border:2px solid rgba(201,191,166,.35);padding:2px 6px 3px;color:#ebe2cc}
.afxov .ao b{display:block;font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:1em;line-height:1.15;margin-bottom:1px}
.afxov .ao span{display:block}
.afxov .up{color:#6ad27c}
.afxov .down{color:#ff6b5c}
.afxov.r-magic .afx{color:#84b2ff}
.afxov.r-rare .afx{color:#f2c444}
.afxov .afn.champ{color:#ff6b5c}

/* Health bar colors */
.hpbar,.mhp{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.hpbar i,.mhp i{transition:width .35s steps(6),background-color .2s steps(1)}
.hpbar i.low,.mhp i.low{animation:lowblink .5s steps(1) infinite}
@keyframes lowblink{50%{opacity:.35}}

/* After a fight: loot or move on, inventory in the footer */
.after-main{flex:1}
.gains{display:flex;gap:16px;align-items:center;margin-top:6px;font-size:21px}
.noloot{border:2px dashed var(--line);padding:16px;text-align:center;color:var(--muted);margin-top:14px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 12px;background:var(--panel);border-top:2px solid var(--frame)}
.choice .btn{min-height:54px;font-size:24px}
.choice .span2{grid-column:1/-1}
.choice-note{grid-column:1/-1;text-align:center}
.runfoot{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-top:2px solid var(--line)}
.footbtn{background:none;border:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;color:var(--muted);font-size:20px}
.footbtn + .footbtn{border-left:2px solid var(--line)}
.footbtn svg{width:20px;height:20px}
.footbtn:active{color:var(--ink)}

/* Character stats */
.hud-lv{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.ptsdot{color:var(--bg);background:var(--good);padding:0 4px;margin-left:2px}
.tiles{grid-template-columns:1fr 1fr}
.pts{border:2px solid var(--good);color:var(--good);padding:4px 10px;margin:8px 0;clip-path:var(--notch)}
.legend{margin:-2px 0 6px}
.sgroup{margin-bottom:6px}
.srow{display:flex;align-items:center;background:var(--panel);border:2px solid var(--line)}
.sgroup.open .srow{border-color:var(--frame)}
.smain{flex:1;display:grid;grid-template-columns:1fr auto 6.5ch 12px;align-items:center;gap:8px;background:none;border:0;padding:5px 10px;text-align:left;font-size:21px;color:var(--ink);min-height:40px}
.sv{font-variant-numeric:tabular-nums;text-align:right}
.mod{font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.mod.zero{color:var(--muted)}
.caret{color:var(--muted);display:inline-block;transition:transform .1s steps(2)}
.sgroup.open .caret{transform:rotate(90deg)}
.raise{margin-right:6px;min-height:32px;padding:0 10px;border-color:var(--good);color:var(--good)}
.sbreak{border:2px solid var(--frame);border-top:0;padding:6px 10px 4px;background:var(--bg)}
.sbreak ul{list-style:none;margin:6px 0 0;padding:0;font-size:19px}
.sbreak li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:2px dotted var(--line)}
.sbreak li.tot{border-bottom:0;color:var(--ink)}
.sbreak small{color:var(--muted)}
.sbreak b{font-weight:400;white-space:nowrap}
.gname{color:var(--ink)}
.r-magic.gname .afx,.r-magic .afx{color:var(--magic)}
.abil .up{color:var(--good)}
.abil .down{color:var(--bad)}


/* ===== Split fight screen: monster on the left, its stats on the right. Fixed layout. ===== */
.dun.fight{height:100%;min-height:560px}
.dun.fight .arena{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:8px;padding:6px 12px 0}
.dun.fight .arena .stage-frame{margin:0;height:100%;min-height:0;max-height:none;display:flex;flex-direction:column}
.dun.fight .arena .stage{flex:1;height:auto;min-height:0;container-type:size}
.dun.fight .arena .mon-wrap{width:min(94cqw,78cqh,240px)}
.mpanel{min-height:0;height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:2px solid var(--frame);padding:6px 8px;font-size:17px;line-height:1.1;scrollbar-width:thin}
.mpanel .pname{font-size:clamp(15px,4.4vw,19px);line-height:1.12;text-shadow:none}
.mpanel .pmeta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;color:var(--muted);font-size:16px;margin-top:3px}
.mpanel .pmeta .tag{font-size:14px;padding:0 4px}
.mpanel .mhp{margin:6px 0 0;max-width:none;height:14px}
.mpanel .mhp span{font-size:15px;line-height:10px}
.mpanel .pchips{justify-content:flex-start;margin-top:4px;min-height:0}
.mpanel .pchips .chip{font-size:15px}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:6px 0 2px;padding:4px 0;border-top:2px dotted var(--line);border-bottom:2px dotted var(--line)}
.pst{display:flex;justify-content:space-between;gap:4px;font-size:16px}
.pst span{color:var(--muted)}
.pst b{font-weight:400;font-variant-numeric:tabular-nums}
.pst.buffed b{color:var(--bad)}
.pst.buffed b::after{content:"▲";font-size:11px;margin-left:1px}
.pst.nerfed b{color:var(--good)}
.pst.nerfed b::after{content:"▼";font-size:11px;margin-left:1px}
.psec{margin-top:6px}
.psec > b{display:block;font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:14px;line-height:1.2}
.psec b.champ{color:var(--hp)}
.psec b.trait{color:var(--ink)}
.mpanel.r-magic .psec b.afx{color:var(--magic)}
.mpanel.r-rare .psec b.afx{color:var(--rare)}
.psec ul{list-style:none;margin:1px 0 0;padding:0;font-size:16px}
.pabil li{color:var(--muted);margin-bottom:3px}
.pabil li b{font-weight:400;color:var(--ink)}
.pfoot{color:var(--muted);font-size:15px;margin-top:8px}
/* fixed-height rows so the menus never move */
.dun.fight .order{height:40px;flex:none;padding-top:6px}
.dun.fight .log{height:3.4em;min-height:3.4em;max-height:3.4em;overflow:hidden;flex:none}
.dun.fight #heroStatus{display:flex;height:22px;overflow:hidden;justify-content:center}
.dun.fight #heroStatus:empty{display:flex}

/* Monster box matches the stats panel: square corners, same 2px frame */
.dun.fight .arena .stage-frame::before{content:none}
.dun.fight .arena .stage{clip-path:none;border:2px solid var(--frame);box-sizing:border-box}

/* ===== Monsters stand still. Only hits, attacks and deaths animate. ===== */
.mon-wrap .bob,.mon-wrap .sprite,.mon-wrap .aura,.mon-wrap .thorn-ring{animation:none !important}
.mon-wrap .ghost{animation:none !important;opacity:.16;transform:translateX(-9%)}
.mon-wrap .ghost.g2{opacity:.08;transform:translateX(-18%)}
.mon-wrap .parts span{animation:none !important;opacity:.75}
.mon-wrap .parts span:nth-child(3n){bottom:42%}
.mon-wrap .parts span:nth-child(3n+1){bottom:64%}
.mon-wrap .parts span:nth-child(3n+2){bottom:24%}
.mon-wrap.hit,.mon-wrap.lunge{animation:none}
.mon-wrap.hit .bob img{animation:flash .3s steps(2)}
.mon-wrap.lunge .bob img{animation:redflash .3s steps(2)}
@keyframes redflash{0%{filter:sepia(1) saturate(5) hue-rotate(-35deg) brightness(1.2)}100%{filter:none}}


/* ===== Exploration: room map ===== */
.floorbar .fname{background:none;border:0;color:var(--rare);font-size:18px;padding:0;text-align:right;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dun.explore{height:100%;min-height:520px}
.roommap{position:relative;flex:1 1 auto;min-height:0;margin:6px 12px 0;border:2px solid var(--frame);overflow:auto;display:flex;background-color:#0b0b10;background-image:linear-gradient(rgba(6,6,10,.84),rgba(6,6,10,.84)),var(--floor);background-size:auto,96px 96px;image-rendering:pixelated;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mapinner{position:relative;flex:none;margin:auto}
.ln{position:absolute;background:#3a3848}
.ln.h{height:4px}
.ln.v{width:4px}
.ln.walked{background:#b8ae94}
.room{position:absolute;width:62px;height:62px;padding:0;border:2px solid #45414f;background:#14131b;display:grid;place-items:center;cursor:pointer;clip-path:var(--notch);color:#c9bfa6}
.room img{width:46px;height:46px;image-rendering:pixelated}
.room .q{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:24px;color:#6a667a}
.room.seen{background:#1d1b26;border-color:#6a6478}
.room.adj{border-color:#e8dcb8;background:#24212e}
.room.here{border-color:#e0743a;background:#2c1d14;box-shadow:inset 0 0 0 2px #e0743a}
.room.danger{border-color:#d8383a}
.room.danger.magic{border-color:#76a2ff}
.room.danger.rare{border-color:#f2c444}
.room.done img{opacity:.35;filter:grayscale(1)}
.room[aria-disabled="true"]{cursor:default}
.room:active{transform:translateY(2px)}
.room .rl{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:13px;line-height:1.05;color:#d8d0bc;background:rgba(6,6,10,.8);padding:1px 0}
.room .you{position:absolute;top:0;left:0;right:0;text-align:center;font-size:12px;line-height:1.1;background:#e0743a;color:#121119}
.xactions{padding-top:8px}
.rpanel{display:flex;gap:10px;align-items:center;height:86px;overflow:hidden}
.rart{width:72px;height:72px;flex:none;background:#0b0b10;border:2px solid var(--line);display:grid;place-items:center}
.rart img{width:64px;height:64px;image-rendering:pixelated}
.rtext{min-width:0;flex:1}
.rtext h3{font-size:18px;line-height:1.1}
.rpanel.r-magic .rtext h3 .afx{color:var(--magic)}
.rpanel.r-rare .rtext h3 .afx{color:var(--rare)}
.rtext p{font-size:18px;line-height:1.1;color:var(--muted);margin-top:3px;max-height:3.3em;overflow:hidden}
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:48px;margin:8px 0 2px}
.ctx .btn{min-height:48px}
.ctx .span2{grid-column:1/-1}
.ctx .idle{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted);border:2px dashed var(--line);font-size:18px}


/* ===== Gold values, spent points, top-bar inventory, Guild Hall ===== */
.hud{gap:8px;padding:8px 10px}
.hud-hp b{display:none}
.hud-hp span{font-size:18px}
.hud .xpbar{width:26px}
.hud .ptsdot{font-size:15px;padding:0 3px}
.hud-bag{font-size:18px}
.hud-gold{font-size:19px}
.hud-bag{display:flex;align-items:center;gap:4px;background:none;border:2px solid var(--line);padding:0 5px;color:var(--ink);font:inherit;min-height:28px;flex:none}
.hud-bag svg{width:16px;height:16px;color:var(--torch)}
.hud-bag.full{border-color:var(--bad);color:var(--bad)}
.worth{display:inline-flex;align-items:center;gap:4px;font-size:20px;color:var(--rare);border:2px solid currentColor;padding:0 5px;flex:none;font-variant-numeric:tabular-nums}
.cell .cv{position:absolute;left:4px;bottom:1px;display:inline-flex;align-items:center;gap:3px;font-size:14px;line-height:1;color:var(--rare);font-variant-numeric:tabular-nums}
.btn.equipnow{background:#2f8a46;color:#ffffff;border-color:var(--frame)}
.cell .cv .coin{width:9px;height:9px}
.statline{display:flex;flex-wrap:wrap;gap:2px 14px;margin:8px 0 4px;padding:6px 8px;border:2px solid var(--line);background:var(--panel);font-size:18px;color:var(--muted);cursor:pointer}
.statline b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.cardworth{display:inline-flex;align-items:center;gap:6px;margin:4px 0 2px;font-size:22px;color:var(--rare);border:2px solid currentColor;padding:0 6px}
.cardworth span:last-child{font-size:15px;color:var(--muted)}
.bagworth{margin:0 0 8px;color:var(--muted)}
.bagworth .price{color:var(--rare);font-size:22px}
.spent{font-style:normal;font-size:15px;color:var(--good);border:2px solid var(--good);padding:0 4px;margin-left:4px;vertical-align:1px}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;text-align:left}
.tile.wide span{max-width:16ch}
.upg{align-items:center;padding:8px 10px}
.upgtext{flex:1;min-width:0}
.upips{display:inline-flex;gap:3px;vertical-align:2px}
.upips i{width:9px;height:9px;border:2px solid var(--muted)}
.upips i.on{background:var(--torch);border-color:var(--torch)}
.now{color:var(--good)}
.maxed{color:var(--good);border:2px solid var(--good);padding:0 6px;flex:none}


/* ===== stacks and the belt ===== */
.qty{color:var(--rare);font-size:18px}
.cell .qx{position:absolute;right:4px;top:1px;font-size:14px;color:var(--ink);background:rgba(0,0,0,.35);padding:0 2px;line-height:1.1}


/* ===== Town map, buildings, quests, records ===== */
.dun.townmap{height:100%;min-height:520px}
.room.bld{background:#1d1b26;border-color:#8a8270}
.room.bld img{width:46px;height:46px;margin-bottom:8px}
.room.bld.gatebld{border-color:#e0743a;background:#2c1d14}
.tbadge{position:absolute;top:0;right:0;min-width:16px;height:16px;line-height:16px;font-size:14px;text-align:center;background:#c9bfa6;color:#121119}
.tbadge.ready{background:#6ad27c}
.tquests{height:86px;overflow:hidden;font-size:18px;line-height:1.15;color:var(--muted)}
.tquests b{font-weight:400}
.bhead{display:flex;gap:12px;align-items:center;margin-top:6px}
.bhead img{width:72px;height:72px;image-rendering:pixelated;flex:none;background:#0b0b10;border:2px solid var(--line)}
.bhead h1{font-size:30px}
.quest .qd{font-size:15px;padding:0 5px;border:2px solid currentColor}
.quest.easy .qd{color:var(--good)}
.quest.medium .qd{color:var(--rare)}
.quest.hard .qd{color:var(--bad)}
.qbar{position:relative;height:14px;margin-top:4px;background:var(--panel2);border:2px solid var(--line)}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:var(--xp)}
.qbar span{position:relative;display:block;text-align:center;font-size:14px;line-height:10px;color:var(--ink)}
.killgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kill{display:flex;flex-direction:column;align-items:center;padding:4px;background:var(--panel);border:2px solid var(--line);font-size:15px;line-height:1.1;text-align:center}
.kill img{width:40px;height:40px;image-rendering:pixelated}
.kill b{font-weight:400;color:var(--rare);font-size:18px}



/* ===== Town v2: fits the screen, no scrolling; quest givers ===== */

.tb .tlabel{bottom:-4px}
.ember{position:absolute;width:3px;height:3px;background:#ff5020;pointer-events:none;animation:ember 2.8s steps(6) infinite}
@keyframes ember{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.tb.tgate .tlabel{background:#8a1a14;color:#ffd0c0;border-color:#c83a2a}
.npccard{display:flex;gap:10px;align-items:center;margin-top:18px;padding:8px;background:var(--panel);border:2px solid var(--frame)}

.thit{position:absolute;aspect-ratio:1;padding:0;border:0;background:transparent;cursor:pointer;clip-path:polygon(50% 26%,90% 56%,90% 80%,50% 98%,10% 80%,10% 56%)}
.thit:active + .tb, .thit:active{background:rgba(255,220,150,.08)}
.tb.iso .tbadge{top:22%;right:22%}
.thero::after{top:-12px}

/* ===== Town scene ===== */
.townwrap{position:relative;flex:1 1 auto;min-height:0;margin:6px 12px 0;border:2px solid var(--frame);overflow-y:auto;overflow-x:hidden;background:#0c140e;overscroll-behavior:contain}
.townscene{position:relative;background-size:100% 100%;image-rendering:pixelated}
.tb{position:absolute;padding:0;border:0;background:none;cursor:pointer;display:block;aspect-ratio:1}
.tb img{width:100%;height:100%;image-rendering:pixelated;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.tb:active img{transform:translateY(2px)}
.tb .tlabel{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;font-size:14px;line-height:1.1;padding:0 4px;background:rgba(10,8,14,.85);color:#ebe2cc;border:1px solid rgba(201,191,166,.5)}
.tb.tgate .tlabel{background:#e0743a;color:#121119;border-color:#e0743a}
.tb .tbadge{top:2px;right:2px;width:18px;height:18px;line-height:18px;font-size:16px;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.lampglow{position:absolute;width:18px;height:18px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,110,.6),rgba(255,180,70,0) 70%);pointer-events:none;animation:flick 1.6s steps(3) infinite}
@keyframes flick{0%{opacity:.75}50%{opacity:1}75%{opacity:.6}}
.smoke{position:absolute;width:5px;height:5px;background:rgba(160,160,170,.55);pointer-events:none;animation:smoke 4s steps(8) infinite}
@keyframes smoke{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}100%{transform:translate(8px,-34px);opacity:0}}
.spark{position:absolute;width:3px;height:3px;background:#bfe8ff;pointer-events:none;animation:spark 2.2s steps(4) infinite}
@keyframes spark{0%,100%{opacity:0}40%{opacity:1;transform:translateY(-6px)}}
.npc{position:absolute;width:13.4%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;left:var(--x1);animation:npcmove 18s linear infinite alternate}
.npc img{width:100%;height:100%;image-rendering:pixelated;animation:npcflip 36s steps(1) infinite, step .5s steps(2) infinite}
.npcB{animation-duration:23s}.npcB img{animation-duration:46s,.5s}
.npcC{animation-duration:15s}.npcC img{animation-duration:30s,.5s}
@keyframes npcmove{from{left:var(--x1)}to{left:var(--x2)}}
@keyframes npcflip{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes step{50%{margin-top:-2px}}
.thero{position:absolute;width:7.4%;aspect-ratio:1;pointer-events:none;z-index:3}
.thero img{width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.thero::after{content:"YOU";position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:12px;line-height:1;background:#e0743a;color:#121119;padding:1px 3px}
.thero.flip img{transform:scaleX(-1)}
.thero.walking img{animation:step .25s steps(2) infinite}
.townpanel .tquests{height:64px;cursor:pointer}

/* ===== Shopkeepers ===== */
.town h1.bname{font-size:24px;line-height:1.1;margin:4px 0 8px;color:var(--muted);text-shadow:none}
.keeper{display:flex;gap:10px;align-items:stretch}
.kface{width:44%;max-width:180px;aspect-ratio:1;flex:none;background:#0b0b10;border:2px solid var(--frame);overflow:hidden}
.kface img{width:100%;height:100%;image-rendering:pixelated;display:block}
.kbox{position:relative;flex:1;min-width:0;background:var(--panel);border:2px solid var(--frame);padding:8px 10px;display:flex;flex-direction:column}
.kbox::before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--frame);border-left:0}
.kname{font-family:'Pixelify Sans','VT323',monospace;font-weight:600;font-size:19px;line-height:1.1}
.ktitle{font-size:16px;color:var(--muted);line-height:1.1}
.kbox p{margin-top:8px;font-size:20px;line-height:1.15;color:var(--ink)}
.matrow{display:flex;gap:10px;align-items:center;margin-top:10px;padding:6px 10px;border:2px solid var(--good);background:var(--panel)}
.mgem{width:14px;height:14px;flex:none;background:var(--good);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.statline.pending b{color:var(--good)}

<div id="app">
  <header class="hud" id="hud">
    <div class="hud-hp"><b>HP</b><div class="bar hpbar"><i id="hpFill"></i></div><span id="hpTxt"></span></div>
    <button class="hud-lv" data-act="stats" aria-label="Open character stats"><span id="lvTxt"></span><div class="bar xpbar"><i id="xpFill"></i></div></button>
    <button class="hud-bag" id="hudBag" data-act="bag" aria-label="Open inventory"><span id="bagIco"></span><span id="bagTxt"></span></button>

  </header>
  <main id="view"></main>
</div>
<div id="sheetWrap" aria-hidden="true"><div class="backdrop" data-act="closeSheet"></div><section class="sheet" id="sheet" role="dialog"></section></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ helpers ============ */
const SAVE_KEY = 'affix-deep-v2';
const BAG_BASE = 20;
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,10);
const sleep = ms => new Promise(r => setTimeout(r, window.__fast ? 0 : ms));
const MINUS = '\u2212';
const sgn = v => v > 0 ? '+' + v : v < 0 ? MINUS + Math.abs(v) : '0';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function weighted(arr){ const t = arr.reduce((a,x)=>a+(x.w||1),0); let r = Math.random()*t; for(const x of arr){ r -= (x.w||1); if(r <= 0) return x; } return arr[arr.length-1]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const article = n => /^[AEIOU]/i.test(n) ? 'An' : 'A';

const THORNS = (()=>{ let d=''; for(let i=0;i<16;i++){ const a=i/16*Math.PI*2; const p=(r,g)=>`${(50+r*Math.cos(g)).toFixed(1)} ${(50+r*Math.sin(g)).toFixed(1)}`; d+=`M${p(42,a-.13)} L${p(50,a)} L${p(42,a+.13)}Z `; } return `<svg viewBox="0 0 100 100" class="thorn-ring"><circle cx="50" cy="50" r="42" fill="none" stroke="#7c9a3c" stroke-width="2.5"/><path d="${d}" fill="#7c9a3c"/></svg>`; })();


/* ============ icons (12x12 pixel grids: # = item color, r = red, y = gold, w = highlight, d = shade) ============ */
function PI(rows){
  const hgt = rows.length, wid = rows[0].length, paths = {};
  rows.forEach((r,y) => { for(let x=0;x<wid;){ const c = r[x]; if(c==='.'||c===undefined){ x++; continue; } let n = 1; while(x+n<wid && r[x+n]===c) n++; (paths[c] = paths[c]||[]).push(`M${x} ${y}h${n}v1h-${n}z`); x += n; } });
  const col = {'#':'currentColor', r:'#d8423a', y:'#e8b83a', w:'#f2ead8', d:'rgba(0,0,0,.45)'};
  return `<svg viewBox="0 0 ${wid} ${hgt}" shape-rendering="crispEdges" aria-hidden="true">${Object.entries(paths).map(([c,d]) => `<path fill="${col[c]}" d="${d.join('')}"/>`).join('')}</svg>`;
}

function rollRarity(level){
  const r = Math.random(), rare = Math.min(.32, .08 + level*.022), magic = .38;

}
function genMonster(depth, champion, opts={}){
  let pool = Object.keys(MONSTERS).filter(k => MONSTERS[k].min <= depth);
  if(opts.fams){ const p2 = pool.filter(k => opts.fams.includes(MONSTERS[k].fam)); if(p2.length) pool = p2; }
  const base = weighted(pool.map(k => ({k, w: MONSTERS[k].w ?? 1}))).k, b = MONSTERS[base];
  const lvl = Math.max(1, depth + pick([-1,0,0,0,1]) + (champion?1:0) + (opts.lvl||0));
  const rarity = champion ? (Math.random()<.6?'rare':'magic') : rollRarity(depth);
  const ok = a => a.min <= lvl && !(a.not||[]).includes(b.fam) && (!a.only || a.only.includes(b.type));
  const preOk = Object.values(MPRE).filter(ok), sufOk = Object.values(MSUF).filter(ok);
  let pre = null, suf = null;
  if(rarity==='rare'){ pre = weighted(preOk).id; suf = weighted(sufOk).id; }
  else if(rarity==='magic'){ if(Math.random()<.5) pre = weighted(preOk).id; else suf = weighted(sufOk).id; }
  const apool = FAMILY[b.fam].abil.filter(id => ABIL[id].min <= lvl);
  const count = lvl >= 8 ? 3 : lvl >= 4 ? 2 : 1;
  const abilities = shuffle(apool).slice(0, count);
  const m = {uid:uid(), base, lvl, rarity, pre, suf, abilities, champion:!!champion, hp:0};
  const ms = monStats(m);
  m.hp = ms.wounded ? Math.max(1, Math.round(ms.hp*.6)) : ms.hp;
  return m;
}

function genItem(level, kind){
  const ilvl = Math.max(1, level);
  if(!kind) kind = weighted(KIND_WEIGHTS).k;
  const bases = Object.keys(IBASE).filter(k => IBASE[k].kind===kind && IBASE[k].min <= ilvl);
  const base = pick(bases), b = IBASE[base];
  const rarity = b.noAffix ? 'normal' : rollRarity(ilvl);
  const ok = a => a.min <= ilvl && fits(a, base);
  const preOk = Object.values(IPRE).filter(ok), sufOk = Object.values(ISUF).filter(ok);
  let pre = null, suf = null;
  if(rarity==='rare'){ if(preOk.length) pre = weighted(preOk).id; if(sufOk.length) suf = weighted(sufOk).id; }
  else if(rarity==='magic'){
    const usePre = preOk.length && (!sufOk.length || Math.random()<.5);

function modLines(a, labels, flags, goodFn, scale=1, has=null){
  const out = [];
  if(a.mul) for(const k in a.mul){ if(has && has[k] === undefined) continue; const p = Math.round((a.mul[k]-1)*100); out.push({t:`${sgn(p)}% ${labels[k]||k}`, good:goodFn(k,p)}); }
  if(a.add) for(const k in a.add){ const v = Math.round(a.add[k]*(a.scale?scale:1)); out.push({t: k==='regen'&&v<0 ? `Lose ${-v}% health each turn` : `${sgn(v)}${PCT.has(k)?'%':''} ${labels[k]||k}`, good:goodFn(k,v)}); }
  if(a.flag) for(const f of a.flag) out.push({t:flags[f], good:goodFn(f,1)});
  return out;
}
const monGood = (k,v) => k==='wounded' ? true : (k==='xp'||k==='gold') ? v>0 : v<0;
const itemGood = (k,v) => v>0;
const itemAffixLines = (a, it) => modLines(a, ILAB, IFLAG, itemGood, itemScale(it), baseStats(it));
function affixBlock(kind, a, lines, rarity){
  return `<div class="affix ${rarity}"><h4>${a.name}<small>${kind}</small></h4><ul>${lines.map(l=>`<li class="${l.good?'up':'down'}">${l.t}</li>`).join('')}</ul></div>`;
}

/* ============ UI: hud, toast, floats ============ */
/* Health bars shift from green to yellow to orange to red as health drops, and blink when nearly empty. */
function hpColor(p){ return p > .6 ? '#4cc35a' : p > .35 ? '#e3c23a' : p > .15 ? '#e8862e' : '#d8383a'; }
function paintHp(el, p){
  if(!el) return;
  p = Math.max(0, Math.min(1, p));
  el.style.width = (p*100) + '%';
  el.style.backgroundColor = hpColor(p);
  el.classList.toggle('low', p > 0 && p <= .15);
}
function updateHud(){
  const h = S.hero, hs = heroStats();
  h.hp = Math.min(h.hp, hs.maxhp);
  paintHp($('#hpFill'), h.hp/hs.maxhp);
  $('#hpTxt').textContent = `${Math.max(0,h.hp)}/${hs.maxhp}`;
  $('#lvTxt').innerHTML = `Lv ${h.lvl}${h.points?' <span class="ptsdot">+'+h.points+'</span>':''}`;
  $('#xpFill').style.width = (h.xp/xpNeed(h.lvl)*100) + '%';
  $('#goldTxt').textContent = h.gold;
  { const st = stats(); if(h.gold > st.mostGold) st.mostGold = h.gold; }
  const bi = $('#bagIco'); if(bi && !bi.innerHTML) bi.innerHTML = ICON.bag;
  $('#bagTxt').textContent = `${h.bag.length}/${bagMax()}`; $('#hudBag').classList.toggle('full', h.bag.length >= bagMax());
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function floatNum(text, target, cls=''){
  const host = target==='mon' ? $('#monFloat') : $('#heroFloat');
  if(!host) return;
  const el = document.createElement('span');
  el.className = 'fnum ' + cls; el.textContent = text;
  el.style.left = (target==='mon' ? rand(30,62) : rand(12,40)) + '%';
  host.appendChild(el); setTimeout(()=>el.remove(), 1000);
}
function pulse(el, cls, ms=340){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), ms); }
function ouch(){ pulse($('#app'), 'ouch', 400); }
function log(msg){ const r = R(); if(!r) return; r.log.unshift(msg); r.log = r.log.slice(0,4); }

/* ============ monster art markup ============ */
function monArt(m, id='', mini=false){
  const pre = m.pre ? MPRE[m.pre] : null, suf = m.suf ? MSUF[m.suf] : null;
  const art = `<img class="px" src="${ART[m.base]}" alt="" draggable="false">`;
  const ghosts = suf && suf.id==='speed' ? `<div class="ghost">${art}</div><div class="ghost g2">${art}</div>` : '';
  let parts = '';
  if(suf && suf.parts) for(let i=0;i<9;i++) parts += `<span style="left:${12+i*9}%;animation-delay:${((i*.61)%2.4).toFixed(2)}s"></span>`;
  return `<div class="mon-wrap ${mini?'mini':''} ${pre?'fx-'+pre.id:''} ${suf?'sfx-'+suf.id:''}" ${id?`id="${id}"`:''}>
    <div class="aura">${suf && suf.id==='thorns' ? THORNS : ''}</div>
    <div class="sprite">${ghosts}<div class="bob">${art}</div></div>
    <div class="parts">${parts}</div></div>`;
}

/* ============ the town: buildings, perks, quests and records ============ */
/* Permanent perks live in the buildings that sell them. They are modest, expensive, and the higher levels need reputation earned through quests. */
const PERKS = {
  pack:{b:'shop', name:'Larger Pack', desc:'+2 bag slots per level.', max:8, base:3000, pow:1.6, now:l => `Bag holds ${BAG_BASE+2*l} items`},
  drills:{b:'yard', name:'Drills', desc:'+1 stat point per level, yours to spend.', max:10, base:5000, pow:1.5, now:l => `${l} bonus point${l===1?'':'s'} earned`},
  blessing:{b:'temple', name:'Blessing', desc:'+2% max health per level.', max:10, base:4000, pow:1.5, now:l => `+${l*2}% max health`},
  pouch:{b:'apothecary', name:'Belt Pouches', desc:'+3 potion belt slots per level.', max:5, base:3000, pow:1.5, now:l => `Belt holds ${BELT_BASE+3*l}`},
  holster:{b:'apothecary', name:'Scroll Holster', desc:'Scrolls go on your belt too.', max:1, base:15000, pow:1, rep:4, now:l => 'Scrolls ride on your belt'},
  favor:{b:'smithy', name:'Smith’s Favor', desc:'Shop gear is one item level higher per level.', max:3, base:8000, pow:1.6, repStep:3, now:l => `Shop gear +${l} levels`},
  vault:{b:'bank', name:'Vault', desc:'Lose 5% less gold when you die, per level.', max:5, base:4000, pow:1.6, now:l => `Death costs ${50-l*5}% of your gold`},
  charts:{b:'cartographer', name:'Master Charts', desc:'The stairs are marked on every floor’s map.', max:1, base:100000, pow:1, rep:6, now:l => 'Stairs always marked'}
};
function perk(id){ return (S && S.perks && S.perks[id]) || 0; }
function perkCost(id){ const p = PERKS[id], l = perk(id); return Math.round(p.base * Math.pow(l+1, p.pow) / 50) * 50; }
function perkRep(id){ const p = PERKS[id], l = perk(id); return p.rep !== undefined ? p.rep : l * (p.repStep || 2); }
const BELT_BASE = 6;

  gate:{name:'Dungeon Gate', x:2, y:0, art:'gate', desc:'The way down.'},

  shop:{name:'Shop', x:1, y:1, desc:'Buy and sell gear.'},

  yard:{name:'Training Yard', x:0, y:1, desc:'Drills that make you stronger, and bounties on the deep.'},

const ROADS = ['gate|guild','guild|shop','guild|tavern','shop|yard','tavern|temple','guild|square','square|smithy','square|apothecary','yard|bank','temple|cartographer','shop|smithy','tavern|apothecary'];
const QUEST_GIVERS = ['yard','temple','apothecary','smithy','bank','cartographer'];

/* ---------- crafting materials: dropped by monster families, kept in a pouch, used for quests ---------- */
const MATS = {
  silk:{name:'Spider Silk', fams:['spider']}, venom:{name:'Venom Sac', fams:['serpent']}, spore:{name:'Spore Cap', fams:['fungus','ooze']},
  tail:{name:'Rat Tail', fams:['rodent']}, stinger:{name:'Stinger', fams:['flyer']}, chitin:{name:'Chitin Plate', fams:['insect','ant','crawler']},
  bone:{name:'Bone Dust', fams:['undead']}, scale:{name:'Dragon Scale', fams:['dragon']}, core:{name:'Golem Core', fams:['construct','aberration']},
  pelt:{name:'Thick Pelt', fams:['beast','bear','beastfolk']}, ear:{name:'Goblin Ear', fams:['goblinoid']}, tusk:{name:'Orc Tusk', fams:['orc']},
  sigil:{name:'Dark Sigil', fams:['caster','cleric']}, insignia:{name:'Steel Insignia', fams:['warrior','archer','outlaw','humanoid']}
};
function matFor(fam){ return Object.keys(MATS).find(k => MATS[k].fams.includes(fam)); }

/* ---------- quests ---------- */
const DIFF = {easy:{n:'Easy', gold:400, rep:1}, medium:{n:'Medium', gold:1500, rep:2}, hard:{n:'Hard', gold:5000, rep:4}};
function monsterPool(maxMin, filter){ return Object.keys(MONSTERS).filter(k => MONSTERS[k].min <= maxMin && (MONSTERS[k].w ?? 1) >= .3 && filter(MONSTERS[k], k)); }
function genQuest(b, diff){
  const lim = {easy:2, medium:5, hard:9}[diff];
  const n = (e, m, hd) => ({easy:e, medium:m, hard:hd})[diff];
  const killBase = (filter, counts) => { const k = pick(monsterPool(lim, filter)); return {kind:'kill', target:k, need:counts, label:`Slay ${counts} ${plural(MONSTERS[k].name)}`}; };
  const killFam = (fams, name, counts) => ({kind:'killfam', target:fams, need:counts, label:`Slay ${counts} ${name}`});
  const gather = (mats, counts) => { const m = pick(mats); return {kind:'gather', target:m, need:counts, label:`Bring back ${counts} ${MATS[m].name}${counts===1?'':'s'}`}; };
  let q;
  switch(b){
    case 'yard': q = Math.random() < .6 ? killBase(x => x.type==='humanoid' || ['beast','beastfolk','rodent'].includes(x.fam), n(12,40,120)) : killFam(['orc','goblinoid'], 'orcs and goblins', n(15,50,150)); break;
    case 'temple': q = Math.random() < .5 ? killBase(x => x.fam==='undead', n(10,40,250)) : killFam(['undead'], 'undead', n(15,60,200)); break;
    case 'apothecary': q = gather(['silk','venom','spore','tail','stinger'], n(5,15,40)); break;
    case 'smithy': q = diff==='hard' ? gather(['scale','core'], 8) : gather(['chitin','insignia','tusk','pelt'], n(6,18,0)); break;
    case 'bank': q = {kind:'gold', need:n(600,2500,8000), label:`Come back from one run with ${n(600,2500,8000)} gold earned`}; break;
    case 'cartographer': q = Math.random() < .5 ? {kind:'depth', need:n(4,8,12), label:`Reach floor ${n(4,8,12)} and make it back alive`} : {kind:'rooms', need:n(40,150,400), label:`Explore ${n(40,150,400)} rooms`}; break;
  }
  return Object.assign(q, {id:uid(), b, diff, have:0, status:'offered'});
}
function plural(n){ return /(s|x|sh|ch)$/i.test(n) ? n+'es' : /y$/i.test(n) && !/[aeiou]y$/i.test(n) ? n.slice(0,-1)+'ies' : n.endsWith('f') ? n.slice(0,-1)+'ves' : n+'s'; }
function board(b){
  S.quests = S.quests || {};
  if(!S.quests[b]) S.quests[b] = ['easy','medium','hard'].map(d => genQuest(b, d));
  return S.quests[b];
}
function questProgress(q){ return q.kind==='gather' ? Math.min(q.need, (S.mats||{})[q.target]||0) : Math.min(q.need, q.have); }
function questReady(q){ return q.status==='active' && questProgress(q) >= q.need; }
function anyReady(b){ return board(b).some(questReady); }
function activeQuests(){ return QUEST_GIVERS.flatMap(b => board(b).filter(q => q.status==='active')); }

/* What a run earned toward quests. Only counted when you walk back into town alive. */
function runTrack(){ const r = R(); if(!r.track) r.track = {kills:{}, mats:{}, rooms:0, gold0:S.hero.gold, deepest:1}; return r.track; }
function bankRun(){
  const r = R(); if(!r) return [];
  const t = runTrack(), notes = [];
  t.deepest = Math.max(t.deepest, r.depth);
  S.mats = S.mats || {};
  for(const [m,c] of Object.entries(t.mats)){ S.mats[m] = (S.mats[m]||0) + c; notes.push(`+${c} ${MATS[m].name}`); }
  const gold = Math.max(0, S.hero.gold - t.gold0);
  for(const q of activeQuests()){
    const before = q.have;
    if(q.kind==='kill') q.have += t.kills[q.target] || 0;
    if(q.kind==='killfam') q.have += Object.entries(t.kills).filter(([k]) => q.target.includes(MONSTERS[k].fam)).reduce((a,[,c]) => a+c, 0);
    if(q.kind==='rooms') q.have += t.rooms;
    if(q.kind==='gold') q.have = Math.max(q.have, gold);
    if(q.kind==='depth') q.have = Math.max(q.have, t.deepest);
    if(q.have > before && q.kind !== 'gold' && q.kind !== 'depth') notes.push(`${q.label}: ${Math.min(q.need,q.have)}/${q.need}`);
  }
  return notes;
}

/* ---------- records for the Guild Hall ---------- */
function stats(){ S.stats = S.stats || {runs:0, deaths:0, mostGold:0, mostLost:0, bestHit:0, dealt:0, taken:0, kills:{}, chests:0, rooms:0, quests:0, returns:0}; return S.stats; }
function trackHit(d){ const s = stats(); s.dealt += d; if(d > s.bestHit) s.bestHit = d; }
function trackTaken(d){ stats().taken += d; }
function trackKill(m){
  const s = stats(); s.kills[m.base] = (s.kills[m.base]||0) + 1;
  if(S.run){ const t = runTrack(); t.kills[m.base] = (t.kills[m.base]||0) + 1;
    const mat = matFor(MONSTERS[m.base].fam);
    if(mat && Math.random() < (m.champion ? 1 : m.rarity==='rare' ? .6 : .35)){ t.mats[mat] = (t.mats[mat]||0) + 1; return mat; } }
  return null;
}

/* ---------- views ---------- */
function perkRow(id){
  const p = PERKS[id], l = perk(id), maxed = l >= p.max, cost = maxed ? 0 : perkCost(id), need = perkRep(id), rep = (S.rep||{})[p.b] || 0;
  const pips = Array.from({length:p.max}, (_,i) => `<i class="${i<l?'on':''}"></i>`).join('');
  const lockTxt = !maxed && rep < need ? `<br><span class="sub down">Needs ${need} reputation here (you have ${rep})</span>` : '';
  return `<div class="row upg"><div class="upgtext"><span class="nm">${p.name}</span> <span class="upips">${pips}</span><br><span class="sub">${p.desc}</span>${l ? `<br><span class="sub now">Now: ${p.now(l)}</span>` : ''}${lockTxt}</div>
    ${maxed ? '<span class="maxed">Maxed</span>' : `<button class="btn sm" data-act="buyPerk" data-arg="${id}" ${S.hero.gold<cost || rep<need ? 'disabled' : ''}>${priceTag(cost)}</button>`}</div>`;
}
function questRow(q){
  const prog = questProgress(q), pct = Math.round(prog/q.need*100), D = DIFF[q.diff];
  const btn = q.status==='offered' ? `<button class="btn sm" data-act="acceptQuest" data-arg="${q.b}|${q.id}">Accept</button>`
    : questReady(q) ? `<button class="btn sm equipnow" data-act="turnIn" data-arg="${q.b}|${q.id}">Turn in</button>`
    : `<button class="btn sm" data-act="dropQuest" data-arg="${q.b}|${q.id}">Abandon</button>`;
  return `<div class="row upg quest ${q.diff}"><div class="upgtext"><span class="qd">${D.n}</span> <span class="nm">${q.label}</span>
    <br><span class="sub">Reward: <span class="price"><span class="coin"></span>${D.gold}</span> and ${D.rep} reputation</span>
    ${q.status==='active' ? `<div class="qbar"><i style="width:${pct}%"></i><span>${prog}/${q.need}</span></div>` : ''}</div>${btn}</div>`;
}

/* ---------- reforging ---------- */
function reforgeCost(it){ return Math.max(150, Math.round(itemValue(it)*3/10)*10); }
function reforge(id, which){
  const f = findIn(S.hero.bag, id); if(!f) return;
  const it = f.it, c = reforgeCost(it); if(S.hero.gold < c) return;
  const pool = Object.values(which==='pre' ? IPRE : ISUF).filter(a => a.min <= it.ilvl && fits(a, it.base));
  if(!pool.length) return toast('Nothing to reforge into.');
  S.hero.gold -= c;
  const old = it[which];
  it[which] = weighted(pool).id;
  it.rarity = it.pre && it.suf ? 'rare' : (it.pre || it.suf) ? 'magic' : 'normal';
  toast(`${old ? (which==='pre'?IPRE:ISUF)[old].name : 'Nothing'} became ${(which==='pre'?IPRE:ISUF)[it[which]].name}.`);
  save(); render(); openSheet(itemSheet(it, 'smithy'), 'item');
}

const TNAME = {temple:'Temple', gate:'Dungeon Gate', cartographer:'Cartographer', yard:'Training Yard', guild:'Guild Hall', bank:'Bank', shop:'Shop', square:'Fountain', tavern:'Tavern', smithy:'Smithy', notice:'Quest Board', apothecary:'Apothecary'};
const RUMORS = [
  '“Quest work only counts if you make it home alive. The dead don’t get paid.”',
  '“The smith can reroll a bad prefix. Or ruin a good one. Ask me how I know.”',
  '“A champion guards the stairs every third floor down.”',
  '“Chests from floor three on sometimes bite back.”',
  '“Nimble fingers and a little luck get you past traps.”',
  '“Holy scrolls hit the dead twice as hard.”',
  '“A Quickened scroll reads itself before you blink.”',
  '“The Temple pays well for Skeletons. Hundreds of them.”',
  '“Bears down there? Rare. Be glad.”',
  '“Kill the Lightning Bugs first. Trust me.”',
  '“Cutpurses give your gold back if you catch them.”',
  '“Dragons hoard. Gold Dragons hoard triple.”'
];
const pctX = x => (x/TW*100).toFixed(3)+'%', pctY = y => (y/TH*100).toFixed(3)+'%';
const SPR = 96, SPR_OY = 70;                      // building sprites are 96x96, anchored at the lot centre (48,70)
function doorPoint(k){ const p = ISO.pos[k]; return {x:p.door[0], y:p.door[1], k}; }
function heroAt(){ if(!S.townPos || S.townPos.k === undefined) S.townPos = doorPoint('square'); return S.townPos; }
function isoW(x, y){ return {x:(x - y) + ISO.OX, y:(x + y)/2 + ISO.OY}; }
function townView(){
  const h = S.hero, hp = heroAt();
  const order = Object.keys(ISO.pos).sort((a,b) => ISO.pos[a].y - ISO.pos[b].y);
  let html = '';
  for(const [lx,ly] of ISO.lamps) html += `<i class="lampglow" style="left:${pctX(lx)};top:${pctY(ly)}"></i>`;
  for(const k of order){
    const p = ISO.pos[k], click = k !== 'garden';
    const badge = QUEST_GIVERS.includes(k) && anyReady(k) ? '<span class="tbadge ready">!</span>' : '';
    const box = `left:${pctX(p.x-48)};top:${pctY(p.y-SPR_OY)};width:${pctX(SPR)}`;
    html += `<div class="tb iso ${k==='gate'?'tgate':''}" style="${box}"><img src="${ISO_ART[k]}" alt="">${click?`<span class="tlabel">${TNAME[k]}</span>`:''}${badge}</div>`;
    if(click) html += `<button class="thit" style="${box}" data-act="townGo" data-arg="${k}" aria-label="${TNAME[k]}"></button>`;
    const sm = ISO.smoke[k];
    if(sm) for(let i=0;i<3;i++) html += `<i class="smoke" style="left:${pctX(p.x-48+sm[0])};top:${pctY(p.y-SPR_OY+sm[1])};animation-delay:${i*1.3}s"></i>`;
  }
  { const p = ISO.pos.square; for(let i=0;i<5;i++) html += `<i class="spark" style="left:${pctX(p.x-8+i*4)};top:${pctY(p.y-14+(i%2)*4)};animation-delay:${i*.45}s"></i>`; }
  { const p = ISO.pos.gate; for(let i=0;i<4;i++) html += `<i class="ember" style="left:${pctX(p.x-6+i*4)};top:${pctY(p.y-2)};animation-delay:${i*.7}s"></i>`; }
  html += `<div class="thero" id="townHero" style="left:${pctX(hp.x-8)};top:${pctY(hp.y-15)}"><img src="${HERO_ART}" alt="You"></div>`;
  return `<div class="dun townmap">
    <div class="floorbar"><span>Emberhold</span><span>${h.deepest ? `Deepest: floor ${h.deepest}` : 'The last lit town'}</span></div>
    <div class="townwrap" id="townmap"><div class="townscene" style="background-image:url(${TOWN_BG})">${html}</div></div>
    <div class="runfoot"><button class="footbtn" data-act="bag">${ICON.bag}<span>Inventory ${h.bag.length}/${bagMax()}</span></button><button class="footbtn" data-act="stats">${ICON.hero}<span>Character${h.points?` <span class="ptsdot">+${h.points}</span>`:''}</span></button></div>
  </div>`;
}
function centerTown(){}
/* Walk the roads: along your street, turn at the corner of the target's block, then up to its door. */
let townMoving = false;
async function townGo(k){
  if(townMoving) return;
  const from = heroAt(), to = doorPoint(k), el = $('#townHero');
  const A = ISO.pos[from.k] || ISO.pos.square, B = ISO.pos[k];
  const ay = A.wy + 30, by = B.wy + 30;
  const xm = Math.abs((B.wx - 28) - A.wx) < Math.abs((B.wx + 28) - A.wx) ? B.wx - 28 : B.wx + 28;
  const pts = from.k === k ? [] : [isoW(xm, ay), isoW(xm, by)];
  pts.push({x:to.x, y:to.y});
  if(el){
    townMoving = true; el.classList.add('walking');
    let cur = {x:from.x, y:from.y};
    for(const p of pts){
      const d = Math.hypot(p.x-cur.x, p.y-cur.y); if(d < .5){ cur = p; continue; }
      const ms = window.__fast ? 0 : Math.round(d/110*1000);
      if(Math.abs(p.x-cur.x) > .5) el.classList.toggle('flip', p.x < cur.x);
      el.style.transition = `left ${ms}ms linear, top ${ms}ms linear`;
      el.style.left = pctX(p.x-8); el.style.top = pctY(p.y-15);
      await sleep(ms);
      cur = p;
    }
    el.classList.remove('walking'); townMoving = false;
  }
  S.townPos = to;
  if(k==='gate') return enterDungeon();
  if(k==='square') return toast('You sit by the fountain a while. It’s quiet up here.');
  ACT.go(k);
}
function noticeSheet(){
  const act = activeQuests(), offered = QUEST_GIVERS.flatMap(b => board(b).filter(q => q.status==='offered'));
  const line = q => `<div class="row upg quest ${q.diff}"><div class="upgtext"><span class="qd">${DIFF[q.diff].n}</span> <span class="nm">${q.label}</span><br><span class="sub">${BUILDINGS[q.b].name}${q.status==='active' ? `: ${questProgress(q)}/${q.need}` : ''}</span></div>${questReady(q) ? `<button class="btn sm equipnow" data-act="turnIn" data-arg="${q.b}|${q.id}">Turn in</button>` : q.status==='offered' ? `<button class="btn sm" data-act="acceptQuest" data-arg="${q.b}|${q.id}">Accept</button>` : ''}</div>`;
  return `<div class="grab"></div><h3 class="sheet-title">Quest Board</h3>
    <p class="sub">Work posted by every guild in town. Progress only counts when you make it home alive.</p>
    <h3 class="section-h">Your quests</h3><div class="rows">${act.length ? act.map(line).join('') : '<p class="empty-note">None yet.</p>'}</div>
    <h3 class="section-h">Posted</h3><div class="rows">${offered.map(line).join('')}</div>
    <div class="sheet-actions"><button class="btn" data-act="closeSheet">Close</button></div>`;
}
