/* ============ exploration: a map of connected rooms ============ */
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
const FLOOR_NOUNS = ['Halls','Tunnels','Catacombs','Caverns','Warrens','Crypts','Depths','Abyss'];
/* Floors roll a prefix and a suffix too. */
const FPRE = {
  dark:{name:'Dark',desc:'Every monster here strikes first.'},
  infested:{name:'Infested',desc:'Monsters fill half again as many rooms.'},
  quiet:{name:'Quiet',desc:'Fewer rooms hold monsters.'},
  haunted:{name:'Haunted',desc:'The dead walk these halls: most monsters are undead.'},
  ancient:{name:'Ancient',desc:'Monsters are a level higher, and chests hold better loot.'},
  flooded:{name:'Flooded',desc:'Knee-deep water slows you by 15% in fights.'}
};
const FSUF = {
  riches:{name:'of Riches',desc:'Two extra treasure rooms.'},
  ambush:{name:'of Ambush',desc:'Monsters may jump you in empty rooms.'},
  traps:{name:'of Traps',desc:'Three extra trap rooms.'},
  rest:{name:'of Rest',desc:'A campfire and a shrine are always here.'},
  echoes:{name:'of Echoes',desc:'You can hear what waits nearby: rooms next to ones you’ve visited show what’s inside.'},
  trade:{name:'of Trade',desc:'A wandering merchant is always here.'}
};
const ROOM = {
  start:{name:'Entrance', art:'entrance'},
  empty:{name:'Empty Room'},
  mon:{name:'Monster'},
  chest:{name:'Treasure Room', art:'chest'},
  trap:{name:'Trapped Room', art:'trap'},
  stairs:{name:'Stairs Down', art:'stairs'},
  shrine:{name:'Shrine', art:'shrine'},
  fire:{name:'Campfire', art:'campfire'},
  merchant:{name:'Merchant', art:'merchant'}
};
const EMPTY_FLAVOR = ['Broken crates and old bones.','A collapsed storeroom. Nothing worth taking.','Water drips somewhere in the dark.','Faded writing covers the walls.','An old campsite, long cold.','Rusted chains hang from the ceiling.','The air smells of damp stone.'];

const key = (x,y) => x+','+y;
const unkey = k => k.split(',').map(Number);
function floorName(fl, depth){
  const noun = FLOOR_NOUNS[Math.min(FLOOR_NOUNS.length-1, Math.floor((depth-1)/2))];
  return `${fl.pre ? FPRE[fl.pre].name+' ' : ''}${noun}${fl.suf ? ' '+FSUF[fl.suf].name : ''}`;
}
function linked(fl, a, b){ return fl.links.includes(a < b ? a+'|'+b : b+'|'+a); }
function neighbors(fl, k){ const [x,y] = unkey(k); return DIRS.map(([dx,dy]) => key(x+dx,y+dy)).filter(n => fl.rooms[n] && linked(fl,k,n)); }
function bfsRooms(fl, from, passable){
  const dist = {[from]:0}, par = {}, q = [from];
  while(q.length){ const k = q.shift(); for(const n of neighbors(fl,k)){ if(dist[n] !== undefined) continue; if(passable && !passable(n)) continue; dist[n] = dist[k]+1; par[n] = k; q.push(n); } }
  return {dist, par};
}
function genFloor(depth){
  const fl = {rooms:{}, links:[], pre:null, suf:null, visited:{}, prev:null};
  if(depth > 1 && Math.random() < Math.min(.75, .2 + depth*.06)) fl.pre = pick(Object.keys(FPRE));
  if(depth > 1 && Math.random() < Math.min(.7, .15 + depth*.06)) fl.suf = pick(Object.keys(FSUF));
  const want = Math.round(clamp(9 + depth*1.5, 9, 22));
  const add = (x,y) => { const k = key(x,y); fl.rooms[k] = {x, y, t:'empty'}; return k; };
  const link = (a,b) => { const l = a < b ? a+'|'+b : b+'|'+a; if(!fl.links.includes(l)) fl.links.push(l); };
  const start = add(0,0); fl.rooms[start].t = 'start'; fl.rooms[start].done = true;
  // grow a branching tree: keep picking a room and pushing a corridor out of it in a random direction
  let guard = 0;
  while(Object.keys(fl.rooms).length < want && guard++ < 2000){
    const from = pick(Object.keys(fl.rooms)), [x,y] = unkey(from), [dx,dy] = pick(DIRS);
    const nk = key(x+dx, y+dy);
    if(fl.rooms[nk]) continue;
    if(neighbors(fl, from).length >= 3 && Math.random() < .7) continue;   // keep it from becoming a solid block
    add(x+dx, y+dy); link(from, nk);
  }
  // a few extra corridors make loops, so there's more than one way around
  for(const k of Object.keys(fl.rooms)){ const [x,y] = unkey(k); for(const [dx,dy] of DIRS){ const n = key(x+dx,y+dy); if(fl.rooms[n] && !linked(fl,k,n) && Math.random() < .12) link(k,n); } }
  const {dist, par} = bfsRooms(fl, start);
  const keys = Object.keys(fl.rooms).filter(k => k !== start);
  const far = keys.slice().sort((a,b) => dist[b] - dist[a]);
  const stairs = far[0]; fl.rooms[stairs].t = 'stairs'; fl.rooms[stairs].done = true;
  const free = () => shuffle(keys.filter(k => fl.rooms[k].t === 'empty'));
  const leaves = () => shuffle(keys.filter(k => fl.rooms[k].t === 'empty' && neighbors(fl,k).length === 1));
  const set = (k, t, extra={}) => { if(!k) return; Object.assign(fl.rooms[k], {t}, extra); };
  const monOpts = {fams: fl.pre==='haunted' && Math.random() < .8 ? ['undead'] : null, lvl: fl.pre==='ancient' ? 1 : 0};
  if(depth % 3 === 0){ const g = par[stairs]; if(g && g !== start) set(g, 'mon', {m:genMonster(depth, true, monOpts)}); }
  for(let i=0; i<2 + (fl.suf==='riches' ? 2 : 0); i++) set(leaves()[0] || free()[0], 'chest');
  for(let i=0; i<1 + (fl.suf==='traps' ? 3 : 0); i++) set(free()[0], 'trap');
  if(fl.suf==='rest' || Math.random() < .45) set(leaves()[0] || free()[0], 'fire');
  if(fl.suf==='rest' || Math.random() < .35) set(leaves()[0] || free()[0], 'shrine');
  if(fl.suf==='trade' || (depth > 1 && Math.random() < .3)) set(leaves()[0] || free()[0], 'merchant', {items:[genItem(depth,'potion'), genItem(depth), genItem(depth), genItem(depth,'scroll')]});
  const share = fl.pre==='infested' ? .55 : fl.pre==='quiet' ? .2 : .38;
  const rest = free(); const nMon = Math.round(rest.length * share);
  for(let i=0; i<nMon; i++) set(rest[i], 'mon', {m:genMonster(depth, false, monOpts)});
  for(const k of keys) if(fl.rooms[k].t === 'empty') fl.rooms[k].flavor = pick(EMPTY_FLAVOR);
  fl.cur = start; fl.visited[start] = 1;
  return fl;
}

/* ---------- what you can see ---------- */
const charted = (fl, k) => !!(S.town && S.town.map && fl.rooms[k] && fl.rooms[k].t==='stairs');
function shown(fl, k){ return fl.visited[k] || charted(fl, k) || neighbors(fl, k).some(n => fl.visited[n]); }
function typeKnown(fl, k){ return fl.visited[k] || charted(fl, k) || (fl.suf === 'echoes' && shown(fl, k)); }
function pending(rm){ return (rm.t==='mon' && !rm.done) || (rm.t==='trap' && !rm.done); }
function roomArt(rm){
  if(rm.t==='mon') return rm.done ? null : ART[rm.m.base];
  const a = ROOM[rm.t].art; return a ? (a==='entrance' || a==='trap' ? OART2[a] : OART[a]) : null;
}

/* ---------- the map ---------- */
const GRID = 84, TILE = 62;
function mapHtml(){
  const r = R(), fl = r.floor, ks = Object.keys(fl.rooms).filter(k => shown(fl,k));
  const xs = ks.map(k => fl.rooms[k].x), ys = ks.map(k => fl.rooms[k].y);
  const minx = Math.min(...xs), miny = Math.min(...ys), maxx = Math.max(...xs), maxy = Math.max(...ys);
  const pad = 40, W = (maxx-minx)*GRID + TILE + pad*2, H = (maxy-miny)*GRID + TILE + pad*2;
  const pos = rm => [pad + (rm.x-minx)*GRID, pad + (rm.y-miny)*GRID];
  const cur = fl.rooms[fl.cur], locked = pending(cur);
  let lines = '', tiles = '';
  for(const l of fl.links){
    const [a,b] = l.split('|'); if(!fl.visited[a] && !fl.visited[b]) continue;   // you only learn a room's exits by standing in it
    const A = fl.rooms[a], B = fl.rooms[b], [ax,ay] = pos(A), [bx,by] = pos(B);
    const walked = fl.visited[a] && fl.visited[b];
    if(A.y === B.y) lines += `<i class="ln h ${walked?'walked':''}" style="left:${Math.min(ax,bx)+TILE}px;top:${ay+TILE/2-2}px;width:${GRID-TILE}px"></i>`;
    else lines += `<i class="ln v ${walked?'walked':''}" style="left:${ax+TILE/2-2}px;top:${Math.min(ay,by)+TILE}px;height:${GRID-TILE}px"></i>`;
  }
  for(const k of ks){
    const rm = fl.rooms[k], [x,y] = pos(rm), known = typeKnown(fl,k), here = k === fl.cur;
    const adj = neighbors(fl, fl.cur).includes(k);
    const reach = !here && (locked ? k === fl.prev : true);
    const art = known ? roomArt(rm) : null;
    const cls = ['room', here?'here':'', fl.visited[k]?'seen':'unknown', adj && reach ?'adj':'', known && rm.t==='mon' && !rm.done ? 'danger '+(rm.m.rarity||'') : '', known && rm.done && rm.t!=='start' && rm.t!=='stairs' ? 'done' : '', known ? 't-'+rm.t : ''].join(' ');
    const label = known ? (rm.t==='mon' ? (rm.done ? 'Cleared' : `Lv ${rm.m.lvl}`) : rm.t==='empty' ? '' : ROOM[rm.t].name.split(' ')[0]) : '';
    tiles += `<button class="${cls}" style="left:${x}px;top:${y}px" data-act="goRoom" data-arg="${k}" ${reach?'':'aria-disabled="true"'} aria-label="${known ? ROOM[rm.t].name : 'Unexplored room'}">
      ${art ? `<img src="${art}" alt="">` : `<span class="q">${known ? (rm.t==='empty' ? '' : '·') : '?'}</span>`}
      ${label ? `<span class="rl">${label}</span>` : ''}${here ? '<span class="you">YOU</span>' : ''}</button>`;
  }
  return `<div class="mapinner" style="width:${W}px;height:${H}px">${lines}${tiles}</div>`;
}
function centerMap(smooth){
  const box = $('#roommap'), here = box && box.querySelector('.room.here'); if(!box || !here) return;
  const left = here.offsetLeft - box.clientWidth/2 + TILE/2, top = here.offsetTop - box.clientHeight/2 + TILE/2;
  if(box.scrollTo) box.scrollTo({left, top, behavior: smooth ? 'smooth' : 'auto'}); else { box.scrollLeft = left; box.scrollTop = top; }
}

/* ---------- the room you're in ---------- */
function roomPanel(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur];

  if(r.msg){ text = r.msg; }
  switch(rm.t){
    case 'start': text = text || (r.depth===1 ? 'The way back to Emberhold. Tap a connected room on the map to move.' : 'The stairs you came down. Tap a connected room on the map to move.');
      acts = r.depth===1 ? `<button class="btn span2" data-act="toTown">Back to town</button>` : ''; break;
    case 'empty': text = text || rm.flavor; break;
    case 'mon':
      if(rm.done){ title = 'Cleared Room'; text = text || 'Signs of your fight are everywhere.'; art = null; }
      else { title = monNameHtml(rm.m); text = text || `Level ${rm.m.lvl}${rm.m.champion ? ' champion' : ''}. It hasn’t noticed you yet.`;
        acts = `<button class="btn primary" data-act="fightRoom">Fight</button><button class="btn" data-act="retreat">Retreat</button>`; }
      break;
    case 'chest':
      if(rm.done){ title = 'Emptied Room'; text = text || 'An empty, broken chest.'; art = null; }
      else { text = text || 'A heavy chest sits against the wall. It could be trapped.'; acts = `<button class="btn primary span2" data-act="openChest">Open the chest</button>`; }
      break;
    case 'trap':
      if(rm.done){ title = 'Sprung Trap'; text = text || 'The trap has been dealt with.'; }
      else { text = text || `Pressure plates cover the floor. Disarm chance ${Math.round(disarmChance()*100)}%, better with Dexterity and Luck.`; acts = `<button class="btn primary" data-act="disarm">Disarm</button><button class="btn" data-act="dash">Dash through</button>`; }
      break;
    case 'stairs': text = text || 'Stairs lead down into the dark.'; acts = `<button class="btn primary" data-act="descend">Go down</button><button class="btn" data-act="toTown">Back to town</button>`; break;
    case 'shrine': text = text || (rm.used ? 'The shrine has gone dark.' : 'A glowing shrine hums softly.'); if(!rm.used) acts = `<button class="btn primary span2" data-act="pray">Pray at the shrine</button>`; break;
    case 'fire': text = text || (rm.used ? 'Only embers remain.' : 'A campfire crackles. Someone left it burning.'); if(!rm.used) acts = `<button class="btn primary span2" data-act="restFire">Rest by the fire</button>`; break;
    case 'merchant': text = text || '“Everything has a price down here.”'; acts = `<button class="btn primary span2" data-act="trade">Trade</button>`; break;
  }
  if(!acts) acts = `<div class="idle">Tap a connected room to move</div>`;
  const rar = rm.t==='mon' && !rm.done ? 'r-'+rm.m.rarity : '';
  return `<div class="rpanel ${rar}">
      <div class="rart">${art ? `<img src="${art}" alt="">` : ''}</div>
      <div class="rtext"><h3>${title}</h3><p>${text}</p></div>
    </div>
    <div class="ctx">${acts}</div>`;
}
function exploreView(){
  return `<div class="dun explore">${floorBar()}
    <div class="roommap" id="roommap">${mapHtml()}</div>

  </div>`;
}
function updateExplore(smooth){
  const m = $('#roommap'), p = $('#xpanel');
  if(m){ const sl = m.scrollLeft, st = m.scrollTop; m.innerHTML = mapHtml(); m.scrollLeft = sl; m.scrollTop = st; }

/* ---------- moving between rooms ---------- */
let moving = false;
async function goRoom(k){
  const r = R(); if(moving || !r || r.phase!=='explore') return;
  const fl = r.floor; if(!fl.rooms[k] || k === fl.cur || !shown(fl,k)) return;
  const cur = fl.rooms[fl.cur];
  if(pending(cur) && k !== fl.prev){ toast(cur.t==='mon' ? 'Deal with the monster, or retreat the way you came.' : 'Get past the trap first, or go back the way you came.'); return; }
  // route through rooms you've already made safe
  const {par} = bfsRooms(fl, fl.cur, n => n === k || (fl.visited[n] && !pending(fl.rooms[n])));
  if(!par[k] && !neighbors(fl, fl.cur).includes(k)){ toast('You can’t reach that room from here yet.'); return; }
  const path = []; for(let n = k; n && n !== fl.cur; n = par[n]) path.unshift(n);
  moving = true; r.msg = null;
  for(const step of path){
    fl.prev = fl.cur; fl.cur = step; fl.visited[step] = 1;
    updateExplore(true);
    await sleep(path.length > 1 ? 160 : 60);
    if(!S.run || S.run.phase!=='explore') break;
  }
  moving = false;
  enterRoom();
}
function enterRoom(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur];
  if(rm.t==='empty' && fl.suf==='ambush' && !rm.ambushed && Math.random() < .25){
    rm.ambushed = true; rm.t = 'mon'; rm.m = genMonster(r.depth, false);
    toast('Something was waiting for you!'); save(); return startEncounter(fl.cur);
  }
  if(rm.t==='mon' && !rm.done){ save(); return startEncounter(fl.cur); }
  save(); updateExplore(true);
}
function retreat(){
  const r = R(), fl = r.floor; if(!fl.prev) return;
  const back = fl.prev; fl.prev = fl.cur; fl.cur = back; r.msg = 'You back away the way you came.';
  save(); updateExplore(true);
}
function disarmChance(){ const hs = heroStats(); return clamp(.35 + (hs.dex-5)*.04 + (hs.lck-5)*.02 + hs.dodge/200, .15, .92); }
function disarm(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], hs = heroStats(); if(rm.t!=='trap' || rm.done) return;
  rm.done = true;
  if(Math.random() < disarmChance()){
    const g = Math.round(rand(4,9)*r.depth); S.hero.gold += g;
    r.msg = `Click. You disarm the trap and pocket ${g} gold from the mechanism.`;
  } else {
    const d = Math.max(1, Math.round(hs.maxhp*.18)); S.hero.hp = Math.max(1, S.hero.hp - d); ouch();
    r.msg = `It goes off in your hands! Darts hit you for ${d}.`;
  }
  save(); updateHud(); updateExplore();
}
function dash(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], hs = heroStats(); if(rm.t!=='trap' || rm.done) return;
  rm.done = true;
  const d = Math.max(1, Math.round(hs.maxhp*(.1 - Math.min(.06, (hs.dex-5)*.006))));
  S.hero.hp = Math.max(1, S.hero.hp - d); ouch();
  r.msg = `You sprint across as darts fly. One grazes you for ${d}.`;
  save(); updateHud(); updateExplore();
}
function openChest(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur], hs = heroStats(); if(rm.t!=='chest' || rm.done) return;
  rm.done = true;
  if(r.depth >= 3 && Math.random() < .1){
    const m = genMonster(Math.max(r.depth, 6), false); m.base = 'mimic'; m.lvl = r.depth + 1; m.hp = monStats(m).hp;
    toast('The chest grows teeth. It’s a Mimic!');
    return startEncounter(m);
  }
  let trap = null;
  if(Math.random() < .18){
    if(Math.random() < .5){ const d = Math.max(1, Math.round(hs.maxhp*.12)); S.hero.hp = Math.max(1, S.hero.hp - d); trap = `A needle trap! You lose ${d} health.`; }
    else { r.pb.poison = {t:3, d:Math.max(1, Math.round(r.depth*1.5))}; trap = 'A puff of green gas. You’re poisoned.'; }
    ouch();
  }
  const L = r.depth + (fl.pre==='ancient' ? 1 : 0);
  const items = [genItem(L)]; if(Math.random() < .6) items.push(genItem(L)); if(Math.random() < .3) items.push(genItem(L+1));
  const gold = Math.max(1, Math.round(rand(8,16)*r.depth*(1+hs.gold/100)));
  S.hero.gold += gold;
  r.reward = {kind:'chest', xp:0, gold, name:'chest', trap};
  r.loot = items; r.tookAll = false; r.phase = 'loot';
  save(); render(); $('#view').scrollTop = 0;
}
function pray(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], h = S.hero, hs = heroStats(); if(rm.t!=='shrine' || rm.used) return;
  rm.used = true;
  const roll = Math.random();

  else if(roll < .7){ const xp = 12*r.depth; gainXp(xp); r.msg = `Visions of the deep fill your mind. You gain ${xp} experience.`; }

  else { const d = Math.round(hs.maxhp*.1); h.hp = Math.max(1, h.hp - d); r.msg = `The shrine is angry. Cold fire burns you for ${d}.`; ouch(); }
  save(); updateHud(); updateExplore();
}
function restFire(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], h = S.hero, hs = heroStats(); if(rm.t!=='fire' || rm.used) return;
  rm.used = true;

function merchantRoom(){ const r = R(); return r && r.floor && r.floor.rooms ? Object.values(r.floor.rooms).find(x => x.t==='merchant') : null; }
function merchantPrice(it){ return Math.round(itemValue(it)*1.25); }

function floorInfoSheet(){

function newFloor(depth){

/* ============ run flow ============ */
function enterDungeon(){
  closeSheet();
  S.run = {depth:1, mon:null, pg:0, mg:0, log:[], pb:{}, mb:{}, phase:'explore', loot:[], kills:0};
  newFloor(1);
  S.hero.deepest = Math.max(S.hero.deepest, 1);
  const ap = (S.town && S.town.apoth) || 0; let gave = 0;
  for(let i=0; i<ap; i++) if(S.hero.bag.length < bagMax()){ S.hero.bag.push(mk('potion', stapleLvl())); gave++; }
  if(gave) setTimeout(() => toast(`The apothecary slips you ${gave} Healing Potion${gave===1?'':'s'}.`), 1600);
  save(); render(); $('#view').scrollTop = 0;
  toast(`Floor 1: ${floorName(S.run.floor, 1)}`);
}
function startEncounter(src){
  const r = R();
  if(typeof src === 'string'){ r.monKey = src; r.mon = r.floor.rooms[src].m; } else { r.monKey = null; r.mon = src; }
  const champ = !!r.mon.champion;
  r.pg = rand(0,25); r.mg = rand(0,45); r.mb = {}; r.pb.defend = false; r.phase = 'combat'; r.log = [];
  const n = monName(r.mon);
  log(champ ? `A champion blocks the stairs: <b>${n}</b>.` : `${article(n)} <b>${n}</b> appears.`);
  if(monStats(r.mon).ambush || (r.floor && r.floor.pre==='dark')){ r.mg = 100 + rand(1,10); r.pg = rand(0,20); log('It strikes before you can react!'); }
  if(monStats(r.mon).rattle){ r.pb.slow = {t:2}; log('A dry rattle freezes you in place.'); }
  if(monStats(r.mon).snare){ r.pb.slow = {t:2}; log('You step straight into a snare.'); }
  if(monStats(r.mon).stench){ r.pb.weak = {t:3}; log('Its presence makes your arms heavy.'); }
  save(); render(); $('#view').scrollTop = 0;
  advance();
}
async function advance(){
  const r = R(); if(!r || r.phase!=='combat') return;
  busy = true; updateCombatUI();
  for(let g=0; g<2000; g++){
    if(!S.run || S.run.phase!=='combat'){ busy = false; return; }
    if(r.mg >= 100 && r.mg > r.pg){
      await sleep(420);
      if(!S.run || S.run.phase!=='combat'){ busy = false; return; }
      r.mg -= 100; monsterTurn();
      updateCombatUI();
      if(r.phase!=='combat') return;
      continue;
    }
    if(r.pg >= 100){ playerTurnStart(); if(r.phase==='combat'){ busy = false; updateCombatUI(); save(); } return; }
    r.pg += heroSpd()/10; r.mg += monSpd()/10;
  }
  busy = false;
}
function playerTurnStart(){
  const r = R(), pb = r.pb, hs = heroStats(), h = S.hero;
  pb.defend = false;
  if(hs.regen > 0 && h.hp < hs.maxhp){ const v = Math.max(1, Math.round(hs.maxhp*hs.regen/100)); h.hp = Math.min(hs.maxhp, h.hp+v); floatNum('+'+v,'hero','heal'); }
  if(hs.regen < 0 && h.hp > 1){ const v = Math.max(1, Math.round(hs.maxhp*-hs.regen/100)); h.hp = Math.max(1, h.hp-v); floatNum(MINUS+v,'hero'); }
  if(pb.poison){ h.hp -= pb.poison.d; floatNum(MINUS+pb.poison.d,'hero','poison'); log(`Poison burns you for ${pb.poison.d}.`); if(--pb.poison.t <= 0) delete pb.poison; }
  if(pb.burn){ h.hp -= pb.burn.d; floatNum(MINUS+pb.burn.d,'hero','crit'); log(`You burn for ${pb.burn.d}.`); if(--pb.burn.t <= 0) delete pb.burn; }
  for(const k of ['slow','weak','corrode','fort','haste','blind']) if(pb[k] && --pb[k].t <= 0) delete pb[k];
  if(h.hp <= 0) onDeath();
}
function absorb(dmg){
  const r = R();
  if(r.mb.shield){ const a = Math.min(r.mb.shield, dmg); r.mb.shield -= a; dmg -= a; if(r.mb.shield <= 0) delete r.mb.shield; if(a) floatNum(`${a} blocked`,'mon','miss'); }
  return dmg;
}
function endPlayerAction(){
  const r = R(); r.pg -= 100;
  if(S.hero.hp <= 0) return onDeath();
  if(r.mon.hp <= 0) return victory();
  save(); advance();
}
function playerAttack(){
  if(!canAct()) return;
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  if(r.pb.blind && Math.random() < .35){ log('Blinded, you swing at nothing.'); floatNum('Miss','mon','miss'); }
  else if(Math.random()*100 < ms.dodge + (r.mb.camo?40:0)){ log(`You swing, but ${short(m)} dodges.`); floatNum('Miss','mon','miss'); }
  else{
    let dmg = calcDmg(heroAtk(), hs.magic ? 0 : monDef());
    const crit = Math.random()*100 < hs.crit; if(crit) dmg = Math.round(dmg*1.75);
    dmg += hs.fire;
    if(ms.hide) dmg = Math.max(1, Math.round(dmg*ms.hide));
    dmg = absorb(dmg);
    m.hp -= dmg;
    if(dmg>0){ floatNum(dmg,'mon',crit?'crit':''); pulse($('#monWrap'),'hit'); }
    log(crit ? `<b>Critical hit!</b> You strike ${short(m)} for ${dmg}.` : `You hit ${short(m)} for ${dmg}.`);
    if(hs.lifesteal && dmg>0){ const v = Math.max(1, Math.round(dmg*hs.lifesteal/100)); S.hero.hp = Math.min(hs.maxhp, S.hero.hp+v); floatNum('+'+v,'hero','heal'); }
    if(hs.venom) r.mb.poison = {t:3, d:Math.max(1, Math.round(hs.atk*.2))};
    if(ms.thorns && dmg>0){ const t = Math.max(1, Math.round(dmg*ms.thorns/100)); S.hero.hp -= t; floatNum(MINUS+t,'hero'); log(`Thorns cut you for ${t}.`); }
  }
  endPlayerAction();
}
function playerDefend(){
  if(!canAct()) return;
  const r = R(), hs = heroStats();
  r.pb.defend = true;
  const v = Math.max(1, Math.round(hs.maxhp*.05)); S.hero.hp = Math.min(hs.maxhp, S.hero.hp+v); floatNum('+'+v,'hero','heal');
  log('You raise your guard. Damage taken is halved until your next turn.');
  endPlayerAction();
}
function playerFlee(){
  if(!canAct()) return;
  const r = R();
  const chance = Math.min(.8, Math.max(.15, .4 + (heroSpd()-monSpd())/250));
  if(Math.random() < chance){ toast('You escaped. It’s still there.'); r.fled = true; nextStep(); return; }
  log(`You try to flee, but ${short(r.mon)} cuts you off.`);
  endPlayerAction();
}
function monAttack(mult=1, ignoreArmor=false){
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  pulse($('#monWrap'),'lunge');
  if(Math.random()*100 < hs.dodge - ms.acc){ log(`You dodge ${short(m)}.`); floatNum('Dodged','hero','miss'); return 0; }
  if(ms.execute && S.hero.hp < hs.maxhp*.3){ mult *= 2; log(`${cap(short(m))} sees you falter.`); }
  let dmg = calcDmg(ms.atk*mult*(r.mb.rally?1.3:1), (ignoreArmor||ms.magichit) ? 0 : heroDef()*(ms.pierce?.5:1));
  const crit = Math.random()*100 < ms.crit; if(crit) dmg = Math.round(dmg*1.5);
  if(r.pb.defend) dmg = Math.max(1, Math.round(dmg*.5));
  const blocked = Math.random()*100 < hs.block;

  S.hero.hp -= dmg; floatNum(blocked ? `Block ${dmg}` : MINUS+dmg,'hero',crit?'crit':(blocked?'miss':'')); if(dmg>0) ouch();
  log(blocked ? `You block ${short(m)}, taking only ${dmg}.` : `${cap(short(m))} ${crit?'<b>crits</b>':'hits'} you for ${dmg}.`);
  if(ms.lifesteal && dmg>0){ const v = Math.max(1, Math.round(dmg*ms.lifesteal/100)); m.hp = Math.min(ms.hp, m.hp+v); floatNum('+'+v,'mon','heal'); }
  if(ms.venom && dmg>0) r.pb.poison = {t:ms.necro?5:3, d:Math.max(1, Math.round(ms.atk*.2*(ms.venom2?2:1)))};
  if(ms.flash && dmg>0 && Math.random() < .5) r.pb.blind = {t:2};
  if(ms.burn && dmg>0) r.pb.burn = {t:3, d:Math.max(1, Math.round(ms.atk*.2))};
  if(ms.hexhit && dmg>0 && Math.random() < .4) r.pb.weak = {t:2};
  if(ms.steal && dmg>0 && S.hero.gold>0){ const g = Math.min(S.hero.gold, 2+m.lvl*2); S.hero.gold -= g; m.stolen = (m.stolen||0)+g; floatNum(`${MINUS}${g} gold`,'hero','miss'); }
  if(ms.chill && dmg>0) r.pb.slow = {t:2};
  if(ms.corrode && dmg>0) r.pb.corrode = {t:3};
  if(hs.thorns && dmg>0){ const t = Math.max(1, Math.round(dmg*hs.thorns/100)); m.hp -= t; floatNum(t,'mon'); }
  return Math.max(dmg, blocked ? 1 : 0);
}
function canUseAbility(id){
  const r = R(), m = r.mon, ms = monStats(m);
  switch(id){
    case 'mend': return m.hp < ms.hp*.6;
    case 'harden': return !r.mb.harden;
    case 'barrier': return !r.mb.shield;
    case 'curse': return !r.pb.weak;
    case 'web': case 'screech': return !r.pb.slow;
    case 'spore_cloud': return !r.pb.poison;
    case 'roar': return !r.pb.weak;
    case 'lickwounds': return m.hp < ms.hp*.6;
    case 'buzz': return !r.pb.slow;
    case 'dust': return !r.pb.blind;
    case 'camouflage': return !r.mb.camo;
    case 'scurry': return !r.mb.camo;
    case 'coil': return !r.mb.harden;
    case 'rally': case 'warcry': return !r.mb.rally;
    case 'shield_wall': return !r.mb.harden;
    case 'dirty_trick': return !r.pb.blind;
    case 'howl': return !r.pb.weak;
    case 'holylight': return !r.pb.blind;
    case 'spit': return !r.pb.blind;

  }
}
function useAbility(id){

    case 'buzz': r.pb.slow = {t:2}; say('You’re slowed.'); break;

    case 'strike': monAttack(1.4); say(''); break;

function monsterTurn(){
  const r = R(), m = r.mon, ms = monStats(m), mb = r.mb;
  if(ms.regen && m.hp < ms.hp){ const v = Math.max(1, Math.round(ms.hp*ms.regen/100)); m.hp = Math.min(ms.hp, m.hp+v); floatNum('+'+v,'mon','heal'); }
  if(mb.poison){ m.hp -= mb.poison.d; floatNum(mb.poison.d,'mon','poison'); log(`Poison eats at ${short(m)} for ${mb.poison.d}.`); if(--mb.poison.t <= 0) delete mb.poison; }
  if(m.hp <= 0) return victory();
  let used = false;
  if(m.abilities.length && Math.random() < .32){
    const ok = m.abilities.filter(canUseAbility);
    if(ok.length){ useAbility(pick(ok)); used = true; }
  }
  if(!used){
    if(ms.multi){ monAttack(.5); if(S.hero.hp>0 && m.hp>0) monAttack(.5); if(S.hero.hp>0 && m.hp>0) monAttack(.5); }
    else monAttack(1);
  }
  for(const k of ['harden','slow','camo','rally']) if(mb[k] && --mb[k].t <= 0) delete mb[k];
  if(S.hero.hp <= 0) return onDeath();
  if(m.hp <= 0) return victory();
}
function victory(){
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  if(r.phase!=='combat') return;
  r.phase = 'loot'; r.kills++;
  const xp = Math.max(1, Math.round(ms.xp*(1+hs.xp/100)));
  const gold = Math.max(1, Math.round(ms.gold*rand(.8,1.25)*(1+hs.gold/100))) + (m.stolen||0);
  if(m.stolen) toast(`You got back the ${m.stolen} gold it stole.`);
  S.hero.gold += gold;
  r.reward = {kind:'kill', xp, gold, name:monName(m)};
  if(r.monKey && r.floor && r.floor.rooms[r.monKey]){ const rm = r.floor.rooms[r.monKey]; rm.done = true; delete rm.m; r.monKey = null; }
  r.tookAll = false;
  const items = [];
  const ch = .45 + (m.rarity==='magic'?.15:m.rarity==='rare'?.35:0) + (m.champion?.3:0);
  if(Math.random() < ch) items.push(genItem(m.lvl));
  if((m.rarity==='rare'||m.champion) && Math.random() < .55) items.push(genItem(m.lvl+1));
  if(Math.random() < .14) items.push(genItem(m.lvl,'potion'));
  r.loot = items;
  gainXp(xp);
  r.pb = {};
  save();
  updateHud();
  const f = $('#monHpFill');
  if(f){ paintHp(f, 0); $('#monHpTxt').textContent = `0 / ${ms.hp}`; }
  const w = $('#monWrap');
  busy = true;
  setTimeout(()=>{ if(w) w.classList.add('dying'); }, window.__fast ? 0 : 380);
  setTimeout(()=>{ busy = false; render(); }, window.__fast ? 0 : 1100);
}
function gainXp(x){
  const h = S.hero; h.xp += x;
  let need = xpNeed(h.lvl);
  while(h.xp >= need){
    h.xp -= need; h.lvl++; h.points = (h.points||0) + POINTS_PER_LEVEL;
    const hs = heroStats(); h.hp = Math.min(hs.maxhp, h.hp + Math.round(hs.maxhp*.4));
    toast(`Level ${h.lvl}. You have ${h.points} stat points to spend.`);
    need = xpNeed(h.lvl);
  }
}
function onDeath(){
  const r = R(); if(r.phase==='dead') return;
  r.phase = 'dead'; S.hero.hp = 0; updateHud();
  r.killer = monName(r.mon);
  r.lostItems = S.hero.bag.length; r.lostGold = Math.floor(S.hero.gold*(.5 - .1*((S.town && S.town.bank) || 0)));
  S.hero.bag = []; S.hero.gold -= r.lostGold;
  save();
  busy = true;
  setTimeout(()=>{ busy = false; closeSheet(); render(); }, window.__fast ? 0 : 700);
}
function nextStep(){
  const r = R();
  closeSheet();
  r.loot = []; r.phase = 'explore'; r.msg = null; busy = false;
  if(r.fled){ r.fled = false; const fl = r.floor; if(fl && fl.prev && fl.prev !== fl.cur){ const b = fl.prev; fl.prev = fl.cur; fl.cur = b; r.msg = 'You escape back the way you came.'; } }
  save(); render(); $('#view').scrollTop = 0;
}
function goTown(msg){
  S.run = null; S.screen = 'town'; S.shop = genShop(); busy = false;
  closeSheet(); save(); render(); $('#view').scrollTop = 0;
  if(msg) toast(msg);
}

/* ============ items ============ */
function findIn(list, id){ const i = list.findIndex(x => x.uid===id); return i<0 ? null : {i, it:list[i]}; }
function findItem(id){
  const h = S.hero;
  for(const sl of SLOTS) if(h.equip[sl] && h.equip[sl].uid===id) return h.equip[sl];
  const mer = (merchantRoom() || {}).items || [];
  for(const list of [h.bag, S.stash, S.shop.items, S.run ? S.run.loot : [], mer]){ const f = findIn(list, id); if(f) return f.it; }
  return null;
}
function useItem(id){
  const h = S.hero, f = findIn(h.bag, id); if(!f) return;
  const it = f.it, b = IBASE[it.base], s = itemStats(it);
  const inCombat = !!(S.run && S.run.phase==='combat');
  if(inCombat && !canAct()) return;
  if(b.kind==='scroll' && !inCombat){ toast('Scrolls can only be read during a fight.'); return; }
  if(!['potion','scroll'].includes(b.kind)) return;
  h.bag.splice(f.i, 1); closeSheet();
  const hs = heroStats();
  if(b.kind==='potion'){
    const amt = Math.max(0, Math.min(s.heal, hs.maxhp - h.hp)); h.hp += amt;
    floatNum('+'+amt,'hero','heal');
    const extra = [];
    if(S.run){ const pb = S.run.pb;
      if(s.fort){ pb.fort = {t:3, v:s.fort}; extra.push('Fortified'); }
      if(s.haste){ pb.haste = {t:3, v:s.haste}; extra.push('Hasted'); }
      if(s.cleanse){ delete pb.poison; delete pb.slow; delete pb.weak; delete pb.corrode; delete pb.blind; delete pb.burn; extra.push('Cleansed'); }
    }
    const msg = `You drink the ${itemName(it)} and recover ${amt} health.${extra.length?' '+extra.join(', ')+'.':''}`;
    if(!inCombat){ toast(msg); save(); render(); return; }
    log(msg);
  } else {
    const r = R(), m = r.mon;
    if(s.escape){ toast('You read the Escape Scroll and slip away.'); r.fled = true; nextStep(); return; }
    let dmg = absorb(Math.round(s.dmg*(1+hs.spell/100)*(monStats(m).hide||1))); m.hp -= dmg;
    if(dmg>0){ floatNum(dmg,'mon','crit'); pulse($('#monWrap'),'hit'); }
    if(s.frost) r.mb.slow = {t:3};
    log(`Flames engulf ${short(m)} for ${dmg}.${s.frost?' It’s slowed.':''}`);
  }
  endPlayerAction();
}
function equipItem(arg){
  const [id, from] = arg.split('|');
  if(S.run && S.run.phase==='combat'){ toast('You can’t change gear mid-fight.'); return; }
  const h = S.hero, list = from==='loot' ? R().loot : h.bag, f = findIn(list, id); if(!f) return;
  const it = f.it, slot = IBASE[it.base].kind; if(!GEAR.has(slot)) return;
  const displaced = [];
  if(h.equip[slot]) displaced.push(h.equip[slot]);
  if(slot==='weapon' && IBASE[it.base].two && h.equip.shield) displaced.push(h.equip.shield);
  if(slot==='shield' && h.equip.weapon && IBASE[h.equip.weapon.base].two) displaced.push(h.equip.weapon);
  const after = h.bag.length - (from==='bag' ? 1 : 0) + displaced.length;
  if(after > bagMax()){ toast('Your bag is full. Sell, drop or equip something to make room.'); openSheet(bagSheet(),'bag'); return; }
  list.splice(f.i, 1);
  for(const d of displaced){ for(const sl of SLOTS) if(h.equip[sl] && h.equip[sl].uid===d.uid) h.equip[sl] = null; }
  h.equip[slot] = it;
  h.bag.push(...displaced);
  h.hp = Math.min(h.hp, heroStats().maxhp);
  toast(`Equipped ${itemName(it)}.`);
  save(); render();
  if(from==='loot'){ if(!R().loot.length) R().tookAll = true; closeSheet(); render(); } else openSheet(bagSheet(),'bag');
}
function unequip(slot){
  const h = S.hero;
  if(S.run && S.run.phase==='combat') return toast('You can’t change gear mid-fight.');
  if(!h.equip[slot]) return; if(h.bag.length >= bagMax()) return toast('Your bag is full.');
  h.bag.push(h.equip[slot]); h.equip[slot] = null;
  h.hp = Math.min(h.hp, heroStats().maxhp);
  save(); render(); openSheet(bagSheet(),'bag');
}
/* Drinking a potion straight off the ground after a fight */
function potionUseful(it){ const s = itemStats(it); return S.hero.hp < heroStats().maxhp || !!s.fort || !!s.haste; }
function drinkLoot(id){
  const r = R(), f = r && findIn(r.loot, id); if(!f) return;
  const it = f.it; if(IBASE[it.base].kind!=='potion') return;
  const s = itemStats(it), hs = heroStats(), h = S.hero;
  const amt = Math.max(0, Math.min(s.heal, hs.maxhp - h.hp)); h.hp += amt;
  const extra = [];
  if(s.fort){ r.pb.fort = {t:3, v:s.fort}; extra.push('Fortified for the next fight'); }
  if(s.haste){ r.pb.haste = {t:3, v:s.haste}; extra.push('Hasted for the next fight'); }
  r.loot.splice(f.i, 1); if(!r.loot.length) r.tookAll = true;
  floatNum('+'+amt, 'hero', 'heal');
  toast(`You drink the ${itemName(it)} and recover ${amt} health.${extra.length ? ' '+extra.join('. ')+'.' : ''}`);
  closeSheet(); save(); render();
}
function takeLoot(id){
  const r = R(); const f = r && findIn(r.loot, id); if(!f) return;
  if(S.hero.bag.length >= bagMax()){ toast('Your bag is full. Sell, drop or equip something to make room.'); openSheet(bagSheet(),'bag'); return; }
  r.loot.splice(f.i,1); S.hero.bag.push(f.it);
  toast(`Picked up ${itemName(f.it)}.`);
  save(); render();
  if(!r.loot.length) r.tookAll = true;
  closeSheet(); render();
}

  next: () => nextStep(),

  retrieve: a => { const f = findIn(S.stash, a); if(!f || S.hero.bag.length >= bagMax()) return; S.stash.splice(f.i,1); S.hero.bag.push(f.it); closeSheet(); save(); render(); },
  resetAsk: () => openSheet(`<div class="grab"></div><h3 class="sheet-title">Start a new character?</h3><p class="lead" style="margin-top:8px">This erases your level, gold, gear and stash.</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Keep playing</button><button class="btn primary" data-act="reset">Start over</button></div>`),
  upgrade: a => { const u = UPGRADES.find(x => x.id===a); if(!u) return; const t = S.town, lv = t[a]||0; if(lv >= u.max) return; const c = u.cost[lv]; if(S.hero.gold < c) return;
    S.hero.gold -= c; t[a] = lv+1;
    if(a==='train') S.hero.points = (S.hero.points||0) + 2;
    if(a==='temple') S.hero.hp = Math.min(heroStats().maxhp, S.hero.hp + Math.round(heroStats().maxhp*.08));
    if(a==='smith') S.shop = genShop();
    toast(`${u.name} upgraded to level ${t[a]}.`); save(); render(); },
  reset: () => { closeSheet(); newGame(); save(); render(); toast('A new adventurer arrives in Emberhold.'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el.dataset.arg, el);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && sheetOpen()) closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ============ boot ============ */
const hadOldSave = (() => { try{ return !localStorage.getItem(SAVE_KEY) && !!localStorage.getItem('affix-deep-v1'); }catch(e){ return false; } })();
if(!load()) newGame();
render();
if(hadOldSave){ toast('Gear works differently now, so a fresh character starts in Emberhold.'); try{ localStorage.removeItem('affix-deep-v1'); }catch(e){} save(); }
if(S.run && S.run.phase==='combat'){ if(S.run.pg < 100) advance(); }


</script>
</body>
</html>
