const greetNow = {};
function greet(b){ const f = TOWNFOLK[b]; if(!f) return ''; if(!greetNow[b]) greetNow[b] = pick(f.lines); return greetNow[b]; }
function matsHtml(){
  const banked = Object.entries(S.mats||{}).filter(([,c]) => c > 0), pend = S.run && S.run.track ? Object.entries(S.run.track.mats).filter(([,c]) => c > 0) : [];
  if(!banked.length && !pend.length) return '';
  return `<h3 class="section-h">Materials pouch <small class="sub">doesn’t use bag space</small></h3>
    ${banked.length ? `<p class="statline">${banked.map(([m,c]) => `<span>${MATS[m].name} <b>${c}</b></span>`).join('')}</p>` : ''}
    ${pend.length ? `<p class="sub">Carried this run, safe once you’re home:</p><p class="statline pending">${pend.map(([m,c]) => `<span>${MATS[m].name} <b>+${c}</b></span>`).join('')}</p>` : ''}`;
}
function keeperHtml(b, title){
  const f = TOWNFOLK[b];
  return `<div class="keeper"><div class="kface"><img src="${f.art}" alt="${f.name}"></div>
    <div class="kbox"><span class="kname">${f.name}</span><span class="ktitle">${f.title}${title ? ', '+title : ''}</span><p>“${greet(b)}”</p></div></div>`;
}
/* ============ render ============ */
function render(){
  updateHud();
  const v = $('#view');
  if(S.run) v.innerHTML = dungeonView();
  else if(S.screen==='shop') v.innerHTML = shopView();
  else if(S.screen==='tavern') v.innerHTML = tavernView();
  else if(S.screen==='guild') v.innerHTML = guildView();
  else if(QUEST_GIVERS.includes(S.screen)) v.innerHTML = buildingView(S.screen);
  else v.innerHTML = townView();
  if(S.run && S.run.phase==='combat') updateCombatUI();
  if(S.run && S.run.phase==='explore') centerMap(false);
  if(!S.run && (S.screen==='town' || !S.screen)) centerTown(false);
}
function itemRow(it, ctx, right=''){
  return `<div class="row r-${it.rarity}"><button class="rowmain" data-act="item" data-arg="${it.uid}|${ctx}">
    <span class="ico">${ICON[IBASE[it.base].icon]}</span>
    <span><span class="nm">${itemNameHtml(it)}${it.qty > 1 ? ` <span class="qty">x${it.qty}</span>` : ''}</span><br><span class="sub">Lv ${it.ilvl} ${kindName(it)}, ${itemShort(it)}</span></span></button>${['shopBuy','merchant','shopSell'].includes(ctx) ? '' : worthTag(it)}${right}</div>`;
}
function worthTag(it){ return `<span class="worth" title="Sells for ${sellPrice(it)} gold"><span class="coin"></span>${sellPrice(it)}</span>`; }
function priceTag(n){ return `<span class="price"><span class="coin"></span>${n}</span>`; }
function dollHtml(){
  const h = S.hero, twoH = h.equip.weapon && IBASE[h.equip.weapon.base].two;
  return `<div class="doll">${SLOTS.map(sl => {
    const it = h.equip[sl];
    if(it) return `<button class="slot r-${it.rarity}" data-act="item" data-arg="${it.uid}|equipped" aria-label="${SLOT_NAME[sl]}: ${itemName(it)}">${ICON[IBASE[it.base].icon]}<span>${SLOT_NAME[sl]}</span></button>`;
    const note = sl==='shield' && twoH ? 'Two hands' : SLOT_NAME[sl];
    return `<div class="slot empty" aria-label="${SLOT_NAME[sl]} empty">${ICON[SLOT_ICON[sl]]}<span>${note}</span></div>`;
  }).join('')}</div>`;
}


function shopView(){
  const h = S.hero, full = h.bag.length >= bagMax();
  let body = '';
  if(shopTab==='buy'){
    const sl = stapleLvl();
    const staples = STAPLES.map(b => { const it = mk(b, sl); const p = itemValue(it);
      return `<div class="row"><span class="ico">${ICON[IBASE[b].icon]}</span><span style="flex:1"><span class="nm">${IBASE[b].name}</span><br><span class="sub">Lv ${sl}, ${itemShort(it)}</span></span>
      <button class="btn sm" data-act="buyStaple" data-arg="${b}" ${h.gold<p||full?'disabled':''}>${priceTag(p)}</button></div>`; }).join('');
    const wares = S.shop.items.length ? S.shop.items.map(it => itemRow(it, 'shopBuy', `<button class="btn sm" data-act="buy" data-arg="${it.uid}" ${h.gold<itemValue(it)||full?'disabled':''}>${priceTag(itemValue(it))}</button>`)).join('') : `<p class="empty-note">Sold out. Restock or come back after your next run.</p>`;
    body = `<h3 class="section-h">Upgrades <small class="sub">Permanent</small></h3><div class="rows">${perkRow('pack')}</div>
      <h3 class="section-h">Always in stock</h3><div class="rows">${staples}</div>
      <h3 class="section-h">Today’s wares</h3><p class="sub" style="margin-bottom:6px">Tap an item to compare it with what you’re wearing.</p><div class="rows">${wares}</div>
      <div class="stack"><button class="btn" data-act="restock" ${h.gold<15?'disabled':''}>Restock wares for ${priceTag(15)}</button></div>
      ${full?'<p class="empty-note">Your bag is full. Sell something first.</p>':''}`;
  } else {
    const gear = h.bag.filter(isGear), total = gear.reduce((a,it)=>a+sellPrice(it),0);
    body = h.bag.length ? `${gear.length?`<div class="stack" style="margin-top:0;margin-bottom:10px"><button class="btn primary" data-act="sellGear">Sell all ${gear.length} gear for ${priceTag(total)}</button></div>`:''}
      <div class="rows">${[...h.bag, ...(h.belt||[])].map(it => itemRow(it, 'shopSell', `<button class="btn sm" data-act="sell" data-arg="${it.uid}">${priceTag(sellPrice(it))}</button>`)).join('')}</div>
      <p class="sub" style="margin-top:8px">Selling gear keeps your potions and scrolls.</p>` : `<p class="empty-note">Your bag is empty. Pick up loot in the dungeon and sell it here.</p>`;
  }
  return `<div class="town"><button class="back" data-act="go" data-arg="town">${ICON.back} Emberhold</button>
    <h1 class="bname">Shop</h1>${keeperHtml('shop')}
    <div class="seg"><button class="${shopTab==='buy'?'on':''}" data-act="shopTab" data-arg="buy">Buy</button><button class="${shopTab==='sell'?'on':''}" data-act="shopTab" data-arg="sell">Sell (${h.bag.length})</button></div>
    ${body}</div>`;
}

function restCost(){ return 5 + 3*S.hero.lvl; }
function tavernView(){
  const h = S.hero, hs = heroStats(), hurt = h.hp < hs.maxhp, c = restCost();
  const stash = S.stash.length ? S.stash.map(it => itemRow(it, 'stash', `<button class="btn sm" data-act="retrieve" data-arg="${it.uid}" ${h.bag.length>=bagMax()?'disabled':''}>Take</button>`)).join('') : `<p class="empty-note">Nothing stored. Items here are safe if you die.</p>`;
  const bag = h.bag.length ? h.bag.map(it => itemRow(it, 'tavernBag', `<button class="btn sm" data-act="store" data-arg="${it.uid}">Store</button>`)).join('') : `<p class="empty-note">Your bag is empty.</p>`;
  return `<div class="town"><button class="back" data-act="go" data-arg="town">${ICON.back} Emberhold</button>
    <h1 class="bname">Tavern</h1>${keeperHtml('tavern')}<p class="lead" style="margin-top:8px">${hurt ? `You have ${h.hp} of ${hs.maxhp} health.` : 'You’re fully rested.'}</p>
    <div class="stack">
      <button class="btn primary" data-act="rest" ${!hurt||h.gold<c?'disabled':''}>Rent a room and heal fully for ${priceTag(c)}</button>
      <button class="btn" data-act="restFree" ${!hurt?'disabled':''}>Sleep in the stable for free (heals half)</button>
    </div>
    <h3 class="section-h">Your stash (${S.stash.length})</h3><div class="rows">${stash}</div>
    <h3 class="section-h">Your bag (${h.bag.length} of ${bagMax()})</h3><div class="rows">${bag}</div></div>`;
}

function floorBar(){
  const r = R();
  return `<div class="floorbar"><span>Floor ${r.depth}</span><button class="fname" data-act="floorInfo">${floorName(r.floor, r.depth)} ⓘ</button></div>`;
}
function dungeonView(){
  const r = R();
  if(r.phase==='explore') return exploreView();
  if(r.phase==='combat'){
    const m = r.mon;
    const tags = `${m.champion?'<span class="tag champ">Champion</span>':''}${m.rarity!=='normal'?`<span class="tag ${m.rarity}">${cap(m.rarity)}</span>`:''}`;
    return `<div class="dun fight">${floorBar()}
      <div class="arena">
        <div class="stage-frame"><div class="stage" data-act="monDetail" role="button" aria-label="Show monster details">${monArt(m,'monWrap')}<div class="floats" id="monFloat"></div></div></div>
        ${monPanel(m, tags)}
      </div>
      <div class="order" id="order"></div>
      <ul class="log" id="log"></ul>

function canAct(){ const r = R(); return !!r && r.phase==='combat' && !busy && r.pg >= 100; }
function statusChips(obj, isHero){
  const out = [];
  if(isHero){
    if(obj.defend) out.push(['Defending','good']);
    if(obj.poison) out.push([`Poisoned ${obj.poison.t}`,'bad']);
    if(obj.slow) out.push([`Slowed ${obj.slow.t}`,'bad']);
    if(obj.weak) out.push([`Cursed ${obj.weak.t}`,'bad']);
    if(obj.corrode) out.push([`Corroded ${obj.corrode.t}`,'bad']);
    if(obj.blind) out.push([`Blinded ${obj.blind.t}`,'bad']);
    if(obj.burn) out.push([`Burning ${obj.burn.t}`,'bad']);
    if(obj.fort) out.push([`Fortified ${obj.fort.t}`,'good']);
    if(obj.haste) out.push([`Hasted ${obj.haste.t}`,'good']);
  } else {
    if(obj.harden) out.push([`Hardened ${obj.harden.t}`,'bad']);
    if(obj.shield) out.push([`Shield ${obj.shield}`,'bad']);
    if(obj.poison) out.push([`Poisoned ${obj.poison.t}`,'good']);
    if(obj.slow) out.push([`Slowed ${obj.slow.t}`,'good']);
    if(obj.camo) out.push([`Hidden ${obj.camo.t}`,'bad']);
    if(obj.burn) out.push([`Burning ${obj.burn.t}`,'good']);
    if(obj.weak) out.push([`Weakened ${obj.weak.t}`,'good']);
    if(obj.blind) out.push([`Blinded ${obj.blind.t}`,'good']);
    if(obj.sunder) out.push([`Sundered ${obj.sunder.t}`,'good']);
    if(obj.rally) out.push([`Rallied ${obj.rally.t}`,'bad']);
  }
  return out.map(([t,c]) => `<span class="chip ${c}">${t}</span>`).join('');
}
function predictOrder(n){
  const r = R(); let p = r.pg, m = r.mg; const ps = heroSpd(), ms = monSpd(); const out = [];
  for(let g=0; g<3000 && out.length<n; g++){
    if(m>=100 && m>p){ out.push('m'); m -= 100; continue; }
    if(p>=100){ out.push('p'); p -= 100; continue; }
    p += ps/10; m += ms/10;
  }
  return out;
}
function updateCombatUI(){

function heroStatLine(hs){

  return `<p class="statline" data-act="stats" role="button" aria-label="Open character stats">${parts.map(([l,v]) => `<span>${l} <b>${v}</b></span>`).join('')}</p>${hs.magic?'<p class="sub">* Your staff hits with spell power and ignores armor.</p>':''}`;

function heroStatGrid(hs){
  const h = S.hero;
  const rows = [statBox('Health',`${h.hp}/${hs.maxhp}`), statBox('Damage', hs.atk + (hs.magic?'*':'')), statBox('Armor',hs.def), statBox('Speed',hs.spd), statBox('Critical',hs.crit+'%'), statBox('Dodge',hs.dodge+'%')];
  const extra = [['block','Block','%'],['lifesteal','Life steal','%'],['thorns','Reflect','%'],['regen','Regen','%'],['fire','Fire','+'],['spell','Spell','%'],['gold','Gold find','%'],['xp','Exp bonus','%']];

function bagSheet(){

/* A simple score for the ▲ hint: how much your key stats would change. */
function upgradeScore(it){
  if(!isGear(it)) return 0;
  const slot = IBASE[it.base].kind, a = heroStats(), b = heroStatsWith(slot, it);
  return (b.atk-a.atk)*3 + (b.def-a.def)*2.5 + (b.maxhp-a.maxhp)*.5 + (b.spd-a.spd)*.4 + (b.crit-a.crit)*.8 + (b.dodge-a.dodge)*.8 + (b.block-a.block)*.7 + (b.lifesteal-a.lifesteal) + (b.regen-a.regen)*3 + (b.fire-a.fire)*2 + (b.spell-a.spell)*(a.magic||b.magic?.4:.1) + (b.thorns-a.thorns)*.3 + (b.gold-a.gold)*.1 + (b.xp-a.xp)*.1;
}
function upgradeMark(it){ return upgradeScore(it) > 1 ? '<span class="upmark" aria-label="Likely upgrade">▲</span>' : ''; }

function itemCard(it, title){
  if(!it) return `<div class="card cur"><div class="k">${title}</div><p class="cn sub">Nothing equipped</p></div>`;
  const b = IBASE[it.base], s = baseStats(it), fin = itemStats(it);
  const base = [];
  const order = [['atk','Damage'],['def','Armor'],['block','Block'],['spd','Speed'],['crit','Critical'],['dodge','Dodge'],['spell','Spell power'],['maxhp','Max health'],['gold','Gold found'],['regen','Regen'],['heal','Heals'],['dmg','Damage']];
  if(b.kind==='scroll'){
    if(fin.dmg) base.push(`<li>Damage ${fin.dmg}, ignores armor</li>`);
    if(s.healp) base.push(`<li>Heals ${fin.healp}% of your health</li>`);
    if(s.ward) base.push(`<li>+${fin.ward} armor for 4 turns</li>`);
    if(s.hasteS) base.push(`<li>+${fin.hasteS} speed for 3 turns</li>`);
    if(s.slowT) base.push(`<li>Slows the target ${fin.slowT} turns</li>`);
    if(s.leech) base.push(`<li>Heals you ${fin.leech}% of the damage</li>`);
    for(const f of ['burn','venomS','weakM','sunder','holy']) if(s[f]) base.push(`<li>${IFLAG[f]}</li>`);
  } else for(const [k,l] of order) if(fin[k] !== undefined && (s[k] !== undefined)) base.push(`<li>${l} ${k==='spd'?sgn(fin[k]):fin[k]}${PCT.has(k)?'%':''}</li>`);
  if(fin.escape) base.push('<li>Escape any fight</li>');

  return `<div class="card r-${it.rarity} ${title==='Equipped'?'cur':''}"><div class="k">${title}</div>
    <div class="cn">${itemNameHtml(it)}</div><div class="sub">Lv ${it.ilvl} ${kindName(it)}</div>
    <div class="cardworth">${priceTag(sellPrice(it))}<span>sell value</span></div>
    <ul class="basel">${base.join('')}</ul>${aff}
    </div>`;
}
function swapDelta(it){
  const slot = IBASE[it.base].kind, a = heroStats(), b = heroStatsWith(slot, it);
  const lines = [];
  for(const [k,l] of STAT_ROWS){ const d = b[k]-a[k]; if(d) lines.push(`<li class="${d>0?'up':'down'}">${l} ${a[k]}→${b[k]}</li>`); }
  if(a.magic !== b.magic) lines.push(`<li class="${b.magic?'up':'down'}">${b.magic?'Attacks ignore armor':'Attacks no longer ignore armor'}</li>`);
  if(a.venom !== b.venom) lines.push(`<li class="${b.venom?'up':'down'}">${b.venom?'Hits poison':'Hits no longer poison'}</li>`);

function itemSheet(it, ctx){

  const inCombat = !!(S.run && S.run.phase==='combat');

  const acts = [];
  if(ctx==='bag'){
    if(gear) acts.push(`<button class="btn primary" data-act="equip" data-arg="${it.uid}|bag" ${inCombat?'disabled':''}>${inCombat?'Not mid-fight':'Equip'}</button>`);
    if(b.kind==='potion') acts.push(`<button class="btn primary" data-act="use" data-arg="${it.uid}" ${inCombat&&!canAct()?'disabled':''}>Drink</button>`);
    if(b.kind==='scroll'){ const ss = itemStats(it), anywhere = ss.healp && !ss.dmg; acts.push(`<button class="btn primary" data-act="use" data-arg="${it.uid}" ${(inCombat ? !canAct() : !anywhere) ? 'disabled' : ''}>${inCombat || anywhere ? 'Read' : 'Read in a fight'}</button>`); }

  } else if(ctx==='equipped'){
    acts.push(`<button class="btn" data-act="unequip" data-arg="${b.kind}" ${inCombat||full?'disabled':''}>${full?'Bag is full':'Unequip'}</button>`, backBtn);
  } else if(ctx==='loot'){
    acts.push(`<button class="btn primary" data-act="take" data-arg="${it.uid}">${full?'Take (make room)':'Take'}</button>`);
    if(b.kind==='potion') acts.push(`<button class="btn drink" data-act="drinkLoot" data-arg="${it.uid}" ${potionUseful(it)?'':'disabled'}>${potionUseful(it)?'Drink now':'Already at full health'}</button>`);
    if(gear) acts.push(`<button class="btn equipnow" data-act="equip" data-arg="${it.uid}|loot">Equip now</button>`);
    acts.push(backBtn);
  } else if(ctx==='merchant'){

    acts.push(`<button class="btn primary" data-act="mbuy" data-arg="${it.uid}" ${h.gold<p||full?'disabled':''}>Buy for ${priceTag(p)}</button>`, backBtn);

  } else if(ctx==='shopSell'){
    acts.push(`<button class="btn primary" data-act="sell" data-arg="${it.uid}">Sell for ${priceTag(sellPrice(it))}</button>`, backBtn);
  } else if(ctx==='stash'){
    acts.push(`<button class="btn primary" data-act="retrieve" data-arg="${it.uid}" ${full?'disabled':''}>Move to bag</button>`, backBtn);
  } else if(ctx==='tavernBag'){
    acts.push(`<button class="btn primary" data-act="store" data-arg="${it.uid}">Store in stash</button>`, backBtn);
  } else acts.push(backBtn);

  const title = {smithy:'On the anvil', merchant:'Merchant’s wares', loot:'On the ground', bag:'In your bag', equipped:'Equipped', shopBuy:'For sale', shopSell:'In your bag', stash:'In your stash', tavernBag:'In your bag'}[ctx] || 'Item';
  let body;
  if(gear && ctx!=='equipped'){
    const cur = h.equip[b.kind];
    body = `<div class="cmpgrid">${itemCard(it, title)}${itemCard(cur, 'Equipped')}</div>${swapDelta(it)}`;
  } else {
    const note = b.kind==='scroll' ? (itemStats(it).escape ? 'Read during a fight to escape instantly.' : (itemStats(it).healp && !itemStats(it).dmg) ? 'Can be read anytime. Spell power boosts scroll damage.' : 'Read during a fight. Spell power boosts its damage.') : b.kind==='potion' ? 'Drinking takes your turn in a fight.' : '';
    body = `<div class="cmpgrid one">${itemCard(it, title)}</div>${note?`<p class="sub" style="margin-top:6px">${note}</p>`:''}`;
  }
  return `<div class="grab"></div>${body}<div class="sheet-actions">${acts.join('')}</div>`;

/* One-line summaries of a monster's prefix and suffix, shown right under its name in a fight. */
const MSHORT = {hp:'HP',atk:'Dmg',def:'Armor',spd:'Spd',dodge:'Dodge',crit:'Crit',acc:'Accuracy',lifesteal:'Leech',thorns:'Thorns',regen:'Regen',gold:'Gold'};
const MFLAG_SHORT = {venom:'Poison hits',chill:'Slowing hits',corrode:'Corroding hits',wounded:'Starts wounded',stench:'Starts you weakened',rage:'Enrages under half HP',flash:'Blinding hits',burn:'Burning hits'};
function affixShort(a){
  const out = [];
  if(a.mul) for(const k in a.mul){ if(k==='xp') continue; const p = Math.round((a.mul[k]-1)*100); if(p) out.push([`${sgn(p)}% ${MSHORT[k]||k}`, monGood(k,p)]); }
  if(a.add) for(const k in a.add){ const v = a.add[k]; out.push([k==='regen' ? `Regen ${v}%/turn` : `${sgn(v)}${PCT.has(k)?'%':''} ${MSHORT[k]||k}`, monGood(k,v)]); }
  if(a.flag) for(const f of a.flag) out.push([MFLAG_SHORT[f]||f, monGood(f,1)]);
  return out.map(([t,g]) => `<span class="${g?'up':'down'}">${t}</span>`).join('');
}
/* Right-hand monster panel in a fight: fixed size, scrolls inside itself, never resizes the screen. */
function panelLines(a){
  const out = [];
  if(a.mul) for(const k in a.mul){ if(k==='xp') continue; const p = Math.round((a.mul[k]-1)*100); if(p) out.push([`${sgn(p)}% ${MSHORT[k]||k}`, monGood(k,p)]); }
  if(a.add) for(const k in a.add){ const v = a.add[k]; out.push([k==='regen' ? `Regen ${v}%/turn` : `${sgn(v)}${PCT.has(k)?'%':''} ${MSHORT[k]||k}`, monGood(k,v)]); }
  if(a.flag) for(const f of a.flag) out.push([MFLAG_SHORT[f]||f, monGood(f,1)]);
  return out.map(([t,g]) => `<li class="${g?'up':'down'}">${t}</li>`).join('');
}
function monPanel(m, tags){
  const b = MONSTERS[m.base], ms = monStats(m), tr = TRAITS[b.trait];
  const sec = [];
  if(m.champion) sec.push(`<div class="psec"><b class="champ">Champion</b><ul><li class="down">+35% HP</li><li class="down">+15% Dmg</li></ul></div>`);
  if(tr) sec.push(`<div class="psec"><b class="trait">${tr.name}</b><ul><li class="${tr.good?'up':'down'}">${tr.short}</li></ul></div>`);
  if(m.pre) sec.push(`<div class="psec"><b class="afx">${MPRE[m.pre].name}</b><ul>${panelLines(MPRE[m.pre])}</ul></div>`);
  if(m.suf) sec.push(`<div class="psec"><b class="afx">${MSUF[m.suf].name}</b><ul>${panelLines(MSUF[m.suf])}</ul></div>`);
  const abil = m.abilities.map(id => `<li><b>${ABIL[id].name}</b> ${ABIL[id].desc}</li>`).join('');
  return `<aside class="mpanel r-${m.rarity}" id="mpanel" aria-label="Monster stats">
    <h2 class="pname">${monNameHtml(m)}</h2>
    <div class="pmeta">${tags}<span>Lv ${m.lvl} ${FAMILY[b.fam].name}</span></div>
    <div class="mhp"><i id="monHpFill"></i><span id="monHpTxt"></span></div>
    <div class="chips pchips" id="monStatus"></div>
    <div class="pstats" id="mstats"></div>
    ${sec.join('')}
    ${abil ? `<div class="psec"><b>Abilities</b><ul class="pabil">${abil}</ul></div>` : ''}
    <p class="pfoot">Worth ${Math.round(ms.xp)} exp, about ${Math.round(ms.gold)} gold</p>
  </aside>`;
}
function monLiveStats(){
  const r = R(), m = r.mon, ms = monStats(m), mb = r.mb;
  const dmg = Math.round(ms.atk*(mb.rally?1.3:1)), arm = Math.round(monDef()), spd = Math.round(monSpd()), dod = Math.round(ms.dodge + (mb.camo?40:0));
  const cell = (l, v, mod) => `<div class="pst ${mod||''}"><span>${l}</span><b>${v}</b></div>`;
  const rows = [
    cell('Damage', dmg, (mb.rally||ms.raging) ? 'buffed' : ''),
    cell('Armor', arm, mb.harden ? 'buffed' : ''),
    cell('Speed', spd, mb.slow ? 'nerfed' : ''),
    cell('Dodge', dod+'%', mb.camo ? 'buffed' : ''),
    cell('Crit', Math.round(ms.crit)+'%')
  ];
  if(ms.lifesteal) rows.push(cell('Leech', ms.lifesteal+'%'));
  if(ms.thorns) rows.push(cell('Thorns', ms.thorns+'%'));
  if(ms.regen) rows.push(cell('Regen', ms.regen+'%'));
  if(ms.hide) rows.push(cell('Resist', Math.round((1-ms.hide)*100)+'%'));
  if(ms.acc) rows.push(cell('Accuracy', sgn(ms.acc)+'%'));
  return rows.join('');
}
function affixOverlay(m){
  const box = []; let lines = 0;
  const add = (title, cls, body, n) => { box.push(`<div class="ao"><b class="${cls}">${title}</b>${body}</div>`); lines += n; };
  const count = a => (a.mul ? Object.entries(a.mul).filter(([k,v]) => k!=='xp' && Math.round((v-1)*100)).length : 0) + (a.add ? Object.keys(a.add).length : 0) + (a.flag ? a.flag.length : 0);
  if(m.champion) add('Champion', 'afn champ', '<span class="down">+35% HP</span><span class="down">+15% Dmg</span>', 2);
  const tr = TRAITS[MONSTERS[m.base].trait]; if(tr) add(tr.name, 'afn trait', `<span class="${tr.good?'up':'down'}">${tr.short}</span>`, 1);
  if(m.pre) add(MPRE[m.pre].name, 'afx', affixShort(MPRE[m.pre]), count(MPRE[m.pre]));
  if(m.suf) add(MSUF[m.suf].name, 'afx', affixShort(MSUF[m.suf]), count(MSUF[m.suf]));
  if(!box.length) return '';
  /* height needed, in ems: each effect line 1.05, each title 1.15; plus fixed pixels for padding, borders and gaps */
  const ems = lines*1.05 + box.length*1.15, px = 54 + box.length*9 + (box.length-1)*4;
  return `<div class="afxov r-${m.rarity}" aria-label="Monster affixes" style="font-size:clamp(10px, calc((100cqh - ${px}px) / ${ems.toFixed(2)}), 17px)">${box.join('')}</div>`;
}
function monSheet(m){
  const ms = monStats(m), b = MONSTERS[m.base];
  const blocks = (m.pre ? affixBlock('Prefix', MPRE[m.pre], modLines(MPRE[m.pre], MLAB, MFLAG, monGood), m.rarity) : '') +
                 (m.suf ? affixBlock('Suffix', MSUF[m.suf], modLines(MSUF[m.suf], MLAB, MFLAG, monGood), m.rarity) : '');
  const abil = m.abilities.map(id => `<div><b>${ABIL[id].name}</b><span>${ABIL[id].desc}</span></div>`).join('');
  return `<div class="grab"></div>
    <div class="msheet-head r-${m.rarity}"><div class="mini-stage">${monArt(m,'',true)}</div>
      <div><h3 class="mname sm">${monNameHtml(m)}</h3><p class="sub">Level ${m.lvl} ${m.champion?'champion ':''}${m.rarity==='normal'?'':m.rarity+' '}${FAMILY[b.fam].name}</p></div></div>
    <p class="flavor">${b.flavor}</p>
    ${b.trait?`<div class="affix trait"><h4>${TRAITS[b.trait].name}<small>Species trait</small></h4><ul><li class="${TRAITS[b.trait].good?'up':'down'}">${TRAITS[b.trait].desc}</li></ul></div>`:''}
    <div class="statgrid">${statBox('Health',`${Math.max(0,m.hp)}/${ms.hp}`)}${statBox('Damage',Math.round(ms.atk))}${statBox('Armor',Math.round(ms.def))}${statBox('Speed',Math.round(ms.spd))}${statBox('Dodge',Math.round(ms.dodge)+'%')}${statBox('Critical',Math.round(ms.crit)+'%')}</div>
    ${m.champion?`<div class="affix"><h4>Champion<small>Floor guardian</small></h4><ul><li class="down">+35% health</li><li class="down">+15% damage</li><li class="up">+80% experience and gold</li></ul></div>`:''}
    <div class="r-${m.rarity}">${blocks}</div>
    ${abil?`<h3 class="section-h" style="margin-top:6px">Abilities</h3><div class="abil">${abil}</div>`:''}
    <p class="sub" style="margin-top:12px">Worth ${Math.round(ms.xp)} experience and about ${Math.round(ms.gold)} gold.</p>
    <div class="sheet-actions"><button class="btn" data-act="closeSheet">Close</button></div>`;
}

/* ============ character stats screen ============ */
const openStats = new Set();
const ATTR_DESC = {
  str:'Each point above 5 adds 3% to your weapon damage.',
  dex:'Each point above 5 adds 1.5 speed, 0.6% dodge and 0.3% critical chance.',
  vit:'Each point above 5 adds 4 max health.',
  int:'Each point above 5 adds 3% spell power, which boosts scrolls and staff hits.',
  lck:'Each point above 5 adds 0.5% critical chance and 2% gold found.'
};
const DERIVED = [
  ['maxhp','Health','','How much damage you can take.'],
  ['atk','Damage','','A normal hit before the monster’s armor.'],
  ['def','Armor','','Reduces each hit you take. 30 armor halves damage.'],
  ['spd','Speed','','How often you act. 100 is average.'],
  ['crit','Critical','%','Chance to hit for 175% damage.'],
  ['dodge','Dodge','%','Chance to avoid an attack completely.'],
  ['block','Block','%','Chance to block 70% of a hit. Comes from shields.'],
  ['spell','Spell power','%','Boosts Flame Scrolls, and staff hits if you wield one.'],
  ['lifesteal','Life steal','%','Heals you for a share of the damage you deal.'],
  ['thorns','Reflect','%','Sends a share of damage taken back at the attacker.'],
  ['regen','Regen','%','Health regained at the start of each of your turns.'],
  ['fire','Fire damage','','Added to every hit, ignoring armor.'],
  ['gold','Gold found','%','Extra gold from monsters.'],
  ['xp','Experience','%','Extra experience from monsters.']
];
const ALWAYS = new Set(['maxhp','atk','def','spd','crit','dodge','block','spell']);
const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
function statGroup(k, label, unit, desc, total, entries, modTypes, raise, spent=0){
  const mod = r1(entries.filter(e => modTypes.includes(e.type)).reduce((a,e)=>a+e.v,0));
  const open = openStats.has(k);
  const modHtml = mod ? `<span class="mod ${mod>0?'up':'down'}">(${sgn(+fmt(mod))}${unit})</span>` : `<span class="mod zero">(±0)</span>`;
  const rows = entries.map(e => {
    const neutral = ['base','level','points'].includes(e.type);
    const name = e.type==='gear' ? `<span class="r-${e.rarity} gname">${e.src}</span> <small>${e.slot}</small>` : e.src;
    const val = e.type==='base' ? fmt(e.v) : sgn(+fmt(e.v));
    return `<li><span>${name}</span><b class="${neutral?'':(e.v>0?'up':'down')}">${val}${unit}</b></li>`;
  }).join('');
  return `<div class="sgroup ${open?'open':''}">
    <div class="srow"><button class="smain" data-act="statOpen" data-arg="${k}" aria-expanded="${open}">
      <span class="sl">${label}${spent ? ` <em class="spent" title="Points you spent">+${spent}</em>` : ''}</span><span class="sv">${fmt(total)}${unit}</span>${modHtml}<span class="caret" aria-hidden="true">▸</span></button>
      ${raise ? `<button class="btn sm raise" data-act="raise" data-arg="${k}" aria-label="Spend a point on ${label}">+1</button>` : ''}</div>
    ${open ? `<div class="sbreak"><p class="sub">${desc}</p><ul>${rows || '<li><span>Nothing affects this yet</span><b>0</b></li>'}<li class="tot"><span>Total</span><b>${fmt(total)}${unit}</b></li></ul></div>` : ''}
  </div>`;
}
function statsSheet(){
  const h = S.hero, {led, A} = heroLedger(), hs = heroStats();
  const spent = ATTR_KEYS.reduce((a,k)=>a+h.attr[k],0);
  const attrs = ATTRS.map(([k,l]) => statGroup(k, l, '', ATTR_DESC[k], A[k], led[k]||[], ['gear','cap'], h.points>0, h.attr[k])).join('');
  const derived = DERIVED.filter(([k]) => ALWAYS.has(k) || (led[k]||[]).length).map(([k,l,u,d]) => statGroup(k, l, u, d, hs[k], led[k]||[], ['attr','gear','cap','town'], false)).join('');
  const pb = pbuffs(), fx = [];
  if(S.run && S.run.phase==='combat'){
    if(pb.weak) fx.push(['Cursed','Damage −30%','down']); if(pb.corrode) fx.push(['Corroded','Armor −50%','down']); if(pb.slow) fx.push(['Slowed','Speed −40%','down']);
    if(pb.fort) fx.push(['Fortified',`Armor +${pb.fort.v}`,'up']); if(pb.haste) fx.push(['Hasted',`Speed +${pb.haste.v}`,'up']); if(pb.defend) fx.push(['Defending','Damage taken −50%','up']);
  }
  const respec = !S.run && spent ? `<div class="stack"><button class="btn" data-act="respec" ${h.gold<respecCost()?'disabled':''}>Take back all ${spent} points for ${priceTag(respecCost())}</button></div>` : '';
  return `<div class="grab"></div><h3 class="sheet-title">Character</h3>
    <p class="sub">Level ${h.lvl}, ${h.xp} of ${xpNeed(h.lvl)} experience to level ${h.lvl+1}. Tap any stat to see what’s affecting it.</p>
    ${h.points ? `<div class="pts">You have ${h.points} point${h.points===1?'':'s'} to spend. You get ${POINTS_PER_LEVEL} each level.</div>` : ''}
    <h3 class="section-h">Attributes</h3>
    <p class="sub legend">Green tag: points you’ve spent. Number in brackets: bonus or penalty from your gear.</p>
    ${attrs}
    <h3 class="section-h">Combat stats</h3>
    <p class="sub legend">Number in brackets: everything beyond your base and level.</p>
    ${derived}
    ${fx.length ? `<h3 class="section-h">Effects in this fight</h3><div class="abil">${fx.map(([n,t,c])=>`<div><b>${n}</b><span class="${c}">${t}</span></div>`).join('')}</div>` : ''}
    ${respec}
    <div class="sheet-actions"><button class="btn" data-act="bag">Inventory</button><button class="btn" data-act="closeSheet">Close</button></div>`;
}
function respecCost(){ return 10*S.hero.lvl; }
function rerenderStats(){ const sh = $('#sheet'), top = sh.scrollTop; sh.innerHTML = statsSheet(); sh.scrollTop = top; }

/* ============ exploration: a map of connected rooms ============ */
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
const FLOOR_NOUNS = ['Halls','Tunnels','Catacombs','Caverns','Warrens','Crypts','Depths','Abyss'];
/* Floors roll a prefix and a suffix too. */
const FPRE = {
  dark:{name:'Dark',desc:'Every monster here strikes first.'},
  infested:{name:'Infested',desc:'Monsters fill half again as many rooms.'},
  quiet:{name:'Quiet',desc:'Fewer rooms hold monsters.'},
  haunted:{name:'Haunted',desc:'The dead walk these halls: most monsters are undead.'},
  ancient:{name:'Ancient',desc:'Monsters are a level higher, and chests hold better loot.'},
  flooded:{name:'Flooded',desc:'Knee-deep water slows you by 15% in fights.'}
};
const FSUF = {
  riches:{name:'of Riches',desc:'Two extra treasure rooms.'},
  ambush:{name:'of Ambush',desc:'Monsters may jump you in empty rooms.'},
  traps:{name:'of Traps',desc:'Three extra trap rooms.'},
  rest:{name:'of Rest',desc:'A campfire and a shrine are always here.'},
  echoes:{name:'of Echoes',desc:'You can hear what waits nearby: rooms next to ones you’ve visited show what’s inside.'},
  trade:{name:'of Trade',desc:'A wandering merchant is always here.'}
};
const ROOM = {
  start:{name:'Entrance', art:'entrance'},
  empty:{name:'Empty Room'},
  mon:{name:'Monster'},
  chest:{name:'Treasure Room', art:'chest'},
  trap:{name:'Trapped Room', art:'trap'},
  stairs:{name:'Stairs Down', art:'stairs'},
  shrine:{name:'Shrine', art:'shrine'},
  fire:{name:'Campfire', art:'campfire'},
  merchant:{name:'Merchant', art:'merchant'}
};
const EMPTY_FLAVOR = ['Broken crates and old bones.','A collapsed storeroom. Nothing worth taking.','Water drips somewhere in the dark.','Faded writing covers the walls.','An old campsite, long cold.','Rusted chains hang from the ceiling.','The air smells of damp stone.'];

const key = (x,y) => x+','+y;
const unkey = k => k.split(',').map(Number);
function floorName(fl, depth){
  const noun = FLOOR_NOUNS[Math.min(FLOOR_NOUNS.length-1, Math.floor((depth-1)/2))];
  return `${fl.pre ? FPRE[fl.pre].name+' ' : ''}${noun}${fl.suf ? ' '+FSUF[fl.suf].name : ''}`;
}
function linked(fl, a, b){ return fl.links.includes(a < b ? a+'|'+b : b+'|'+a); }
function neighbors(fl, k){ const [x,y] = unkey(k); return DIRS.map(([dx,dy]) => key(x+dx,y+dy)).filter(n => fl.rooms[n] && linked(fl,k,n)); }
function bfsRooms(fl, from, passable){
  const dist = {[from]:0}, par = {}, q = [from];
  while(q.length){ const k = q.shift(); for(const n of neighbors(fl,k)){ if(dist[n] !== undefined) continue; if(passable && !passable(n)) continue; dist[n] = dist[k]+1; par[n] = k; q.push(n); } }
  return {dist, par};
}
function genFloor(depth){
  const fl = {rooms:{}, links:[], pre:null, suf:null, visited:{}, prev:null};
  if(depth > 1 && Math.random() < Math.min(.75, .2 + depth*.06)) fl.pre = pick(Object.keys(FPRE));
  if(depth > 1 && Math.random() < Math.min(.7, .15 + depth*.06)) fl.suf = pick(Object.keys(FSUF));
  const want = Math.round(clamp(9 + depth*1.5, 9, 22));
  const add = (x,y) => { const k = key(x,y); fl.rooms[k] = {x, y, t:'empty'}; return k; };
  const link = (a,b) => { const l = a < b ? a+'|'+b : b+'|'+a; if(!fl.links.includes(l)) fl.links.push(l); };
  const start = add(0,0); fl.rooms[start].t = 'start'; fl.rooms[start].done = true;
  // grow a branching tree: keep picking a room and pushing a corridor out of it in a random direction
  let guard = 0;
  while(Object.keys(fl.rooms).length < want && guard++ < 2000){
    const from = pick(Object.keys(fl.rooms)), [x,y] = unkey(from), [dx,dy] = pick(DIRS);
    const nk = key(x+dx, y+dy);
    if(fl.rooms[nk]) continue;
    if(neighbors(fl, from).length >= 3 && Math.random() < .7) continue;   // keep it from becoming a solid block
    add(x+dx, y+dy); link(from, nk);
  }
  // a few extra corridors make loops, so there's more than one way around
  for(const k of Object.keys(fl.rooms)){ const [x,y] = unkey(k); for(const [dx,dy] of DIRS){ const n = key(x+dx,y+dy); if(fl.rooms[n] && !linked(fl,k,n) && Math.random() < .12) link(k,n); } }
  const {dist, par} = bfsRooms(fl, start);
  const keys = Object.keys(fl.rooms).filter(k => k !== start);
  const far = keys.slice().sort((a,b) => dist[b] - dist[a]);
  const stairs = far[0]; fl.rooms[stairs].t = 'stairs'; fl.rooms[stairs].done = true;
  const free = () => shuffle(keys.filter(k => fl.rooms[k].t === 'empty'));
  const leaves = () => shuffle(keys.filter(k => fl.rooms[k].t === 'empty' && neighbors(fl,k).length === 1));
  const set = (k, t, extra={}) => { if(!k) return; Object.assign(fl.rooms[k], {t}, extra); };
  const monOpts = {fams: fl.pre==='haunted' && Math.random() < .8 ? ['undead'] : null, lvl: fl.pre==='ancient' ? 1 : 0};
  if(depth % 3 === 0){ const g = par[stairs]; if(g && g !== start) set(g, 'mon', {m:genMonster(depth, true, monOpts)}); }
  for(let i=0; i<2 + (fl.suf==='riches' ? 2 : 0); i++) set(leaves()[0] || free()[0], 'chest');
  for(let i=0; i<1 + (fl.suf==='traps' ? 3 : 0); i++) set(free()[0], 'trap');
  if(fl.suf==='rest' || Math.random() < .45) set(leaves()[0] || free()[0], 'fire');
  if(fl.suf==='rest' || Math.random() < .35) set(leaves()[0] || free()[0], 'shrine');
  if(fl.suf==='trade' || (depth > 1 && Math.random() < .3)) set(leaves()[0] || free()[0], 'merchant', {items:[genItem(depth,'potion'), genItem(depth), genItem(depth), genItem(depth,'scroll')]});
  const share = fl.pre==='infested' ? .55 : fl.pre==='quiet' ? .2 : .38;
  const rest = free(); const nMon = Math.round(rest.length * share);
  for(let i=0; i<nMon; i++) set(rest[i], 'mon', {m:genMonster(depth, false, monOpts)});
  for(const k of keys) if(fl.rooms[k].t === 'empty') fl.rooms[k].flavor = pick(EMPTY_FLAVOR);
  fl.cur = start; fl.visited[start] = 1;
  return fl;
}

/* ---------- what you can see ---------- */
const charted = (fl, k) => !!(perk('charts') && fl.rooms[k] && fl.rooms[k].t==='stairs');
function shown(fl, k){ return fl.visited[k] || charted(fl, k) || neighbors(fl, k).some(n => fl.visited[n]); }
function typeKnown(fl, k){ return fl.visited[k] || charted(fl, k) || (fl.suf === 'echoes' && shown(fl, k)); }
function pending(rm){ return (rm.t==='mon' && !rm.done) || (rm.t==='trap' && !rm.done); }
function roomArt(rm){
  if(rm.t==='mon') return rm.done ? null : ART[rm.m.base];
  const a = ROOM[rm.t].art; return a ? (a==='entrance' || a==='trap' ? OART2[a] : OART[a]) : null;
}

/* ---------- the map ---------- */
const GRID = 84, TILE = 62;
function mapHtml(){
  const r = R(), fl = r.floor, ks = Object.keys(fl.rooms).filter(k => shown(fl,k));
  const xs = ks.map(k => fl.rooms[k].x), ys = ks.map(k => fl.rooms[k].y);
  const minx = Math.min(...xs), miny = Math.min(...ys), maxx = Math.max(...xs), maxy = Math.max(...ys);
  const pad = 40, W = (maxx-minx)*GRID + TILE + pad*2, H = (maxy-miny)*GRID + TILE + pad*2;
  const pos = rm => [pad + (rm.x-minx)*GRID, pad + (rm.y-miny)*GRID];
  const cur = fl.rooms[fl.cur], locked = pending(cur);
  let lines = '', tiles = '';
  for(const l of fl.links){
    const [a,b] = l.split('|'); if(!fl.visited[a] && !fl.visited[b]) continue;   // you only learn a room's exits by standing in it
    const A = fl.rooms[a], B = fl.rooms[b], [ax,ay] = pos(A), [bx,by] = pos(B);
    const walked = fl.visited[a] && fl.visited[b];
    if(A.y === B.y) lines += `<i class="ln h ${walked?'walked':''}" style="left:${Math.min(ax,bx)+TILE}px;top:${ay+TILE/2-2}px;width:${GRID-TILE}px"></i>`;
    else lines += `<i class="ln v ${walked?'walked':''}" style="left:${ax+TILE/2-2}px;top:${Math.min(ay,by)+TILE}px;height:${GRID-TILE}px"></i>`;
  }
  for(const k of ks){
    const rm = fl.rooms[k], [x,y] = pos(rm), known = typeKnown(fl,k), here = k === fl.cur;
    const adj = neighbors(fl, fl.cur).includes(k);
    const reach = !here && (locked ? k === fl.prev : true);
    const art = known ? roomArt(rm) : null;
    const cls = ['room', here?'here':'', fl.visited[k]?'seen':'unknown', adj && reach ?'adj':'', known && rm.t==='mon' && !rm.done ? 'danger '+(rm.m.rarity||'') : '', known && rm.done && rm.t!=='start' && rm.t!=='stairs' ? 'done' : '', known ? 't-'+rm.t : ''].join(' ');
    const label = known ? (rm.t==='mon' ? (rm.done ? 'Cleared' : `Lv ${rm.m.lvl}`) : rm.t==='empty' ? '' : ROOM[rm.t].name.split(' ')[0]) : '';
    tiles += `<button class="${cls}" style="left:${x}px;top:${y}px" data-act="goRoom" data-arg="${k}" ${reach?'':'aria-disabled="true"'} aria-label="${known ? ROOM[rm.t].name : 'Unexplored room'}">
      ${art ? `<img src="${art}" alt="">` : `<span class="q">${known ? (rm.t==='empty' ? '' : '·') : '?'}</span>`}
      ${label ? `<span class="rl">${label}</span>` : ''}${here ? '<span class="you">YOU</span>' : ''}</button>`;
  }
  return `<div class="mapinner" style="width:${W}px;height:${H}px">${lines}${tiles}</div>`;
}
function centerMap(smooth){

  const left = here.offsetLeft - box.clientWidth/2 + TILE/2, top = here.offsetTop - box.clientHeight/2 + TILE/2;
  if(box.scrollTo) box.scrollTo({left, top, behavior: smooth ? 'smooth' : 'auto'}); else { box.scrollLeft = left; box.scrollTop = top; }
}

/* ---------- the room you're in ---------- */
function roomPanel(){

  if(r.msg){ text = r.msg; }
  switch(rm.t){
    case 'start': text = text || (r.depth===1 ? 'The way back to Emberhold. Tap a connected room on the map to move.' : 'The stairs you came down. Tap a connected room on the map to move.');
      acts = r.depth===1 ? `<button class="btn span2" data-act="toTown">Back to town</button>` : ''; break;
    case 'empty': text = text || rm.flavor; break;
    case 'mon':
      if(rm.done){ title = 'Cleared Room'; text = text || 'Signs of your fight are everywhere.'; art = null; }
      else { title = monNameHtml(rm.m); text = text || `Level ${rm.m.lvl}${rm.m.champion ? ' champion' : ''}. It hasn’t noticed you yet.`;
        acts = `<button class="btn primary" data-act="fightRoom">Fight</button><button class="btn" data-act="retreat">Retreat</button>`; }
      break;
    case 'chest':
      if(rm.done){ title = 'Emptied Room'; text = text || 'An empty, broken chest.'; art = null; }
      else { text = text || 'A heavy chest sits against the wall. It could be trapped.'; acts = `<button class="btn primary span2" data-act="openChest">Open the chest</button>`; }
      break;
    case 'trap':
      if(rm.done){ title = 'Sprung Trap'; text = text || 'The trap has been dealt with.'; }
      else { text = text || `Pressure plates cover the floor. Disarm chance ${Math.round(disarmChance()*100)}%, better with Dexterity and Luck.`; acts = `<button class="btn primary" data-act="disarm">Disarm</button><button class="btn" data-act="dash">Dash through</button>`; }
      break;
    case 'stairs': text = text || 'Stairs lead down into the dark.'; acts = `<button class="btn primary" data-act="descend">Go down</button><button class="btn" data-act="toTown">Back to town</button>`; break;
    case 'shrine': text = text || (rm.used ? 'The shrine has gone dark.' : 'A glowing shrine hums softly.'); if(!rm.used) acts = `<button class="btn primary span2" data-act="pray">Pray at the shrine</button>`; break;
    case 'fire': text = text || (rm.used ? 'Only embers remain.' : 'A campfire crackles. Someone left it burning.'); if(!rm.used) acts = `<button class="btn primary span2" data-act="restFire">Rest by the fire</button>`; break;
    case 'merchant': text = text || '“Everything has a price down here.”'; acts = `<button class="btn primary span2" data-act="trade">Trade</button>`; break;
  }
  if(!acts) acts = `<div class="idle">Tap a connected room to move</div>`;
  const rar = rm.t==='mon' && !rm.done ? 'r-'+rm.m.rarity : '';
  return `<div class="rpanel ${rar}">
      <div class="rart">${art ? `<img src="${art}" alt="">` : ''}</div>
      <div class="rtext"><h3>${title}</h3><p>${text}</p></div>
    </div>

}
function exploreView(){
  return `<div class="dun explore">${floorBar()}

}
function updateExplore(smooth){
  const m = $('#roommap'), p = $('#xpanel');
  if(m){ const sl = m.scrollLeft, st = m.scrollTop; m.innerHTML = mapHtml(); m.scrollLeft = sl; m.scrollTop = st; }

/* ---------- moving between rooms ---------- */
let moving = false;
async function goRoom(k){
  const r = R(); if(moving || !r || r.phase!=='explore') return;
  const fl = r.floor; if(!fl.rooms[k] || k === fl.cur || !shown(fl,k)) return;
  const cur = fl.rooms[fl.cur];
  if(pending(cur) && k !== fl.prev){ toast(cur.t==='mon' ? 'Deal with the monster, or retreat the way you came.' : 'Get past the trap first, or go back the way you came.'); return; }
  // route through rooms you've already made safe
  const {par} = bfsRooms(fl, fl.cur, n => n === k || (fl.visited[n] && !pending(fl.rooms[n])));
  if(!par[k] && !neighbors(fl, fl.cur).includes(k)){ toast('You can’t reach that room from here yet.'); return; }
  const path = []; for(let n = k; n && n !== fl.cur; n = par[n]) path.unshift(n);
  moving = true; r.msg = null;
  for(const step of path){
    if(!fl.visited[step]){ stats().rooms++; runTrack().rooms++; }
    fl.prev = fl.cur; fl.cur = step; fl.visited[step] = 1;
    updateExplore(true);
    await sleep(path.length > 1 ? 160 : 60);
    if(!S.run || S.run.phase!=='explore') break;
  }
  moving = false;
  enterRoom();
}
function enterRoom(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur];
  if(rm.t==='empty' && fl.suf==='ambush' && !rm.ambushed && Math.random() < .25){
    rm.ambushed = true; rm.t = 'mon'; rm.m = genMonster(r.depth, false);
    toast('Something was waiting for you!'); save(); return startEncounter(fl.cur);
  }
  if(rm.t==='mon' && !rm.done){ save(); return startEncounter(fl.cur); }
  save(); updateExplore(true);
}
function retreat(){
  const r = R(), fl = r.floor; if(!fl.prev) return;
  const back = fl.prev; fl.prev = fl.cur; fl.cur = back; r.msg = 'You back away the way you came.';
  save(); updateExplore(true);
}
function disarmChance(){ const hs = heroStats(); return clamp(.35 + (hs.dex-5)*.04 + (hs.lck-5)*.02 + hs.dodge/200, .15, .92); }
function disarm(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], hs = heroStats(); if(rm.t!=='trap' || rm.done) return;
  rm.done = true;
  if(Math.random() < disarmChance()){
    const g = Math.round(rand(4,9)*r.depth); S.hero.gold += g;
    r.msg = `Click. You disarm the trap and pocket ${g} gold from the mechanism.`;
  } else {
    const d = Math.max(1, Math.round(hs.maxhp*.18)); S.hero.hp = Math.max(1, S.hero.hp - d); ouch();
    r.msg = `It goes off in your hands! Darts hit you for ${d}.`;
  }
  save(); updateHud(); updateExplore();
}
function dash(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], hs = heroStats(); if(rm.t!=='trap' || rm.done) return;
  rm.done = true;
  const d = Math.max(1, Math.round(hs.maxhp*(.1 - Math.min(.06, (hs.dex-5)*.006))));
  S.hero.hp = Math.max(1, S.hero.hp - d); ouch();
  r.msg = `You sprint across as darts fly. One grazes you for ${d}.`;
  save(); updateHud(); updateExplore();
}
function openChest(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur], hs = heroStats(); if(rm.t!=='chest' || rm.done) return;
  rm.done = true; stats().chests++;
  if(r.depth >= 3 && Math.random() < .1){
    const m = genMonster(Math.max(r.depth, 6), false); m.base = 'mimic'; m.lvl = r.depth + 1; m.hp = monStats(m).hp;
    toast('The chest grows teeth. It’s a Mimic!');
    return startEncounter(m);
  }
  let trap = null;
  if(Math.random() < .18){
    if(Math.random() < .5){ const d = Math.max(1, Math.round(hs.maxhp*.12)); S.hero.hp = Math.max(1, S.hero.hp - d); trap = `A needle trap! You lose ${d} health.`; }
    else { r.pb.poison = {t:3, d:Math.max(1, Math.round(r.depth*1.5))}; trap = 'A puff of green gas. You’re poisoned.'; }
    ouch();
  }
  const L = r.depth + (fl.pre==='ancient' ? 1 : 0);
  const items = [genItem(L)]; if(Math.random() < .6) items.push(genItem(L)); if(Math.random() < .3) items.push(genItem(L+1));
  const gold = Math.max(1, Math.round(rand(8,16)*r.depth*(1+hs.gold/100)));
  S.hero.gold += gold;
  r.reward = {kind:'chest', xp:0, gold, name:'chest', trap};
  r.loot = items; r.tookAll = false; r.phase = 'loot';
  save(); render(); $('#view').scrollTop = 0;
}
function pray(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], h = S.hero, hs = heroStats(); if(rm.t!=='shrine' || rm.used) return;
  rm.used = true;
  const roll = Math.random();
  if(roll < .45){ h.hp = hs.maxhp; r.msg = 'Warm light washes over you. Health fully restored.'; }
  else if(roll < .7){ const xp = 12*r.depth; gainXp(xp); r.msg = `Visions of the deep fill your mind. You gain ${xp} experience.`; }
  else if(roll < .85){ const it = genItem(r.depth+1); if(roomFor(it)){ addToBag(it); r.msg = `An offering appears on the altar: ${itemName(it)}.`; } else r.msg = 'An offering appears, but your bag is full.'; }
  else { const d = Math.round(hs.maxhp*.1); h.hp = Math.max(1, h.hp - d); r.msg = `The shrine is angry. Cold fire burns you for ${d}.`; ouch(); }
  save(); updateHud(); updateExplore();
}
function restFire(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], h = S.hero, hs = heroStats(); if(rm.t!=='fire' || rm.used) return;
  rm.used = true;
  const v = Math.min(hs.maxhp - h.hp, Math.round(hs.maxhp*.4)); h.hp += v; r.pb = {};
  r.msg = `You rest by the fire and recover ${v} health. Lingering effects fade.`;
  save(); updateHud(); updateExplore();
}
function merchantRoom(){ const r = R(); return r && r.floor && r.floor.rooms ? Object.values(r.floor.rooms).find(x => x.t==='merchant') : null; }
function merchantPrice(it){ return Math.round(itemValue(it)*1.25); }
function merchantSheet(o){

  const rows = o.items.length ? o.items.map(it => itemRow(it, 'merchant', `<button class="btn sm" data-act="mbuy" data-arg="${it.uid}" ${h.gold<merchantPrice(it)||full?'disabled':''}>${priceTag(merchantPrice(it))}</button>`)).join('') : '<p class="empty-note">Sold out.</p>';

function floorInfoSheet(){

  if(fl.suf) lines.push(`<div class="affix"><h4>${FSUF[fl.suf].name}<small>Floor suffix</small></h4><ul><li>${FSUF[fl.suf].desc}</li></ul></div>`);

    <p class="sub" style="margin-top:8px">Find the stairs to go deeper, or explore other rooms for treasure. You won’t know what’s in a room, or where its doors lead, until you step inside.${r.depth%3===0 ? ' A champion guards the stairs on this floor.' : ''}</p>

function newFloor(depth){

/* ============ run flow ============ */
function enterDungeon(){
  closeSheet();
  S.run = {depth:1, mon:null, pg:0, mg:0, log:[], pb:{}, mb:{}, phase:'explore', loot:[], kills:0};
  newFloor(1);
  S.hero.deepest = Math.max(S.hero.deepest, 1);
  stats().runs++; runTrack();
  save(); render(); $('#view').scrollTop = 0;
  toast(`Floor 1: ${floorName(S.run.floor, 1)}`);
}
function startEncounter(src){
  const r = R();
  if(typeof src === 'string'){ r.monKey = src; r.mon = r.floor.rooms[src].m; } else { r.monKey = null; r.mon = src; }
  const champ = !!r.mon.champion;
  r.pg = rand(0,25); r.mg = rand(0,45); r.mb = {}; r.pb.defend = false; r.phase = 'combat'; r.log = [];
  const n = monName(r.mon);
  log(champ ? `A champion blocks the stairs: <b>${n}</b>.` : `${article(n)} <b>${n}</b> appears.`);
  if(monStats(r.mon).ambush || (r.floor && r.floor.pre==='dark')){ r.mg = 100 + rand(1,10); r.pg = rand(0,20); log('It strikes before you can react!'); }
  if(monStats(r.mon).rattle){ r.pb.slow = {t:2}; log('A dry rattle freezes you in place.'); }
  if(monStats(r.mon).snare){ r.pb.slow = {t:2}; log('You step straight into a snare.'); }
  if(monStats(r.mon).stench){ r.pb.weak = {t:3}; log('Its presence makes your arms heavy.'); }
  save(); render(); $('#view').scrollTop = 0;
  advance();
}
async function advance(){
  const r = R(); if(!r || r.phase!=='combat') return;
  busy = true; updateCombatUI();
  for(let g=0; g<2000; g++){
    if(!S.run || S.run.phase!=='combat'){ busy = false; return; }
    if(r.mg >= 100 && r.mg > r.pg){
      await sleep(420);
      if(!S.run || S.run.phase!=='combat'){ busy = false; return; }
      r.mg -= 100; monsterTurn();
      updateCombatUI();
      if(r.phase!=='combat') return;
      continue;
    }
    if(r.pg >= 100){ playerTurnStart(); if(r.phase==='combat'){ busy = false; updateCombatUI(); save(); } return; }
    r.pg += heroSpd()/10; r.mg += monSpd()/10;
  }
  busy = false;
}
function playerTurnStart(){
  const r = R(), pb = r.pb, hs = heroStats(), h = S.hero;
  pb.defend = false;
  if(hs.regen > 0 && h.hp < hs.maxhp){ const v = Math.max(1, Math.round(hs.maxhp*hs.regen/100)); h.hp = Math.min(hs.maxhp, h.hp+v); floatNum('+'+v,'hero','heal'); }
  if(hs.regen < 0 && h.hp > 1){ const v = Math.max(1, Math.round(hs.maxhp*-hs.regen/100)); h.hp = Math.max(1, h.hp-v); floatNum(MINUS+v,'hero'); }
  if(pb.poison){ h.hp -= pb.poison.d; floatNum(MINUS+pb.poison.d,'hero','poison'); log(`Poison burns you for ${pb.poison.d}.`); if(--pb.poison.t <= 0) delete pb.poison; }
  if(pb.burn){ h.hp -= pb.burn.d; floatNum(MINUS+pb.burn.d,'hero','crit'); log(`You burn for ${pb.burn.d}.`); if(--pb.burn.t <= 0) delete pb.burn; }
  for(const k of ['slow','weak','corrode','fort','haste','blind']) if(pb[k] && --pb[k].t <= 0) delete pb[k];
  if(h.hp <= 0) onDeath();
}
function absorb(dmg){
  const r = R();
  if(r.mb.shield){ const a = Math.min(r.mb.shield, dmg); r.mb.shield -= a; dmg -= a; if(r.mb.shield <= 0) delete r.mb.shield; if(a) floatNum(`${a} blocked`,'mon','miss'); }
  return dmg;
}
function endPlayerAction(){
  const r = R(); r.pg -= 100;
  if(S.hero.hp <= 0) return onDeath();
  if(r.mon.hp <= 0) return victory();
  save(); advance();
}
function playerAttack(){
  if(!canAct()) return;
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  if(r.pb.blind && Math.random() < .35){ log('Blinded, you swing at nothing.'); floatNum('Miss','mon','miss'); }
  else if(Math.random()*100 < ms.dodge + (r.mb.camo?40:0)){ log(`You swing, but ${short(m)} dodges.`); floatNum('Miss','mon','miss'); }
  else{
    let dmg = calcDmg(heroAtk(), hs.magic ? 0 : monDef());
    const crit = Math.random()*100 < hs.crit; if(crit) dmg = Math.round(dmg*1.75);
    dmg += hs.fire;
    if(ms.hide) dmg = Math.max(1, Math.round(dmg*ms.hide));
    dmg = absorb(dmg);
    m.hp -= dmg; trackHit(dmg);
    if(dmg>0){ floatNum(dmg,'mon',crit?'crit':''); pulse($('#monWrap'),'hit'); }
    log(crit ? `<b>Critical hit!</b> You strike ${short(m)} for ${dmg}.` : `You hit ${short(m)} for ${dmg}.`);
    if(hs.lifesteal && dmg>0){ const v = Math.max(1, Math.round(dmg*hs.lifesteal/100)); S.hero.hp = Math.min(hs.maxhp, S.hero.hp+v); floatNum('+'+v,'hero','heal'); }
    if(hs.venom) r.mb.poison = {t:3, d:Math.max(1, Math.round(hs.atk*.2))};
    if(ms.thorns && dmg>0){ const t = Math.max(1, Math.round(dmg*ms.thorns/100)); S.hero.hp -= t; floatNum(MINUS+t,'hero'); log(`Thorns cut you for ${t}.`); }
  }
  endPlayerAction();
}
function playerDefend(){
  if(!canAct()) return;
  const r = R(), hs = heroStats();
  r.pb.defend = true;
  const v = Math.max(1, Math.round(hs.maxhp*.05)); S.hero.hp = Math.min(hs.maxhp, S.hero.hp+v); floatNum('+'+v,'hero','heal');
  log('You raise your guard. Damage taken is halved until your next turn.');
  endPlayerAction();
}
function playerFlee(){
  if(!canAct()) return;
  const r = R();
  const chance = Math.min(.8, Math.max(.15, .4 + (heroSpd()-monSpd())/250));
  if(Math.random() < chance){ toast('You escaped. It’s still there.'); r.fled = true; nextStep(); return; }
  log(`You try to flee, but ${short(r.mon)} cuts you off.`);
  endPlayerAction();
}
function monAttack(mult=1, ignoreArmor=false){
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  pulse($('#monWrap'),'lunge');
  if(r.mb.blind && Math.random() < .35){ log(`${cap(short(m))} swings blindly and misses.`); floatNum('Miss','hero','miss'); return 0; }
  if(Math.random()*100 < hs.dodge - ms.acc){ log(`You dodge ${short(m)}.`); floatNum('Dodged','hero','miss'); return 0; }
  if(ms.execute && S.hero.hp < hs.maxhp*.3){ mult *= 2; log(`${cap(short(m))} sees you falter.`); }
  let dmg = calcDmg(ms.atk*mult*(r.mb.rally?1.3:1)*(r.mb.weak?.7:1), (ignoreArmor||ms.magichit) ? 0 : heroDef()*(ms.pierce?.5:1));
  const crit = Math.random()*100 < ms.crit; if(crit) dmg = Math.round(dmg*1.5);
  if(r.pb.defend) dmg = Math.max(1, Math.round(dmg*.5));
  const blocked = Math.random()*100 < hs.block;
  if(blocked) dmg = Math.max(0, Math.round(dmg*.3));
  S.hero.hp -= dmg; trackTaken(dmg); floatNum(blocked ? `Block ${dmg}` : MINUS+dmg,'hero',crit?'crit':(blocked?'miss':'')); if(dmg>0) ouch();
  log(blocked ? `You block ${short(m)}, taking only ${dmg}.` : `${cap(short(m))} ${crit?'<b>crits</b>':'hits'} you for ${dmg}.`);
  if(ms.lifesteal && dmg>0){ const v = Math.max(1, Math.round(dmg*ms.lifesteal/100)); m.hp = Math.min(ms.hp, m.hp+v); floatNum('+'+v,'mon','heal'); }
  if(ms.venom && dmg>0) r.pb.poison = {t:ms.necro?5:3, d:Math.max(1, Math.round(ms.atk*.2*(ms.venom2?2:1)))};
  if(ms.flash && dmg>0 && Math.random() < .5) r.pb.blind = {t:2};
  if(ms.burn && dmg>0) r.pb.burn = {t:3, d:Math.max(1, Math.round(ms.atk*.2))};
  if(ms.hexhit && dmg>0 && Math.random() < .4) r.pb.weak = {t:2};
  if(ms.steal && dmg>0 && S.hero.gold>0){ const g = Math.min(S.hero.gold, 2+m.lvl*2); S.hero.gold -= g; m.stolen = (m.stolen||0)+g; floatNum(`${MINUS}${g} gold`,'hero','miss'); }
  if(ms.chill && dmg>0) r.pb.slow = {t:2};
  if(ms.corrode && dmg>0) r.pb.corrode = {t:3};
  if(hs.thorns && dmg>0){ const t = Math.max(1, Math.round(dmg*hs.thorns/100)); m.hp -= t; floatNum(t,'mon'); }
  return Math.max(dmg, blocked ? 1 : 0);
}
function canUseAbility(id){
  const r = R(), m = r.mon, ms = monStats(m);
  switch(id){
    case 'mend': return m.hp < ms.hp*.6;
    case 'harden': return !r.mb.harden;
    case 'barrier': return !r.mb.shield;
    case 'curse': return !r.pb.weak;
    case 'web': case 'screech': return !r.pb.slow;
    case 'spore_cloud': return !r.pb.poison;
    case 'roar': return !r.pb.weak;
    case 'lickwounds': return m.hp < ms.hp*.6;
    case 'buzz': return !r.pb.slow;
    case 'dust': return !r.pb.blind;
    case 'camouflage': return !r.mb.camo;
    case 'scurry': return !r.mb.camo;
    case 'coil': return !r.mb.harden;
    case 'rally': case 'warcry': return !r.mb.rally;
    case 'shield_wall': return !r.mb.harden;
    case 'dirty_trick': return !r.pb.blind;
    case 'howl': return !r.pb.weak;
    case 'holylight': return !r.pb.blind;
    case 'spit': return !r.pb.blind;
    default: return true;
  }
}
function useAbility(id){
  const r = R(), m = r.mon, ms = monStats(m), A = ABIL[id].name, who = cap(short(m));

function monsterTurn(){
  const r = R(), m = r.mon, ms = monStats(m), mb = r.mb;
  if(ms.regen && m.hp < ms.hp){ const v = Math.max(1, Math.round(ms.hp*ms.regen/100)); m.hp = Math.min(ms.hp, m.hp+v); floatNum('+'+v,'mon','heal'); }
  if(mb.burn){ m.hp -= mb.burn.d; floatNum(mb.burn.d,'mon','crit'); log(`Flames lick at ${short(m)} for ${mb.burn.d}.`); if(--mb.burn.t <= 0) delete mb.burn; }
  if(mb.poison){ m.hp -= mb.poison.d; floatNum(mb.poison.d,'mon','poison'); log(`Poison eats at ${short(m)} for ${mb.poison.d}.`); if(--mb.poison.t <= 0) delete mb.poison; }
  if(m.hp <= 0) return victory();
  let used = false;
  if(m.abilities.length && Math.random() < .32){
    const ok = m.abilities.filter(canUseAbility);
    if(ok.length){ useAbility(pick(ok)); used = true; }
  }
  if(!used){
    if(ms.multi){ monAttack(.5); if(S.hero.hp>0 && m.hp>0) monAttack(.5); if(S.hero.hp>0 && m.hp>0) monAttack(.5); }
    else monAttack(1);
  }
  for(const k of ['harden','slow','camo','rally','weak','blind','sunder']) if(mb[k] && --mb[k].t <= 0) delete mb[k];
  if(S.hero.hp <= 0) return onDeath();
  if(m.hp <= 0) return victory();
}
function victory(){
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  if(r.phase!=='combat') return;
  r.phase = 'loot'; r.kills++;
  const xp = Math.max(1, Math.round(ms.xp*(1+hs.xp/100)));
  const gold = Math.max(1, Math.round(ms.gold*rand(.8,1.25)*(1+hs.gold/100))) + (m.stolen||0);
  if(m.stolen) toast(`You got back the ${m.stolen} gold it stole.`);
  S.hero.gold += gold;
  r.reward = {kind:'kill', xp, gold, name:monName(m), mat:trackKill(m)};
  if(r.monKey && r.floor && r.floor.rooms[r.monKey]){ const rm = r.floor.rooms[r.monKey]; rm.done = true; delete rm.m; r.monKey = null; }
  r.tookAll = false;
  const items = [];
  const ch = .45 + (m.rarity==='magic'?.15:m.rarity==='rare'?.35:0) + (m.champion?.3:0);
  if(Math.random() < ch) items.push(genItem(m.lvl));
  if((m.rarity==='rare'||m.champion) && Math.random() < .55) items.push(genItem(m.lvl+1));
  if(Math.random() < .14) items.push(genItem(m.lvl,'potion'));
  r.loot = items;
  gainXp(xp);
  r.pb = {};
  save();
  updateHud();
  const f = $('#monHpFill');
  if(f){ paintHp(f, 0); $('#monHpTxt').textContent = `0 / ${ms.hp}`; }
  const w = $('#monWrap');
  busy = true;
  setTimeout(()=>{ if(w) w.classList.add('dying'); }, window.__fast ? 0 : 380);
  setTimeout(()=>{ busy = false; render(); }, window.__fast ? 0 : 1100);
}
function gainXp(x){
  const h = S.hero; h.xp += x;
  let need = xpNeed(h.lvl);
  while(h.xp >= need){
    h.xp -= need; h.lvl++; h.points = (h.points||0) + POINTS_PER_LEVEL;
    const hs = heroStats(); h.hp = Math.min(hs.maxhp, h.hp + Math.round(hs.maxhp*.4));
    toast(`Level ${h.lvl}. You have ${h.points} stat points to spend.`);
    need = xpNeed(h.lvl);
  }
}
function onDeath(){
  const r = R(); if(r.phase==='dead') return;

  { const st = stats(); st.deaths++; st.mostLost = Math.max(st.mostLost, r.lostGold); }
  r.lostItems += beltCount(); S.hero.bag = []; S.hero.belt = []; S.hero.gold -= r.lostGold;

}

/* ============ items ============ */
function findIn(list, id){ const i = list.findIndex(x => x.uid===id); return i<0 ? null : {i, it:list[i]}; }
function findItem(id){
  const h = S.hero;
  for(const sl of SLOTS) if(h.equip[sl] && h.equip[sl].uid===id) return h.equip[sl];
  const mer = (merchantRoom() || {}).items || [];
  for(const list of [h.bag, h.belt || [], S.stash, S.shop.items, S.run ? S.run.loot : [], mer]){ const f = findIn(list, id); if(f) return f.it; }
  return null;
}
function useItem(id){
  const h = S.hero, src = findIn(h.bag, id) ? h.bag : (h.belt || []), f = findIn(src, id); if(!f) return;
  const it = f.it, b = IBASE[it.base], s = itemStats(it);
  const inCombat = !!(S.run && S.run.phase==='combat');
  if(inCombat && !canAct()) return;
  if(b.kind==='scroll' && !inCombat && !(s.healp && !s.dmg)){ toast('Only healing scrolls can be read outside a fight.'); return; }
  if(!['potion','scroll'].includes(b.kind)) return;
  if((it.qty||1) > 1) it.qty--; else src.splice(f.i, 1);
  closeSheet();
  const hs = heroStats();
  if(b.kind==='potion'){
    const amt = Math.max(0, Math.min(s.heal, hs.maxhp - h.hp)); h.hp += amt;
    floatNum('+'+amt,'hero','heal');
    const extra = [];
    if(S.run){ const pb = S.run.pb;
      if(s.fort){ pb.fort = {t:3, v:s.fort}; extra.push('Fortified'); }
      if(s.haste){ pb.haste = {t:3, v:s.haste}; extra.push('Hasted'); }
      if(s.cleanse){ delete pb.poison; delete pb.slow; delete pb.weak; delete pb.corrode; delete pb.blind; delete pb.burn; extra.push('Cleansed'); }
    }
    const msg = `You drink the ${itemName(it)} and recover ${amt} health.${extra.length?' '+extra.join(', ')+'.':''}`;
    if(!inCombat){ toast(msg); save(); render(); return; }
    log(msg);
  } else {
    const r = R();
    if(s.escape){ toast('You read the Escape Scroll and slip away.'); r.fled = true; nextStep(); return; }
    readScroll(it, s, inCombat);
    if(!inCombat){ save(); render(); return; }
    if(s.quick){ if(S.hero.hp <= 0) return onDeath(); if(r.mon.hp <= 0) return victory(); updateCombatUI(); save(); return; }
  }
  endPlayerAction();
}
/* Every scroll is a base spell plus whatever its prefix and suffix add. */
function readScroll(it, s, inCombat){
  const r = R(), m = inCombat ? r.mon : null, h = S.hero, hs = heroStats(), L = s.linger || 0, name = itemName(it);
  const out = [];
  if(s.backlash){ const d = Math.max(1, Math.round(hs.maxhp*s.backlash/100)); h.hp = Math.max(1, h.hp - d); floatNum(MINUS+d,'hero'); out.push(`It takes ${d} of your health`); }
  if(s.fizzle && Math.random()*100 < s.fizzle){ log(`The ${name} fizzles into ash.`); if(!inCombat) toast(`The ${name} fizzles into ash.`); return; }
  let total = 0;
  for(let rep=0; rep < (s.echo ? 2 : 1); rep++){
    const mult = rep ? .6 : 1;
    const backfire = s.backfire && Math.random()*100 < s.backfire;
    if(s.dmg && m){
      let d = Math.round(s.dmg*mult*(1+hs.spell/100));
      if(s.holy && MONSTERS[m.base].fam==='undead') d *= 2;
      if(backfire){ const bd = Math.round(d*.5); h.hp = Math.max(1, h.hp - bd); floatNum(MINUS+bd,'hero'); ouch(); out.push(`it backfires for ${bd}`); }
      else { d = absorb(Math.round(d*(monStats(m).hide||1))); m.hp -= d; total += d; trackHit(d); if(d>0){ floatNum(d,'mon','crit'); pulse($('#monWrap'),'hit'); } }
    }
    if(s.healp){ const v = Math.min(hs.maxhp - h.hp, Math.round(hs.maxhp*s.healp/100*mult)); h.hp += v; floatNum('+'+v,'hero','heal'); if(rep===0) out.push(`you heal ${v}`); }
  }
  if(total) out.unshift(`it hits for ${total}`);
  if(m && m.hp > 0){
    const mb = r.mb;
    if(s.slowT){ mb.slow = {t:s.slowT+L}; out.push('it’s slowed'); }
    if(s.burn){ mb.burn = {t:3+L, d:Math.max(1, Math.round((s.dmg||10)*.15 + r.depth))}; out.push('it’s burning'); }
    if(s.venomS){ mb.poison = {t:5+L, d:Math.max(1, Math.round((s.dmg||10)*.25 + r.depth))}; out.push('it’s poisoned'); }
    if(s.weakM){ mb.weak = {t:3+L}; out.push('its attacks weaken'); }
    if(s.blindM){ mb.blind = {t:2+L}; out.push('it’s blinded'); }
    if(s.sunder){ mb.sunder = {t:3+L}; out.push('its armor cracks'); }
  }
  if(s.leech && total){ const v = Math.min(hs.maxhp - h.hp, Math.round(total*s.leech/100)); h.hp += v; if(v) floatNum('+'+v,'hero','heal'); }
  if(S.run && inCombat){
    if(s.ward){ r.pb.fort = {t:4+L, v:s.ward}; out.push(`+${s.ward} armor`); }
    if(s.hasteS){ r.pb.haste = {t:3+L, v:s.hasteS}; out.push(`+${s.hasteS} speed`); }
  }
  const msg = `You read the ${name}${out.length ? ': '+out.join(', ') : ''}.`;
  if(inCombat) log(msg); else toast(msg);
  updateHud();
}
function equipItem(arg){
  const [id, from] = arg.split('|');
  if(S.run && S.run.phase==='combat'){ toast('You can’t change gear mid-fight.'); return; }
  const h = S.hero, list = from==='loot' ? R().loot : h.bag, f = findIn(list, id); if(!f) return;
  const it = f.it, slot = IBASE[it.base].kind; if(!GEAR.has(slot)) return;
  const displaced = [];
  if(h.equip[slot]) displaced.push(h.equip[slot]);
  if(slot==='weapon' && IBASE[it.base].two && h.equip.shield) displaced.push(h.equip.shield);
  if(slot==='shield' && h.equip.weapon && IBASE[h.equip.weapon.base].two) displaced.push(h.equip.weapon);
  const after = h.bag.length - (from==='bag' ? 1 : 0) + displaced.length;
  if(after > bagMax()){ toast('Your bag is full. Sell, drop or equip something to make room.'); openSheet(bagSheet(),'bag'); return; }
  list.splice(f.i, 1);
  for(const d of displaced){ for(const sl of SLOTS) if(h.equip[sl] && h.equip[sl].uid===d.uid) h.equip[sl] = null; }
  h.equip[slot] = it;
  h.bag.push(...displaced);
  h.hp = Math.min(h.hp, heroStats().maxhp);
  toast(`Equipped ${itemName(it)}.`);
  save(); render();
  if(from==='loot'){ if(!R().loot.length) R().tookAll = true; closeSheet(); render(); } else openSheet(bagSheet(),'bag');
}
function unequip(slot){
  const h = S.hero;
  if(S.run && S.run.phase==='combat') return toast('You can’t change gear mid-fight.');
  if(!h.equip[slot]) return; if(h.bag.length >= bagMax()) return toast('Your bag is full.');
  h.bag.push(h.equip[slot]); h.equip[slot] = null;
  h.hp = Math.min(h.hp, heroStats().maxhp);
  save(); render(); openSheet(bagSheet(),'bag');
}
/* Drinking a potion straight off the ground after a fight */
function potionUseful(it){ const s = itemStats(it); return S.hero.hp < heroStats().maxhp || !!s.fort || !!s.haste; }
function drinkLoot(id){
  const r = R(), f = r && findIn(r.loot, id); if(!f) return;

  floorInfo: () => openSheet(floorInfoSheet()),
  mbuy: a => { const o = merchantRoom(); if(!o) return; const f = findIn(o.items, a); if(!f) return; const p = merchantPrice(f.it); if(S.hero.gold < p || !roomFor(f.it)) return; S.hero.gold -= p; o.items.splice(f.i,1); addToBag(f.it); toast(`Bought ${itemName(f.it)}.`); save(); updateHud(); openSheet(merchantSheet(o),'merchant'); },
  toTown: () => { const notes = bankRun(); stats().returns++; goTown(notes.length ? `Home safe. ${notes.slice(0,3).join('. ')}.` : 'You return to Emberhold. Sell your loot at the shop.'); },
  deadToTown: () => { S.hero.hp = Math.round(heroStats().maxhp*.5); goTown(); },
  shopTab: a => { shopTab = a; render(); },
  buy: a => { const f = findIn(S.shop.items, a); if(!f) return; const p = itemValue(f.it); if(S.hero.gold < p || !roomFor(f.it)) return; S.hero.gold -= p; S.shop.items.splice(f.i,1); addToBag(f.it); closeSheet(); toast(`Bought ${itemName(f.it)}.`); save(); render(); },
  buyStaple: a => { const it = mk(a, stapleLvl()); const p = itemValue(it); if(S.hero.gold < p || !roomFor(it)) return; S.hero.gold -= p; addToBag(it); toast(`Bought ${itemName(it)}.`); save(); render(); },
  sell: a => { const list = findIn(S.hero.bag, a) ? S.hero.bag : (S.hero.belt||[]); const f = findIn(list, a); if(!f) return; const p = sellPrice(f.it); S.hero.gold += p; if((f.it.qty||1) > 1) f.it.qty--; else list.splice(f.i,1); closeSheet(); toast(`Sold for ${p} gold.`); save(); render(); },
  sellGear: () => { const gear = S.hero.bag.filter(isGear); const p = gear.reduce((a,it)=>a+sellPrice(it),0); S.hero.bag = S.hero.bag.filter(it => !isGear(it)); S.hero.gold += p; toast(`Sold ${gear.length} item${gear.length===1?'':'s'} for ${p} gold.`); save(); render(); },
  restock: () => { if(S.hero.gold < 15) return; S.hero.gold -= 15; S.shop = genShop(); save(); render(); },
  rest: () => { const c = restCost(); if(S.hero.gold < c) return; S.hero.gold -= c; S.hero.hp = heroStats().maxhp; toast('You sleep soundly. Health fully restored.'); save(); render(); },
  restFree: () => { const mx = heroStats().maxhp; S.hero.hp += Math.ceil((mx - S.hero.hp)/2); toast('The straw is itchy, but you feel better.'); save(); render(); },
  store: a => { const f = findIn(S.hero.bag, a); if(!f) return; S.hero.bag.splice(f.i,1); S.stash.push(f.it); closeSheet(); save(); render(); },
  retrieve: a => { const f = findIn(S.stash, a); if(!f || !roomFor(f.it)) return; S.stash.splice(f.i,1); addToBag(f.it); closeSheet(); save(); render(); },
  resetAsk: () => openSheet(`<div class="grab"></div><h3 class="sheet-title">Start a new character?</h3><p class="lead" style="margin-top:8px">This erases your level, gold, gear and stash.</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Keep playing</button><button class="btn primary" data-act="reset">Start over</button></div>`),
  buyPerk: a => { const p = PERKS[a]; if(!p) return; const l = perk(a); if(l >= p.max) return; const c = perkCost(a), need = perkRep(a);
    if(S.hero.gold < c || ((S.rep||{})[p.b]||0) < need) return;
    S.hero.gold -= c; S.perks = S.perks || {}; S.perks[a] = l+1;
    if(a==='drills') S.hero.points = (S.hero.points||0) + 1;
    if(a==='favor') S.shop = genShop();
    if(a==='pouch' || a==='holster'){ S.hero.belt = S.hero.belt || []; for(const it of S.hero.bag.filter(x => beltTakes(x))){ if(beltCount() + (it.qty||1) <= beltCap()){ S.hero.bag.splice(S.hero.bag.indexOf(it),1); addToBag(it); } } }
    toast(`${p.name} is now level ${l+1}.`); save(); render(); },
  acceptQuest: a => { const [b,id] = a.split('|'); const q = board(b).find(x => x.id===id); if(!q || q.status!=='offered') return; q.status = 'active'; q.have = 0; toast('Quest accepted. Progress counts when you make it back alive.'); save(); render(); if(sheetKind==='notice') openSheet(noticeSheet(),'notice'); },
  dropQuest: a => { const [b,id] = a.split('|'); const qs = board(b), i = qs.findIndex(x => x.id===id); if(i < 0) return; qs[i] = genQuest(b, qs[i].diff); save(); render(); },
  turnIn: a => { const [b,id] = a.split('|'); const qs = board(b), i = qs.findIndex(x => x.id===id), q = qs[i]; if(!q || !questReady(q)) return;
    if(q.kind==='gather') S.mats[q.target] -= q.need;
    const D = DIFF[q.diff]; S.hero.gold += D.gold; S.rep = S.rep || {}; S.rep[b] = (S.rep[b]||0) + D.rep; stats().quests++;
    qs[i] = genQuest(b, q.diff); toast(`Quest complete! +${D.gold} gold and +${D.rep} reputation.`); save(); render(); if(sheetKind==='notice') openSheet(noticeSheet(),'notice'); },
  buyRemedy: a => { const [base,lv,pre,suf] = a.split('|'); const it = mk(base, +lv, pre||null, suf||null), p = itemValue(it);
    if(S.hero.gold < p) return; if(!roomFor(it)) return toast('No room for it.'); S.hero.gold -= p; addToBag(it); toast(`Bought ${itemName(it)}.`); save(); render(); },
  reforge: a => { const [id,w] = a.split('|'); reforge(id, w); },
  townGo: a => townGo(a),
  rumor: () => toast(pick(RUMORS)),
  reset: () => { closeSheet(); newGame(); save(); render(); toast('A new adventurer arrives in Emberhold.'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el.dataset.arg, el);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && sheetOpen()) closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ============ boot ============ */
const hadOldSave = (() => { try{ return !localStorage.getItem(SAVE_KEY) && !!localStorage.getItem('affix-deep-v1'); }catch(e){ return false; } })();
if(!load()) newGame();
render();
if(hadOldSave){ toast('Gear works differently now, so a fresh character starts in Emberhold.'); try{ localStorage.removeItem('affix-deep-v1'); }catch(e){} save(); }
if(S.run && S.run.phase==='combat'){ if(S.run.pg < 100) advance(); }


</script>
</body>
</html>
