const TNAME = {temple:'Temple', gate:'Dungeon Gate', cartographer:'Cartographer', yard:'Training Yard', guild:'Guild Hall', bank:'Bank', shop:'Shop', square:'Fountain', tavern:'Tavern', smithy:'Smithy', notice:'Quest Board', apothecary:'Apothecary'};
const RUMORS = [
  '“Quest work only counts if you make it home alive. The dead don’t get paid.”',
  '“The smith can reroll a bad prefix. Or ruin a good one. Ask me how I know.”',
  '“A champion guards the stairs every third floor down.”',
  '“Chests from floor three on sometimes bite back.”',
  '“Nimble fingers and a little luck get you past traps.”',
  '“Holy scrolls hit the dead twice as hard.”',
  '“A Quickened scroll reads itself before you blink.”',
  '“The Temple pays well for Skeletons. Hundreds of them.”',
  '“Bears down there? Rare. Be glad.”',
  '“Kill the Lightning Bugs first. Trust me.”',
  '“Cutpurses give your gold back if you catch them.”',
  '“Dragons hoard. Gold Dragons hoard triple.”'
];
const pctX = x => (x/TW*100).toFixed(3)+'%', pctY = y => (y/TH*100).toFixed(3)+'%';
const SPR = 96, SPR_OY = 70;                      // building sprites are 96x96, anchored at the lot centre (48,70)
function doorPoint(k){ const p = ISO.pos[k]; return {x:p.door[0], y:p.door[1], k}; }
function heroAt(){ if(!S.townPos || S.townPos.k === undefined) S.townPos = doorPoint('square'); return S.townPos; }
function isoW(x, y){ return {x:(x - y) + ISO.OX, y:(x + y)/2 + ISO.OY}; }
function townView(){
  const h = S.hero, hp = heroAt();
  const order = Object.keys(ISO.pos).sort((a,b) => ISO.pos[a].y - ISO.pos[b].y);
  let html = '';
  for(const [lx,ly] of ISO.lamps) html += `<i class="lampglow" style="left:${pctX(lx)};top:${pctY(ly)}"></i>`;
  for(const k of order){
    if(k === 'garden') continue;
    const p = ISO.pos[k], click = true;
    const badge = (QUEST_GIVERS.includes(k) && anyReady(k)) || (k==='tavern' && S.hobTalk) ? '<span class="tbadge ready">!</span>' : '';
    const A = townArt(k), box = `left:${pctX(p.x-A.ax)};top:${pctY(p.y-A.ay)};width:${pctX(A.w)};height:${pctY(A.h)}`;
    html += `<div class="tb iso ${k==='gate'?'tgate':''}" style="${box}"><img src="${A.src}" alt="">${click?`<span class="tlabel">${TNAME[k]}</span>`:''}${badge}</div>`;
    if(click) html += `<button class="thit" style="${box}" data-act="townGo" data-arg="${k}" aria-label="${TNAME[k]}"></button>`;
    const sm = USER_ART[k] ? null : ISO.smoke[k];
    if(sm) for(let i=0;i<3;i++) html += `<i class="smoke" style="left:${pctX(p.x-48+sm[0])};top:${pctY(p.y-SPR_OY+sm[1])};animation-delay:${i*1.3}s"></i>`;
  }
  { const p = ISO.pos.square; for(let i=0;i<5;i++) html += `<i class="spark" style="left:${pctX(p.x-8+i*4)};top:${pctY(p.y-14+(i%2)*4)};animation-delay:${i*.45}s"></i>`; }
  { const p = ISO.pos.gate; for(let i=0;i<4;i++) html += `<i class="ember" style="left:${pctX(p.x-6+i*4)};top:${pctY(p.y-2)};animation-delay:${i*.7}s"></i>`; }
  return `<div class="dun townmap">
    <div class="floorbar"><span>Emberhold</span><span>${h.deepest ? `Deepest: floor ${h.deepest}` : 'The last lit town'}</span></div>
    <div class="townwrap" id="townmap"><div class="townscene" style="background-image:url(${TOWN_BG})">${html}</div></div>
    <div class="runfoot"><button class="footbtn" data-act="bag">${ICON.bag}<span>Inventory ${h.bag.length}/${bagMax()}</span></button><button class="footbtn" data-act="stats">${ICON.hero}<span>Character${h.points?` <span class="ptsdot">+${h.points}</span>`:''}</span></button></div>
  </div>`;
}
function centerTown(){}
/* Walk the roads: along your street, turn at the corner of the target's block, then up to its door. */
let townMoving = false;
async function townGo(k){
  if(k==='gate') return (S.abyss || waystones(false).length) ? openSheet(gateSheet(), 'gate') : enterDungeon(false);
  if(k==='square') return toast('You sit by the fountain a while. It’s quiet up here.');
  return ACT.go(k);
}
async function townWalkUnused(k){
  if(townMoving) return;
  const from = heroAt(), to = doorPoint(k), el = $('#townHero');
  const A = ISO.pos[from.k] || ISO.pos.square, B = ISO.pos[k];
  const ay = A.wy + 30, by = B.wy + 30;
  const xm = Math.abs((B.wx - 28) - A.wx) < Math.abs((B.wx + 28) - A.wx) ? B.wx - 28 : B.wx + 28;
  const pts = from.k === k ? [] : [isoW(xm, ay), isoW(xm, by)];
  pts.push({x:to.x, y:to.y});
  if(el){
    townMoving = true; el.classList.add('walking');
    let cur = {x:from.x, y:from.y};
    for(const p of pts){
      const d = Math.hypot(p.x-cur.x, p.y-cur.y); if(d < .5){ cur = p; continue; }
      const ms = window.__fast ? 0 : Math.round(d/110*1000);
      if(Math.abs(p.x-cur.x) > .5) el.classList.toggle('flip', p.x < cur.x);
      el.style.transition = `left ${ms}ms linear, top ${ms}ms linear`;
      el.style.left = pctX(p.x-8); el.style.top = pctY(p.y-15);
      await sleep(ms);
      cur = p;
    }
    el.classList.remove('walking'); townMoving = false;
  }
  S.townPos = to;
  if(k==='gate') return (S.abyss || waystones(false).length) ? openSheet(gateSheet(), 'gate') : enterDungeon(false);
  if(k==='square') return toast('You sit by the fountain a while. It’s quiet up here.');
  ACT.go(k);
}
function gateSheet(){

function hobTalk(id, done){
  const lines = HOB_TALKS[id].slice();
  if(id==='another' && stonesPlaced() >= 4) lines.push(['hob', 'Not many holes left now. I’d be lying if I said that didn’t scare me a little.']);
  let i = 0, timer = null, full = '';
  const el = document.createElement('div'); el.className = 'vn'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Big Hob');
  el.innerHTML = `<div class="vnbox"><div class="vnface"><img src="${HOB_GRAVE}" alt=""></div><div class="vnbody"><div class="vnname">Big Hob</div><p class="vntext" aria-live="polite"></p><span class="vnmore">▼</span></div></div>`;
  const txt = el.querySelector('.vntext');
  const finish = () => { clearInterval(timer); timer = null; txt.textContent = full; el.classList.add('ready'); };
  const show = () => {
    const [who, text] = lines[i]; full = text; el.classList.toggle('narr', who==='narr'); el.classList.remove('ready'); txt.textContent = '';
    if(window.__fast) return finish();
    let n = 0; timer = setInterval(() => { n += 1; txt.textContent = full.slice(0, n); if(n >= full.length) finish(); }, 28);
  };
  el.addEventListener('click', () => { if(timer) return finish(); i++; if(i >= lines.length){ el.remove(); if(done) done(); } else show(); });
  document.querySelectorAll('.vn').forEach(x => x.remove());
  document.body.appendChild(el); show();
}

}

const greetNow = {};
function greet(b){ const f = TOWNFOLK[b]; if(!f) return ''; if(!greetNow[b]) greetNow[b] = pick(f.lines); return greetNow[b]; }
function matsHtml(){
  const banked = Object.entries(S.mats||{}).filter(([,c]) => c > 0), pend = S.run && S.run.track ? Object.entries(S.run.track.mats).filter(([,c]) => c > 0) : [];
  if(!banked.length && !pend.length) return '';
  return `<h3 class="section-h">Materials pouch <small class="sub">doesn’t use bag space</small></h3>
    ${banked.length ? `<p class="statline">${banked.map(([m,c]) => `<span>${MATS[m].name} <b>${c}</b></span>`).join('')}</p>` : ''}
    ${pend.length ? `<p class="sub">Carried this run, safe once you’re home:</p><p class="statline pending">${pend.map(([m,c]) => `<span>${MATS[m].name} <b>+${c}</b></span>`).join('')}</p>` : ''}`;
}
function keeperHtml(b, title){
  const f = TOWNFOLK[b];
  return `<div class="keeper"><div class="kface"><img src="${f.art}" alt="${f.name}"></div>
    <div class="kbox"><span class="kname">${f.name}</span><span class="ktitle">${f.title}${title ? ', '+title : ''}</span><p>“${greet(b)}”</p></div></div>`;
}
/* ============ render ============ */
function render(){
  updateHud();
  const v = $('#view');
  if(S.run) v.innerHTML = dungeonView();
  else if(S.screen==='shop') v.innerHTML = shopView();
  else if(S.screen==='tavern') v.innerHTML = tavernView();
  else if(S.screen==='guild') v.innerHTML = guildView();
  else if(S.screen==='cellar') v.innerHTML = cellarView();
  else if(QUEST_GIVERS.includes(S.screen)) v.innerHTML = buildingView(S.screen);
  else v.innerHTML = townView();
  if(S.run && S.run.phase==='combat') updateCombatUI();
  if(S.run && S.run.phase==='explore') centerMap(false);
  if(!S.run && (S.screen==='town' || !S.screen)) centerTown(false);
}
function itemRow(it, ctx, right=''){
  return `<div class="row r-${it.rarity}"><button class="rowmain" data-act="item" data-arg="${it.uid}|${ctx}">
    <span class="ico">${ICON[IBASE[it.base].icon]}</span>
    <span><span class="nm">${itemNameHtml(it)}${it.qty > 1 ? ` <span class="qty">x${it.qty}</span>` : ''}</span><br><span class="sub">Lv ${it.ilvl} ${kindName(it)}, ${itemShort(it)}</span></span></button>${['shopBuy','merchant','shopSell'].includes(ctx) ? '' : worthTag(it)}${right}</div>`;
}
function worthTag(it){ return `<span class="worth" title="Sells for ${sellPrice(it)} gold"><span class="coin"></span>${sellPrice(it)}</span>`; }
function priceTag(n){ return `<span class="price"><span class="coin"></span>${n}</span>`; }
function dollHtml(){
  const h = S.hero, twoH = h.equip.weapon && IBASE[h.equip.weapon.base].two;
  return `<div class="doll">${SLOTS.map(sl => {
    const it = h.equip[sl];

function canAct(){ const r = R(); return !!r && r.phase==='combat' && !busy && r.pg >= 100; }
function statusChips(obj, isHero){
  const out = [];
  if(isHero){
    if(obj.defend) out.push(['Defending','good']);
    if(obj.poison) out.push([`Poisoned ${obj.poison.t}`,'bad']);
    if(obj.slow) out.push([`Slowed ${obj.slow.t}`,'bad']);
    if(obj.weak) out.push([`Cursed ${obj.weak.t}`,'bad']);
    if(obj.corrode) out.push([`Corroded ${obj.corrode.t}`,'bad']);
    if(obj.blind) out.push([`Blinded ${obj.blind.t}`,'bad']);
    if(obj.burn) out.push([`Burning ${obj.burn.t}`,'bad']);
    if(obj.fort) out.push([`Fortified ${obj.fort.t}`,'good']);
    if(obj.haste) out.push([`Hasted ${obj.haste.t}`,'good']);
  } else {
    if(obj.harden) out.push([`Hardened ${obj.harden.t}`,'bad']);
    if(obj.shield) out.push([`Shield ${obj.shield}`,'bad']);
    if(obj.poison) out.push([`Poisoned ${obj.poison.t}`,'good']);
    if(obj.slow) out.push([`Slowed ${obj.slow.t}`,'good']);
    if(obj.camo) out.push([`Hidden ${obj.camo.t}`,'bad']);
    if(obj.burn) out.push([`Burning ${obj.burn.t}`,'good']);
    if(obj.weak) out.push([`Weakened ${obj.weak.t}`,'good']);
    if(obj.blind) out.push([`Blinded ${obj.blind.t}`,'good']);
    if(obj.sunder) out.push([`Sundered ${obj.sunder.t}`,'good']);
    if(obj.rally) out.push([`Rallied ${obj.rally.t}`,'bad']);
  }
  return out.map(([t,c]) => `<span class="chip ${c}">${t}</span>`).join('');
}
function predictOrder(n){
  const r = R(); let p = r.pg, m = r.mg; const ps = heroSpd(), ms = monSpd(); const out = [];
  for(let g=0; g<3000 && out.length<n; g++){
    if(m>=100 && m>p){ out.push('m'); m -= 100; continue; }
    if(p>=100){ out.push('p'); p -= 100; continue; }
    p += ps/10; m += ms/10;
  }
  return out;
}
function updateCombatUI(){
  const r = R(); if(!r || r.phase!=='combat') return;
  // health is always a whole number
  if(r.mon) r.mon.hp = Math.ceil(r.mon.hp); S.hero.hp = Math.ceil(S.hero.hp);
  updateHud();
  const m = r.mon, ms = monStats(m);
  const f = $('#monHpFill'); if(!f) return;

  $('#monStatus').innerHTML = (ms.raging ? '<span class="chip bad">Raging</span>' : '') + statusChips(r.mb, false);
  const st = $('#mstats'); if(st) st.innerHTML = monLiveStats();
  const mw = $('#monWrap'); if(mw) mw.classList.toggle('raging', !!ms.raging);
  $('#heroStatus').innerHTML = statusChips(r.pb, true);
  const mini = `<div class="oc"><img src="${ART[m.base]}" alt=""></div>`;
  $('#order').innerHTML = '<small>Next</small>' + predictOrder(7).map((x,i) => x==='p' ? `<div class="oc p ${i===0?'first':''}">You</div>` : mini.replace('class="oc"', `class="oc ${i===0?'first':''}"`)).join('');
  $('#log').innerHTML = r.log.map(l => `<li>${l}</li>`).join('');
  const ok = canAct();

  const cons = [...(S.hero.belt||[]), ...S.hero.bag.filter(isConsumable)].slice(0,4);
  let q = cons.map(it => `<button class="qs r-${it.rarity}" data-act="use" data-arg="${it.uid}" ${ok?'':'disabled'} aria-label="Use ${itemName(it)}">${ICON[IBASE[it.base].icon]}<span>${quickLabel(it)}</span></button>`).join('');
  for(let i=cons.length;i<4;i++) q += `<button class="qs empty" disabled>Empty</button>`;
  $('#quick').innerHTML = q;
}

/* ============ sheets ============ */
let sheetKind = null;
function openSheet(html, kind=null){ sheetKind = kind; $('#sheet').innerHTML = html; $('#sheet').scrollTop = 0; const w = $('#sheetWrap'); w.classList.add('open'); w.setAttribute('aria-hidden','false'); }
function closeSheet(){ const w = $('#sheetWrap'); w.classList.remove('open'); w.setAttribute('aria-hidden','true'); sheetKind = null; }
const sheetOpen = () => $('#sheetWrap').classList.contains('open');
function refreshSheet(){ if(sheetKind==='bag') openSheet(bagSheet(),'bag'); else if(sheetKind==='loot'){ if(R() && R().loot.length) openSheet(lootSheet(),'loot'); else closeSheet(); } }

function statBox(label, val){ return `<div class="stat"><span>${label}</span><b>${val}</b></div>`; }
/* Compact one-paragraph stat summary for the inventory, so the bag needs less scrolling */
function heroStatLine(hs){
  const h = S.hero, parts = [['Health',`${h.hp}/${hs.maxhp}`],['Damage', hs.atk + (hs.magic?'*':'')],['Armor',hs.def],['Speed',hs.spd],['Crit',hs.crit+'%'],['Dodge',hs.dodge+'%']];
  for(const [k,l,u] of [['block','Block','%'],['lifesteal','Leech','%'],['thorns','Reflect','%'],['regen','Regen','%'],['fire','Fire','+'],['spell','Spell','%'],['gold','Gold find','%'],['xp','Exp','%']]) if(hs[k]) parts.push([l, u==='+' ? '+'+hs[k] : hs[k]+'%']);
  return `<p class="statline" data-act="stats" role="button" aria-label="Open character stats">${parts.map(([l,v]) => `<span>${l} <b>${v}</b></span>`).join('')}</p>${hs.magic?'<p class="sub">* Your staff hits with spell power and ignores armor.</p>':''}`;
}
function heroStatGrid(hs){
  const h = S.hero;
  const rows = [statBox('Health',`${h.hp}/${hs.maxhp}`), statBox('Damage', hs.atk + (hs.magic?'*':'')), statBox('Armor',hs.def), statBox('Speed',hs.spd), statBox('Critical',hs.crit+'%'), statBox('Dodge',hs.dodge+'%')];
  const extra = [['block','Block','%'],['lifesteal','Life steal','%'],['thorns','Reflect','%'],['regen','Regen','%'],['fire','Fire','+'],['spell','Spell','%'],['gold','Gold find','%'],['xp','Exp bonus','%']];
  for(const [k,l,u] of extra) if(hs[k]) rows.push(statBox(l, u==='+' ? '+'+hs[k] : hs[k]+'%'));
  return `<div class="statgrid">${rows.join('')}</div>${hs.magic?'<p class="sub">* Your staff hits with spell power and ignores armor.</p>':''}`;
}
function bagSheet(){

/* A simple score for the ▲ hint: how much your key stats would change. */
function upgradeScore(it){
  if(!isGear(it)) return 0;
  const slot = IBASE[it.base].kind, a = heroStats(), b = heroStatsWith(slot, it);
  return (b.atk-a.atk)*3 + (b.def-a.def)*2.5 + (b.maxhp-a.maxhp)*.5 + (b.spd-a.spd)*.4 + (b.crit-a.crit)*.8 + (b.dodge-a.dodge)*.8 + (b.block-a.block)*.7 + (b.lifesteal-a.lifesteal) + (b.regen-a.regen)*3 + (b.fire-a.fire)*2 + (b.spell-a.spell)*(a.magic||b.magic?.4:.1) + (b.thorns-a.thorns)*.3 + (b.gold-a.gold)*.1 + (b.xp-a.xp)*.1;
}
function upgradeMark(it){ return upgradeScore(it) > 1 ? '<span class="upmark" aria-label="Likely upgrade">▲</span>' : ''; }

function itemCard(it, title){
  if(!it) return `<div class="card cur"><div class="k">${title}</div><p class="cn sub">Nothing equipped</p></div>`;
  const b = IBASE[it.base], s = baseStats(it), fin = itemStats(it);
  const base = [];
  const order = [['atk','Damage'],['def','Armor'],['block','Block'],['spd','Speed'],['crit','Critical'],['dodge','Dodge'],['spell','Spell power'],['maxhp','Max health'],['gold','Gold found'],['regen','Regen'],['heal','Heals'],['dmg','Damage']];
  if(b.kind==='scroll'){
    if(fin.dmg) base.push(`<li>Damage ${fin.dmg}, ignores armor</li>`);
    if(s.healp) base.push(`<li>Heals ${fin.healp}% of your health</li>`);
    if(s.ward) base.push(`<li>+${fin.ward} armor for 4 turns</li>`);
    if(s.hasteS) base.push(`<li>+${fin.hasteS} speed for 3 turns</li>`);
    if(s.slowT) base.push(`<li>Slows the target ${fin.slowT} turns</li>`);
    if(s.leech) base.push(`<li>Heals you ${fin.leech}% of the damage</li>`);
    for(const f of ['burn','venomS','weakM','sunder','holy']) if(s[f]) base.push(`<li>${IFLAG[f]}</li>`);
  } else for(const [k,l] of order) if(fin[k] !== undefined && (s[k] !== undefined)) base.push(`<li>${l} ${k==='spd'?sgn(fin[k]):fin[k]}${PCT.has(k)?'%':''}</li>`);
  if(fin.escape) base.push('<li>Escape any fight</li>');

    case 'chest':
      if(rm.done){ title = 'Emptied Room'; text = text || 'An empty, broken chest.'; art = null; }
      else { text = text || 'A heavy chest sits against the wall. It could be trapped.'; acts = `<button class="btn primary span2" data-act="openChest">Open the chest</button>`; }
      break;
    case 'trap':
      if(rm.done){ title = 'Sprung Trap'; text = text || 'The trap has been dealt with.'; }
      else { text = text || `Pressure plates cover the floor. Disarm chance ${Math.round(disarmChance()*100)}%, better with Dexterity and Luck.`; acts = `<button class="btn primary" data-act="disarm">Disarm</button><button class="btn" data-act="dash">Dash through</button>`; }
      break;
    case 'stairs': text = text || 'Stairs lead down into the dark.'; acts = `<button class="btn primary" data-act="descend">Go down</button><button class="btn" data-act="toTown">Back to town</button>`; break;
    case 'shrine': text = text || (rm.used ? 'The shrine has gone dark.' : 'A glowing shrine hums softly.'); if(!rm.used) acts = `<button class="btn primary span2" data-act="pray">Pray at the shrine</button>`; break;
    case 'fire': text = text || (rm.used ? 'Only embers remain.' : 'A campfire crackles. Someone left it burning.'); if(!rm.used) acts = `<button class="btn primary span2" data-act="restFire">Rest by the fire</button>`; break;
    case 'merchant': text = text || '“Everything has a price down here.”'; acts = `<button class="btn primary span2" data-act="trade">Trade</button>`; break;
    case 'vault':
      title = 'Locked Vault';
      if(rm.done){ title = 'Emptied Vault'; text = text || 'Bare shelves and a broken lock.'; }
      else if(fl.hasKey){ text = text || 'The key fits. Something valuable waits inside.'; acts = `<button class="btn primary span2" data-act="openVault">Unlock the vault</button>`; }
      else text = text || 'A sealed iron door. One of the monsters on this floor carries the key.';
      break;
    case 'idol': {
      const B = BOONS[rm.boon]; title = 'Cursed Idol';
      if(rm.done){ text = text || 'The idol’s eyes have gone dark.'; }
      else { text = text || `It offers <b>${B.name}</b>: <span class="up">${B.good}</span>, but <span class="down">${B.bad}</span>. Lasts the rest of this run.`;
        acts = `<button class="btn primary" data-act="idolYes">Accept the bargain</button><button class="btn" data-act="idolSmash">Smash it</button>`; }
      break; }
    case 'armory':
      title = 'Armory Rack';
      if(rm.done){ text = text || 'An empty weapon rack.'; }
      else { text = text || 'Three pieces of gear hang on the rack. You can carry off one.'; acts = `<button class="btn primary span2" data-act="armoryOpen">Choose one</button>`; }
      break;
    case 'crevice':
      title = 'Glimmering Crevice';
      if(rm.done){ text = text || 'An empty crack in the stone. Something old was here.'; }
      else { text = text || 'Something glows deep in a crack in the wall. It’s older than the dungeon around it.'; acts = `<button class="btn primary span2" data-act="pryStone">Pry it loose</button>`; }
      break;
    case 'harvest':
      title = HARVEST_NAME[rm.mat] || 'Harvest';
      if(rm.done){ text = text || 'Picked clean.'; }
      else { text = text || `Your quest needs ${MATS[rm.mat].name}. Searching here could turn up several, if nothing wakes up.`; acts = `<button class="btn primary span2" data-act="harvest">Search it</button>`; }
      break;
  }
  if(!acts) acts = `<div class="idle">Tap a connected room to move</div>`;
  const rar = rm.t==='mon' && !rm.done ? 'r-'+rm.m.rarity : '';
  return `<div class="rpanel ${rar}">
      <div class="rart">${art ? `<img src="${art}" alt="">` : ''}</div>
      <div class="rtext"><h3>${title}</h3><p>${text}</p></div>
    </div>
    <div class="ctx">${acts}</div>`;
}
function exploreView(){

}
function updateExplore(smooth){

/* ---------- moving between rooms ---------- */
let moving = false;
async function goRoom(k){
  const r = R(); if(moving || !r || r.phase!=='explore') return;
  const fl = r.floor; if(!fl.rooms[k] || k === fl.cur || !shown(fl,k)) return;
  const cur = fl.rooms[fl.cur];
  if(pending(cur) && k !== fl.prev){ toast(cur.t==='mon' ? 'Deal with the monster, or retreat the way you came.' : 'Get past the trap first, or go back the way you came.'); return; }
  // route through rooms you've already made safe
  const {par} = bfsRooms(fl, fl.cur, n => n === k || (fl.visited[n] && !pending(fl.rooms[n])));
  if(!par[k] && !neighbors(fl, fl.cur).includes(k)){ toast('You can’t reach that room from here yet.'); return; }
  const path = []; for(let n = k; n && n !== fl.cur; n = par[n]) path.unshift(n);
  moving = true; r.msg = null;
  for(const step of path){
    if(!fl.visited[step]){ stats().rooms++; runTrack().rooms++; }
    fl.prev = fl.cur; fl.cur = step; fl.visited[step] = 1;
    updateExplore(true);
    await sleep(path.length > 1 ? 160 : 60);
    if(!S.run || S.run.phase!=='explore') break;
  }
  moving = false;
  enterRoom();
}
function enterRoom(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur];
  if(rm.t==='empty' && fl.suf==='ambush' && !rm.ambushed && Math.random() < .25){
    rm.ambushed = true; rm.t = 'mon'; rm.m = genMonster(r.depth, false);
    toast('Something was waiting for you!'); save(); return startEncounter(fl.cur);
  }
  if(rm.t==='mon' && !rm.done){ save(); return startEncounter(fl.cur); }
  save(); updateExplore(true);
}
function retreat(){
  const r = R(), fl = r.floor; if(!fl.prev) return;
  const back = fl.prev; fl.prev = fl.cur; fl.cur = back; r.msg = 'You back away the way you came.';
  save(); updateExplore(true);
}
function disarmChance(){ const hs = heroStats(); return clamp(.35 + (hs.dex-5)*.04 + (hs.lck-5)*.02 + hs.dodge/200, .15, .92); }
function disarm(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], hs = heroStats(); if(rm.t!=='trap' || rm.done) return;
  rm.done = true;
  if(Math.random() < disarmChance()){
    const g = Math.round(rand(4,9)*r.depth); S.hero.gold += g;
    r.msg = `Click. You disarm the trap and pocket ${g} gold from the mechanism.`;
  } else {
    const d = Math.max(1, Math.round(hs.maxhp*.18)); S.hero.hp = Math.max(1, S.hero.hp - d); ouch();
    r.msg = `It goes off in your hands! Darts hit you for ${d}.`;
  }
  save(); updateHud(); updateExplore();
}
function dash(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], hs = heroStats(); if(rm.t!=='trap' || rm.done) return;
  rm.done = true;
  const d = Math.max(1, Math.round(hs.maxhp*(.1 - Math.min(.06, (hs.dex-5)*.006))));
  S.hero.hp = Math.max(1, S.hero.hp - d); ouch();
  r.msg = `You sprint across as darts fly. One grazes you for ${d}.`;
  save(); updateHud(); updateExplore();
}
function openChest(){
  const r = R(), fl = r.floor, rm = fl.rooms[fl.cur], hs = heroStats(); if(rm.t!=='chest' || rm.done) return;
  rm.done = true; stats().chests++;
  if(r.depth >= 3 && Math.random() < .1){
    const m = genMonster(Math.max(r.depth, 6), false); m.base = 'mimic'; m.lvl = r.depth + 1; m.hp = monStats(m).hp;
    toast('The chest grows teeth. It’s a Mimic!');
    return startEncounter(m);
  }
  let trap = null;
  if(Math.random() < .18){
    if(Math.random() < .5){ const d = Math.max(1, Math.round(hs.maxhp*.12)); S.hero.hp = Math.max(1, S.hero.hp - d); trap = `A needle trap! You lose ${d} health.`; }
    else { r.pb.poison = {t:3, d:Math.max(1, Math.round(r.depth*1.5))}; trap = 'A puff of green gas. You’re poisoned.'; }
    ouch();
  }
  const L = r.depth + (fl.pre==='ancient' ? 1 : 0);
  const items = [genItem(L)]; if(Math.random() < .6) items.push(genItem(L)); if(Math.random() < .3) items.push(genItem(L+1));
  const gold = Math.max(1, Math.round(rand(8,16)*r.depth*(1+hs.gold/100)));
  S.hero.gold += gold;
  r.reward = {kind:'chest', xp:0, gold, name:'chest', trap};
  r.loot = items; r.tookAll = false; r.phase = 'loot';
  save(); render(); $('#view').scrollTop = 0;
}
function pray(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], h = S.hero, hs = heroStats(); if(rm.t!=='shrine' || rm.used) return;
  rm.used = true;
  const roll = Math.random();
  if(roll < .45){ h.hp = hs.maxhp; r.msg = 'Warm light washes over you. Health fully restored.'; }
  else if(roll < .7){ const xp = 12*r.depth; gainXp(xp); r.msg = `Visions of the deep fill your mind. You gain ${xp} experience.`; }
  else if(roll < .85){ const it = genItem(r.depth+1); if(roomFor(it)){ addToBag(it); r.msg = `An offering appears on the altar: ${itemName(it)}.`; } else r.msg = 'An offering appears, but your bag is full.'; }
  else { const d = Math.round(hs.maxhp*.1); h.hp = Math.max(1, h.hp - d); r.msg = `The shrine is angry. Cold fire burns you for ${d}.`; ouch(); }
  save(); updateHud(); updateExplore();
}
function restFire(){
  const r = R(), rm = r.floor.rooms[r.floor.cur], h = S.hero, hs = heroStats(); if(rm.t!=='fire' || rm.used) return;
  rm.used = true;
  const v = Math.min(hs.maxhp - h.hp, Math.round(hs.maxhp*.4)); h.hp += v; r.pb = {};

function merchantRoom(){ const r = R(); return r && r.floor && r.floor.rooms ? Object.values(r.floor.rooms).find(x => x.t==='merchant') : null; }
function merchantPrice(it){ return Math.round(itemValue(it)*1.25); }
function merchantSheet(o){

function floorInfoSheet(){

    <p class="sub" style="margin-top:8px">Find the stairs to go deeper, or explore other rooms for treasure. You won’t know what’s in a room, or where its doors lead, until you step inside.${(r.depth%3===0 || doomFloor(r.depth)) ? ' A champion guards the stairs on this floor.' : ''}</p>

function newFloor(depth){
  const r = R();

  r.phase = 'explore'; r.msg = null; r.loot = [];
}

/* ============ run flow ============ */
/* A big card when you arrive on a floor: what it is and what's waiting. Stays until you tap. */
function floorIntro(){
  const r = R(); if(!r || !r.floor) return;
  const fl = r.floor, d = r.depth, notes = [];
  if(fl.doom) notes.push(['doom', FDOOM[fl.doom].name, FDOOM[fl.doom].desc]);
  if(fl.doom2) notes.push(['doom', FDOOM[fl.doom2].name, FDOOM[fl.doom2].desc]);
  if(fl.doom) notes.push(['doom', 'Doom floor', 'Every monster here is two levels higher, and a champion guards the stairs.']);
  if(fl.pre) notes.push(['afx', FPRE[fl.pre].name, FPRE[fl.pre].desc]);
  if(fl.suf) notes.push(['afx', FSUF[fl.suf].name, FSUF[fl.suf].desc]);
  for(const b of (r.boons||[])) notes.push(['boon', BOONS[b].name, `${cap(BOONS[b].good)}, but ${BOONS[b].bad}.`]);
  if(d % 3 === 0 || doomFloor(d)) notes.push(['warn', 'Champion', 'A champion guards the stairs on this floor.']);
  if(d >= 20 && S.wallFound && stoneToFind()) notes.push(['stone', 'Old stones', 'Somewhere this deep, a stone from the Old Wall could be hiding.']);
  if(!fl.pre && !fl.suf && !fl.doom) notes.push(['plain', 'No modifiers', 'An ordinary floor. Find the stairs, or explore for treasure.']);
  const el = document.createElement('div');
  el.className = 'floorpop' + (fl.doom ? ' doomed' : '') + (r.abyss ? ' abyssal' : '');
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', `Floor ${d}`);
  el.innerHTML = `<div class="fpcard">
    <div class="fpkicker">${r.abyss ? 'The Abyss · ' : ''}Floor</div>
    <div class="fpnum">${d}</div>
    <div class="fpname">${floorName(fl, d)}</div>
    <ul class="fpnotes">${notes.map(([c,t,x]) => `<li class="${c}"><b>${t}</b><span>${x}</span></li>`).join('')}</ul>
    <div class="fptap">Tap anywhere to begin</div></div>`;
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 180); };
  el.addEventListener('click', close);
  document.querySelectorAll('.floorpop').forEach(x => x.remove());
  document.body.appendChild(el);
}
/* Waystones: reach a floor that's a multiple of 10 and make it home alive, and you can start runs there for a toll. */
const wayToll = (d, abyss) => 2*d*d*(abyss ? 3 : 1);
function waystones(abyss){ S.ways = S.ways || {depths:[], abyss:[]}; return S.ways[abyss ? 'abyss' : 'depths']; }
function enterDungeon(abyss, start){
  closeSheet();
  abyss = !!(abyss && S.abyss); start = start || 1;
  if(start > 1){ const t = wayToll(start, abyss); if(!waystones(abyss).includes(start) || S.hero.gold < t) return; S.hero.gold -= t; }
  S.run = {depth:start, mon:null, pg:0, mg:0, log:[], pb:{}, mb:{}, phase:'explore', loot:[], kills:0, abyss};
  rollRunAffixes(S.run);
  newFloor(start);
  S.hero.deepest = Math.max(S.hero.deepest, start);
  stats().runs++; runTrack().deepest = start;
  if(start > 1) toast(`You pay the toll and step through the Waystone to floor ${start}.`);
  save(); render(); $('#view').scrollTop = 0;
  floorIntro();
}
function startEncounter(src){
  const r = R();
  if(typeof src === 'string'){ r.monKey = src; r.mon = r.floor.rooms[src].m; } else { r.monKey = null; r.mon = src; }
  const champ = !!r.mon.champion;
  r.pg = rand(0,25); r.mg = rand(0,45); r.mb = {}; r.pb.defend = false; r.phase = 'combat'; r.log = [];
  const n = monName(r.mon);
  log(champ ? `A champion blocks the stairs: <b>${n}</b>.` : `${article(n)} <b>${n}</b> appears.`);
  if(monStats(r.mon).ambush || (r.floor && (r.floor.pre==='dark' || hasDoom(r.floor,'lightless')))){ r.mg = 100 + rand(1,10); r.pg = rand(0,20); log('It strikes before you can react!'); }
  if(monStats(r.mon).rattle){ r.pb.slow = {t:2}; log('A dry rattle freezes you in place.'); }
  if(monStats(r.mon).snare){ r.pb.slow = {t:2}; log('You step straight into a snare.'); }
  if(monStats(r.mon).stench){ r.pb.weak = {t:3}; log('Its presence makes your arms heavy.'); }
  save(); render(); $('#view').scrollTop = 0;
  advance();
}
async function advance(){
  const r = R(); if(!r || r.phase!=='combat') return;
  busy = true; updateCombatUI();
  for(let g=0; g<2000; g++){
    if(!S.run || S.run.phase!=='combat'){ busy = false; return; }
    if(r.mg >= 100 && r.mg > r.pg){
      await sleep(420);
      if(!S.run || S.run.phase!=='combat'){ busy = false; return; }
      r.mg -= 100; monsterTurn();
      updateCombatUI();
      if(r.phase!=='combat') return;
      continue;
    }
    if(r.pg >= 100){ playerTurnStart(); if(r.phase==='combat'){ busy = false; updateCombatUI(); save(); } return; }
    r.pg += heroSpd()/10; r.mg += monSpd()/10;
  }
  busy = false;
}
function playerTurnStart(){
  const r = R(), pb = r.pb, hs = heroStats(), h = S.hero;
  pb.defend = false;
  if(hs.regen > 0 && h.hp < hs.maxhp){ const v = Math.max(1, Math.round(hs.maxhp*hs.regen/100)); h.hp = Math.min(hs.maxhp, h.hp+v); floatNum('+'+v,'hero','heal'); }
  if(hs.regen < 0 && h.hp > 1){ const v = Math.max(1, Math.round(hs.maxhp*-hs.regen/100)); h.hp = Math.max(1, h.hp-v); floatNum(MINUS+v,'hero'); }
  if(pb.poison){ h.hp -= pb.poison.d; floatNum(MINUS+pb.poison.d,'hero','poison'); log(`Poison burns you for ${pb.poison.d}.`); if(--pb.poison.t <= 0) delete pb.poison; }
  if(pb.burn){ h.hp -= pb.burn.d; floatNum(MINUS+pb.burn.d,'hero','crit'); log(`You burn for ${pb.burn.d}.`); if(--pb.burn.t <= 0) delete pb.burn; }
  for(const k of ['slow','weak','corrode','fort','haste','blind']) if(pb[k] && --pb[k].t <= 0) delete pb[k];
  if(h.hp <= 0) onDeath();
}
function absorb(dmg){
  const r = R();
  if(r.mb.shield){ const a = Math.ceil(Math.min(r.mb.shield, dmg)); r.mb.shield -= a; dmg -= a; if(r.mb.shield <= 0) delete r.mb.shield; if(a) floatNum(`${a} blocked`,'mon','miss'); }
  return Math.max(0, Math.ceil(dmg));
}
function endPlayerAction(){
  const r = R(); r.pg -= 100;
  if(S.hero.hp <= 0) return onDeath();
  if(r.mon.hp <= 0) return victory();
  save(); advance();
}
function playerAttack(){
  if(!canAct()) return;
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  if(r.pb.blind && Math.random() < .35){ log('Blinded, you swing at nothing.'); floatNum('Miss','mon','miss'); }
  else if(Math.random()*100 < ms.dodge + (r.mb.camo?40:0)){ log(`You swing, but ${short(m)} dodges.`); floatNum('Miss','mon','miss'); }
  else{
    let dmg = calcDmg(heroAtk(), hs.magic ? 0 : monDef());
    const crit = Math.random()*100 < hs.crit; if(crit) dmg = Math.round(dmg*1.75);
    dmg = Math.ceil((dmg + hs.fire) * (1 + mastery(m.base).dmg/100));
    if(ms.hide) dmg = Math.max(1, Math.round(dmg*ms.hide));
    dmg = absorb(dmg);
    m.hp -= dmg; trackHit(dmg);
    if(dmg>0){ floatNum(dmg,'mon',crit?'crit':''); pulse($('#monWrap'),'hit'); }
    log(crit ? `<b>Critical hit!</b> You strike ${short(m)} for ${dmg}.` : `You hit ${short(m)} for ${dmg}.`);
    if(hs.lifesteal && dmg>0){ const v = Math.max(1, Math.round(dmg*hs.lifesteal/100)); S.hero.hp = Math.min(hs.maxhp, S.hero.hp+v); floatNum('+'+v,'hero','heal'); }
    if(hs.venom) r.mb.poison = {t:3, d:Math.max(1, Math.round(hs.atk*.2))};
    if(ms.thorns && dmg>0){ const t = Math.max(1, Math.floor(dmg*ms.thorns/100)); S.hero.hp -= t; floatNum(MINUS+t,'hero'); log(`Thorns cut you for ${t}.`); }
  }
  endPlayerAction();
}
function playerDefend(){
  if(!canAct()) return;
  const r = R(), hs = heroStats();
  r.pb.defend = true;
  const v = Math.max(1, Math.round(hs.maxhp*.05)); S.hero.hp = Math.min(hs.maxhp, S.hero.hp+v); floatNum('+'+v,'hero','heal');
  log('You raise your guard. Damage taken is halved until your next turn.');
  endPlayerAction();
}
function playerFlee(){
  if(!canAct()) return;
  const r = R();
  const chance = Math.min(.8, Math.max(.15, .4 + (heroSpd()-monSpd())/250));
  if(Math.random() < chance){ toast('You escaped. It’s still there.'); r.fled = true; nextStep(); return; }
  log(`You try to flee, but ${short(r.mon)} cuts you off.`);
  endPlayerAction();
}
function monAttack(mult=1, ignoreArmor=false){
  const r = R(), m = r.mon, ms = monStats(m), hs = heroStats();
  pulse($('#monWrap'),'lunge');
  if(r.mb.blind && Math.random() < .35){ log(`${cap(short(m))} swings blindly and misses.`); floatNum('Miss','hero','miss'); return 0; }
  if(Math.random()*100 < hs.dodge - ms.acc){ log(`You dodge ${short(m)}.`); floatNum('Dodged','hero','miss'); return 0; }
  if(ms.execute && S.hero.hp < hs.maxhp*.3){ mult *= 2; log(`${cap(short(m))} sees you falter.`); }
  const taken = (hasBoon('bloodpact') ? 1.15 : 1) * (hasBoon('leech') ? 1.1 : 1) * (1 - mastery(m.base).guard/100);
  let dmg = calcDmgDown(ms.atk*mult*(r.mb.rally?1.3:1)*(r.mb.weak?.7:1)*taken, (ignoreArmor||ms.magichit) ? 0 : heroDef()*(ms.pierce?.5:1));
  const crit = Math.random()*100 < ms.crit; if(crit) dmg = Math.floor(dmg*1.5);

    if(s.venomS){ mb.poison = {t:5+L, d:Math.max(1, Math.round((s.dmg||10)*.25 + r.depth))}; out.push('it’s poisoned'); }
    if(s.weakM){ mb.weak = {t:3+L}; out.push('its attacks weaken'); }

  save(); render();
  if(!r.loot.length) r.tookAll = true;
  closeSheet(); render();
}

/* ============ actions ============ */
const ACT = {
  go: a => { if(a !== S.screen && (TOWNFOLK[a] || a==='cellar')) delete greetNow[a]; if(a==='cellar' && !S.wallFound) a = 'tavern'; S.screen = a; if(a==='shop') shopTab = 'buy'; save(); render(); $('#view').scrollTop = 0; if(a==='tavern') setTimeout(maybeHobTalk, 250); },
  enter: () => enterDungeon(),
  attack: () => playerAttack(),
  defend: () => playerDefend(),
  flee: () => playerFlee(),
  use: a => useItem(a),
  bag: () => openSheet(bagSheet(),'bag'),
  stats: () => openSheet(statsSheet(),'stats'),
  statOpen: a => { openStats.has(a) ? openStats.delete(a) : openStats.add(a); rerenderStats(); },
  raise: a => { const h = S.hero; if(!h.points || !ATTR_KEYS.includes(a)) return; const before = heroStats().maxhp; h.attr[a]++; h.points--; const after = heroStats().maxhp; if(after > before) h.hp += after - before; save(); updateHud(); if(S.run && S.run.phase==='combat') updateCombatUI(); else render(); rerenderStats(); },
  respec: () => { const h = S.hero, c = respecCost(); if(S.run || h.gold < c) return; let n = 0; for(const k of ATTR_KEYS){ n += h.attr[k]; h.attr[k] = 0; } h.points += n; h.gold -= c; h.hp = Math.min(h.hp, heroStats().maxhp); toast(`${n} points returned. Spend them however you like.`); save(); render(); rerenderStats(); },
  lootSheet: () => { if(R() && R().loot.length) openSheet(lootSheet(),'loot'); else closeSheet(); },
  closeSheet: () => closeSheet(),
  monDetail: () => { if(S.run && S.run.mon) openSheet(monSheet(S.run.mon)); },
  item: a => { const [id, ctx] = a.split('|'); const it = findItem(id); if(it) openSheet(itemSheet(it, ctx), 'item'); },
  equip: a => equipItem(a),
  unequip: a => unequip(a),
  drop: a => { const list = findIn(S.hero.bag, a) ? S.hero.bag : (S.hero.belt||[]); const f = findIn(list, a); if(!f) return; list.splice(f.i,1); toast(`Dropped ${itemName(f.it)}.`); save(); render(); openSheet(bagSheet(),'bag'); },
  take: a => takeLoot(a),
  drinkLoot: a => drinkLoot(a),
  takeAll: () => { const r = R(); if(!r.loot.some(roomFor)){ toast('Your bag is full. Sell, drop or equip something to make room.'); openSheet(bagSheet(),'bag'); return; } let n = 0; for(const it of r.loot.slice()){ if(roomFor(it)){ r.loot.splice(r.loot.indexOf(it),1); addToBag(it); n++; } } if(!r.loot.length) r.tookAll = true; save(); closeSheet(); render(); if(r.loot.length){ toast(`Took ${n}. Your bag is full now.`); openSheet(bagSheet(),'bag'); } else toast(`Took ${n} item${n===1?'':'s'}.`); },
  next: () => nextStep(),
  descend: () => { const r = R(); if(moving) return; closeSheet(); r.depth++; S.hero.deepest = Math.max(S.hero.deepest, r.depth);
    const hs = heroStats(), v = Math.min(hs.maxhp - S.hero.hp, Math.round(hs.maxhp*.1)); S.hero.hp += v;
    runTrack().deepest = Math.max(runTrack().deepest, r.depth);
    newFloor(r.depth); save(); render(); $('#view').scrollTop = 0; floorIntro(); },
  goRoom: a => goRoom(a),
  fightRoom: () => { const r = R(); if(r && r.floor.rooms[r.floor.cur].t==='mon') startEncounter(r.floor.cur); },
  retreat: () => retreat(),
  disarm: () => disarm(),
  dash: () => dash(),
  openChest: () => openChest(),
  pray: () => pray(),
  restFire: () => restFire(),
  trade: () => { const o = merchantRoom(); if(o) openSheet(merchantSheet(o), 'merchant'); },
  floorInfo: () => openSheet(floorInfoSheet()),
  mbuy: a => { const o = merchantRoom(); if(!o) return; const f = findIn(o.items, a); if(!f) return; const p = merchantPrice(f.it); if(S.hero.gold < p || !roomFor(f.it)) return; S.hero.gold -= p; o.items.splice(f.i,1); addToBag(f.it); toast(`Bought ${itemName(f.it)}.`); save(); updateHud(); openSheet(merchantSheet(o),'merchant'); },
  toTown: () => { const notes = bankRun(); stats().returns++; goTown(notes.length ? `Home safe. ${notes.slice(0,3).join('. ')}.` : 'You return to Emberhold. Sell your loot at the shop.'); },
  deadToTown: () => { S.hero.hp = Math.round(heroStats().maxhp*.5); goTown(); },
  shopTab: a => { shopTab = a; render(); },
  buy: a => { const f = findIn(S.shop.items, a); if(!f) return; const p = itemValue(f.it); if(S.hero.gold < p || !roomFor(f.it)) return; S.hero.gold -= p; S.shop.items.splice(f.i,1); addToBag(f.it); closeSheet(); toast(`Bought ${itemName(f.it)}.`); save(); render(); },
  buyStaple: a => { const it = mk(a, stapleLvl()); const p = itemValue(it); if(S.hero.gold < p || !roomFor(it)) return; S.hero.gold -= p; addToBag(it); toast(`Bought ${itemName(it)}.`); save(); render(); },
  sell: a => { const list = findIn(S.hero.bag, a) ? S.hero.bag : (S.hero.belt||[]); const f = findIn(list, a); if(!f) return; const p = sellPrice(f.it); S.hero.gold += p; if((f.it.qty||1) > 1) f.it.qty--; else list.splice(f.i,1); closeSheet(); toast(`Sold for ${p} gold.`); save(); render(); },
  sellGear: () => { const gear = S.hero.bag.filter(isGear); const p = gear.reduce((a,it)=>a+sellPrice(it),0); S.hero.bag = S.hero.bag.filter(it => !isGear(it)); S.hero.gold += p; toast(`Sold ${gear.length} item${gear.length===1?'':'s'} for ${p} gold.`); save(); render(); },
  restock: () => { if(S.hero.gold < 15) return; S.hero.gold -= 15; S.shop = genShop(); save(); render(); },
  rest: () => { const c = restCost(); if(S.hero.gold < c) return; S.hero.gold -= c; S.hero.hp = heroStats().maxhp; toast('You sleep soundly. Health fully restored.'); save(); render(); },
  restFree: () => { const mx = heroStats().maxhp; S.hero.hp += Math.ceil((mx - S.hero.hp)/2); toast('The straw is itchy, but you feel better.'); save(); render(); },
  store: a => { const f = findIn(S.hero.bag, a); if(!f) return; S.hero.bag.splice(f.i,1); S.stash.push(f.it); closeSheet(); save(); render(); },
  retrieve: a => { const f = findIn(S.stash, a); if(!f || !roomFor(f.it)) return; S.stash.splice(f.i,1); addToBag(f.it); closeSheet(); save(); render(); },
  resetAsk: () => openSheet(`<div class="grab"></div><h3 class="sheet-title">Start a new character?</h3><p class="lead" style="margin-top:8px">This erases your level, gold, gear and stash.</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Keep playing</button><button class="btn primary" data-act="reset">Start over</button></div>`),
  openVault: () => { const r = R(), fl = r.floor, rm = fl.rooms[fl.cur]; if(rm.t!=='vault' || rm.done || !fl.hasKey) return;
    rm.done = true; const L = r.depth + 1, items = [rareItem(L), genItem(L)]; if(Math.random() < .5) items.push(genItem(L, 'scroll'));
    const gold = Math.round(rand(20,35)*r.depth*(1+heroStats().gold/100)); S.hero.gold += gold;
    r.reward = {kind:'chest', xp:0, gold, name:'vault'}; r.loot = items; r.tookAll = false; r.phase = 'loot'; stats().chests++; save(); render(); },
  idolYes: () => { const r = R(), rm = r.floor.rooms[r.floor.cur]; if(rm.t!=='idol' || rm.done) return;
    r.boons = r.boons || []; r.boons.push(rm.boon); rm.done = true; const B = BOONS[rm.boon];
    S.hero.hp = Math.min(S.hero.hp, heroStats().maxhp); r.msg = `You accept ${B.name}. ${cap(B.good)}, but ${B.bad}.`; save(); updateHud(); updateExplore(); },
  idolSmash: () => { const r = R(), rm = r.floor.rooms[r.floor.cur]; if(rm.t!=='idol' || rm.done) return; rm.done = true;
    if(Math.random() < .5){ const g = Math.round(rand(6,12)*r.depth); S.hero.gold += g; r.msg = `The idol cracks open. ${g} gold spills out.`; }
    else { const d = Math.max(1, Math.round(heroStats().maxhp*.12)); S.hero.hp = Math.max(1, S.hero.hp - d); ouch(); r.msg = `A scream fills the room. The idol’s curse burns you for ${d}.`; }
    save(); updateHud(); updateExplore(); },
  armoryOpen: () => { const r = R(), rm = r.floor.rooms[r.floor.cur]; if(rm.t!=='armory' || rm.done) return;
    openSheet(`<div class="grab"></div><h3 class="sheet-title">Armory Rack</h3><p class="sub">Take one. The others stay behind. Tap one to compare it with your gear.</p>
      <div class="rows" style="margin-top:8px">${rm.items.map(it => itemRow(it, 'rack', `<button class="btn sm" data-act="rackTake" data-arg="${it.uid}">Take</button>`)).join('')}</div>
      <div class="sheet-actions"><button class="btn" data-act="closeSheet">Leave them</button></div>`, 'rack'); },
  rackTake: a => { const r = R(), rm = r.floor.rooms[r.floor.cur]; if(rm.t!=='armory' || rm.done) return; const it = rm.items.find(x => x.uid===a); if(!it) return;
    if(!roomFor(it)){ toast('Your bag is full. Sell, drop or equip something to make room.'); openSheet(bagSheet(),'bag'); return; }
    addToBag(it); rm.done = true; rm.items = []; r.msg = `You take the ${itemName(it)}.`; closeSheet(); save(); render(); },
  harvest: () => { const r = R(), fl = r.floor, rm = fl.rooms[fl.cur]; if(rm.t!=='harvest' || rm.done) return; rm.done = true;
    const n = rand(2,4), t = runTrack(); t.mats[rm.mat] = (t.mats[rm.mat]||0) + n;
    if(Math.random() < .25){ rm.t = 'mon'; rm.done = false; rm.m = genMonster(r.depth, false, {fams: MATS[rm.mat].fams}); toast(`You find ${n} ${MATS[rm.mat].name}, and something finds you!`); save(); return startEncounter(fl.cur); }
    r.msg = `You gather ${n} ${MATS[rm.mat].name}. They’ll count once you’re home.`; save(); updateExplore(); },
  pryStone: () => { const r = R(), rm = r.floor.rooms[r.floor.cur]; if(rm.t!=='crevice' || rm.done) return;
    rm.done = true; runTrack().stones.push(rm.stone);
    r.msg = `You pry loose the <b>${stoneName(rm.stone)}</b>. It hums in your hand. Get it home alive, or it’s lost to the dark.`;
    toast(`You found the ${stoneName(rm.stone)}!`); save(); updateExplore(); },
  setStone: a => { S.stones = S.stones || {}; if(S.stones[a] !== 'held') return; S.stones[a] = 'placed';
    if(stonesPlaced() === STONES.length && !S.abyss){ S.abyss = true; save(); render(); return hobTalk('complete'); }
    else toast(`The ${stoneName(a)} slides into place. ${STONES.length - stonesPlaced()} to go.`);
    save(); render(); },
  enterDepths: a => { closeSheet(); enterDungeon(false, +a || 1); },
  enterAbyss: a => { closeSheet(); enterDungeon(true, +a || 1); },
  bestiary: () => openSheet(bestiarySheet(), 'bestiary'),
  beast: a => openSheet(beastSheet(a), 'beast'),
  buyPerk: a => { const p = PERKS[a]; if(!p) return; const l = perk(a); if(l >= p.max) return; const c = perkCost(a), need = perkRep(a);
    if(S.hero.gold < c || ((S.rep||{})[p.b]||0) < need) return;
    S.hero.gold -= c; S.perks = S.perks || {}; S.perks[a] = l+1;
    if(a==='drills') S.hero.points = (S.hero.points||0) + 1;
    if(a==='favor') S.shop = genShop();
    if(a==='pouch' || a==='holster'){ S.hero.belt = S.hero.belt || []; for(const it of S.hero.bag.filter(x => beltTakes(x))){ if(beltCount() + (it.qty||1) <= beltCap()){ S.hero.bag.splice(S.hero.bag.indexOf(it),1); addToBag(it); } } }
    toast(`${p.name} is now level ${l+1}.`); save(); render(); },
  acceptQuest: a => { const [b,id] = a.split('|'); const q = board(b).find(x => x.id===id); if(!q || q.status!=='offered') return; const cur = activeQuests()[0]; if(cur){ toast(`Finish or abandon “${cur.label}” first.`); return; } q.status = 'active'; q.have = 0; toast('Quest accepted. Progress counts when you make it back alive.'); save(); render(); if(sheetKind==='notice') openSheet(noticeSheet(),'notice'); },
  dropQuest: a => { const [b,id] = a.split('|'); const qs = board(b), i = qs.findIndex(x => x.id===id); if(i < 0) return; qs[i] = genQuest(b, qs[i].diff); save(); render(); },
  turnIn: a => { const [b,id] = a.split('|'); const qs = board(b), i = qs.findIndex(x => x.id===id), q = qs[i]; if(!q || !questReady(q)) return;
    if(q.kind==='gather') S.mats[q.target] -= q.need;
    const D = DIFF[q.diff]; S.hero.gold += D.gold; S.rep = S.rep || {}; S.rep[b] = (S.rep[b]||0) + D.rep; stats().quests++;
    qs[i] = genQuest(b, q.diff); toast(`Quest complete! +${D.gold} gold and +${D.rep} reputation.`); save(); render(); if(sheetKind==='notice') openSheet(noticeSheet(),'notice'); },
  buyRemedy: a => { const [base,lv,pre,suf] = a.split('|'); const it = mk(base, +lv, pre||null, suf||null), p = itemValue(it);
    if(S.hero.gold < p) return; if(!roomFor(it)) return toast('No room for it.'); S.hero.gold -= p; addToBag(it); toast(`Bought ${itemName(it)}.`); save(); render(); },
  reforge: a => { const [id,w] = a.split('|'); reforge(id, w); },
  townGo: a => townGo(a),
  rumor: () => toast(pick(RUMORS)),
  reset: () => { closeSheet(); newGame(); save(); render(); toast('A new adventurer arrives in Emberhold.'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el.dataset.arg, el);
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && sheetOpen()) closeSheet();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ============ boot ============ */
const hadOldSave = (() => { try{ return !localStorage.getItem(SAVE_KEY) && !!localStorage.getItem('affix-deep-v1'); }catch(e){ return false; } })();
if(!load()) newGame();
render();
if(hadOldSave){ toast('Gear works differently now, so a fresh character starts in Emberhold.'); try{ localStorage.removeItem('affix-deep-v1'); }catch(e){} save(); }
if(S.run && S.run.phase==='combat'){ if(S.run.pg < 100) advance(); }


</script>
</body>
